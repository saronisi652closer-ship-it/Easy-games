<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バッティング｜すきま脳トレ箱</title>
<meta name="theme-color" content="#EBF0F6">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../common/base.css">
<style>
.bt-hud{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;padding:0 2px 8px}
.bt-hud b{font:400 20px var(--display)}
.bt-box{position:relative;flex:1;min-height:0;margin-bottom:12px;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#3E8E4E}
.bt-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bt-over{position:absolute;inset:0;background:rgba(10,16,32,.6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}
.bt-over h3{font:400 26px var(--display);margin:0}.bt-over p{margin:0;font-weight:700;line-height:1.6}.bt-over .big{font:400 40px var(--display)}
.bt-balls{display:flex;gap:4px;justify-content:center;padding-bottom:8px}
.bt-balls i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);font:700 10px/17px var(--body);font-style:normal;text-align:center;color:var(--ink2);background:var(--card)}
.bt-balls i.hr{background:var(--mark);border-color:var(--ink);color:var(--markInk)}
.bt-balls i.hit{background:var(--okBg);border-color:var(--ok);color:var(--ok)}
.bt-balls i.out{background:var(--penBg);border-color:var(--pen);color:var(--pen)}
</style>
</head>
<body>
<div id="app">
<section class="view">
  <header class="bar"><a class="back" href="../index.html">‹ 戻る</a><h2>バッティング</h2><span class="timer" id="bt-best">ベスト 0m</span></header>
  <div class="bt-hud"><span>のこり <b id="bt-left">10</b>球</span><span>ホームラン <b id="bt-hr">0</b></span><span>合計 <b id="bt-sum">0</b>m</span></div>
  <div class="bt-balls" id="bt-balls"></div>
  <div class="bt-box" id="bt-box"><canvas id="bt-cv"></canvas></div>
</section>
</div>
<div id="layer"></div>
<script src="../common/save.js"></script>
<script src="../common/ui.js"></script>
<script src="../common/sfx.js"></script>
<script>
Save.ready.then(()=>{
const store=makeStore('bt_');
const cv=$('#bt-cv'),x=cv.getContext('2d');let W=360,H=520;
const PITCH={fast:{n:'ストレート',t:820},slow:{n:'スロー',t:1350},curve:{n:'カーブ',t:1080},change:{n:'チェンジアップ',t:1200,fake:820}};
let G=null,raf=0,best=store.get('best',0),bestSum=store.get('bestSum',0);
function size(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);draw(performance.now())}
function overlay(html,cb){$('#bt-box').querySelectorAll('.bt-over').forEach(o=>o.remove());if(!html)return;const o=document.createElement('div');o.className='bt-over';o.innerHTML=html;$('#bt-box').appendChild(o);if(cb)setTimeout(()=>o.onclick=cb,350)}
function hud(){$('#bt-left').textContent=G?10-G.n:10;$('#bt-hr').textContent=G?G.hr:0;$('#bt-sum').textContent=G?Math.round(G.sum):0;$('#bt-best').textContent=`ベスト ${best}m`;
  $('#bt-balls').innerHTML=[...Array(10)].map((_,i)=>{const r=G&&G.res[i];return `<i class="${r?r.c:''}">${r?r.s:''}</i>`}).join('')}
function title(){overlay(`<h3>バッティング</h3><p>投げられたボールが手前の白い線に来た瞬間にタップ！<br>早いと左へ、遅いと右へファウル</p><p>10球の合計飛距離で勝負。100m以上でホームラン</p><p>最長 ${best}m・合計ベスト ${bestSum}m</p><p style="color:#FFE58A">タップでスタート</p>`,start)}
function start(){G={n:0,hr:0,sum:0,res:[],ball:null,fly:null,msg:'',msgUntil:0};overlay(null);hud();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);setTimeout(pitch,900)}
function pitch(){if(!G||G.n>=10)return;const keys=Object.keys(PITCH),k=keys[Math.random()*keys.length|0],P=PITCH[k];
  G.ball={k,t0:performance.now()+700,dur:P.t*(0.92+Math.random()*.16),curve:k==='curve'?(Math.random()<.5?-1:1):0,swung:false};G.swing=0;G.msg=P.n;G.msgUntil=performance.now()+900}
function tap(){if(!G)return;const b=G.ball;if(!b||b.swung)return;const now=performance.now();if(now<b.t0)return;b.swung=true;G.swing=now;Sfx.play('jump');
  const off=now-(b.t0+b.dur);const a=Math.abs(off);let q=0;
  if(a<28)q=1;else if(a<60)q=.82;else if(a<100)q=.58;else if(a<150)q=.3;
  if(!q){return}
  const foul=a>=60&&Math.abs(off)>45&&Math.random()<.55;const spd=900/b.dur;
  let dist=Math.round((q*q*125+Math.random()*12)*(.85+spd*.25));
  const dir=clamp(-off/120,-1,1);
  b.hit=true;Sfx.play('punch');
  if(foul){result('ファウル','×','out',0)}
  else if(dist>=100){G.hr++;result(`ホームラン！ ${dist}m`,'HR','hr',dist);Sfx.play('clear')}
  else if(dist<18){result('ゴロ…','・','out',0)}
  else result(`ヒット ${dist}m`,dist,'hit',dist);
  G.fly={t0:now,dist:foul?40:dist,dir:foul?(off<0?-1.4:1.4):dir*.6}}
function result(m,s,c,d){G.res[G.n]={s,c};G.n++;G.sum+=d;if(d>best){best=d;store.set('best',best);G.newBest=true}G.msg=m;G.msgUntil=performance.now()+1600;hud();setTimeout(next,1800)}
function next(){if(!G)return;G.ball=null;G.fly=null;if(G.n>=10)return end();pitch()}
function end(){cancelAnimationFrame(raf);const nb=G.sum>bestSum;if(nb){bestSum=Math.round(G.sum);store.set('bestSum',bestSum)}store.set('plays',(store.get('plays',0)||0)+1);hud();Sfx.play(nb?'clear':'ok');
  overlay(`<h3>試合終了</h3><div class="big">${Math.round(G.sum)}m</div><p>${nb?'合計ベスト更新！<br>':''}ホームラン ${G.hr}本・最長 ${best}m</p><p style="color:#FFE58A">タップでもう一回</p>`,start)}
function loop(now){draw(now);const b=G&&G.ball;if(b&&!b.hit&&!b.done&&now>b.t0+b.dur+220){b.done=true;b.swung=true;Sfx.play('ng');result(G.swing&&G.swing>b.t0?'からぶり':'ストライク','×','out',0)}raf=requestAnimationFrame(loop)}
function draw(now){
  const sky=x.createLinearGradient(0,0,0,H*.35);sky.addColorStop(0,'#8FC8F0');sky.addColorStop(1,'#CFE8F8');x.fillStyle=sky;x.fillRect(0,0,W,H*.35);
  x.fillStyle='#3E8E4E';x.fillRect(0,H*.35,W,H);
  // 外野フェンス
  x.fillStyle='#2D5F86';x.fillRect(0,H*.3,W,H*.06);x.fillStyle='#fff';x.font='700 10px "Zen Kaku Gothic New",sans-serif';x.textAlign='center';x.fillText('100m',W/2,H*.34);
  // ダイヤモンド
  x.fillStyle='#C9A26B';x.beginPath();x.moveTo(W/2,H*.92);x.lineTo(W*.12,H*.62);x.lineTo(W/2,H*.44);x.lineTo(W*.88,H*.62);x.closePath();x.fill();
  x.fillStyle='#3E8E4E';x.beginPath();x.moveTo(W/2,H*.84);x.lineTo(W*.22,H*.63);x.lineTo(W/2,H*.5);x.lineTo(W*.78,H*.63);x.closePath();x.fill();
  x.fillStyle='#C9A26B';x.beginPath();x.ellipse(W/2,H*.6,W*.06,H*.022,0,0,7);x.fill();
  // ピッチャー（雪だるま）
  const px=W/2,py=H*.56;x.fillStyle='#fff';x.strokeStyle='#2B2B33';x.lineWidth=1.5;x.beginPath();x.arc(px,py,10,0,7);x.fill();x.stroke();x.beginPath();x.arc(px,py-14,7,0,7);x.fill();x.stroke();
  x.fillStyle='#D2433A';x.fillRect(px-8,py-23,16,4);
  // ホームの線
  const hy=H*.86;x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=3;x.beginPath();x.moveTo(W*.3,hy);x.lineTo(W*.7,hy);x.stroke();
  // ボール
  const b=G&&G.ball;
  if(b&&!b.hit&&now>=b.t0){let p=(now-b.t0)/b.dur;
    if(b.k==='change'){const pp=clamp(p,0,1.3);p=pp<.5?pp*1.4:.7+(pp-.5)*.6}
    if(p<=1.25){const yy=py-6+(hy-py+6)*p,xx=px+b.curve*Math.sin(Math.min(p,1)*Math.PI)*W*.12,r=3+p*9;
      x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(xx,yy+r+4,r,r*.35,0,0,7);x.fill();
      x.fillStyle='#fff';x.strokeStyle='#C8433A';x.lineWidth=1.2;x.beginPath();x.arc(xx,yy,r,0,7);x.fill();x.beginPath();x.arc(xx-r*.5,yy,r*.7,-1,1);x.stroke()}}
  if(G&&G.fly){const t=(now-G.fly.t0)/1200,k=Math.min(1,t),reach=clamp(G.fly.dist/110,0,1.3);
    const fx=W/2+G.fly.dir*W*.45*k*reach,fy=hy-(hy-H*.32)*k*reach-Math.sin(k*Math.PI)*H*.25*reach,r=Math.max(2,10-k*7);
    x.fillStyle='#fff';x.beginPath();x.arc(fx,fy,r,0,7);x.fill()}
  // バッター（バット）
  const sw=G&&G.swing?Math.min(1,(now-G.swing)/140):0,ang=-2.3+sw*2.9;
  x.save();x.translate(W*.58,H*.9);x.rotate(ang);x.fillStyle='#C98E5E';x.strokeStyle='#2B2B33';x.lineWidth=2;x.beginPath();x.roundRect(-4,-70,9,74,4);x.fill();x.stroke();x.restore();
  x.fillStyle='#fff';x.strokeStyle='#2B2B33';x.lineWidth=2;x.beginPath();x.arc(W*.66,H*.92,16,0,7);x.fill();x.stroke();x.fillStyle='#2F63D3';x.beginPath();x.arc(W*.66,H*.92-6,15,Math.PI,0);x.fill();
  if(G&&now<G.msgUntil){x.fillStyle='rgba(24,38,74,.75)';x.beginPath();x.roundRect(W/2-90,H*.12,180,34,17);x.fill();x.fillStyle='#fff';x.font='900 16px "Zen Kaku Gothic New",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(G.msg,W/2,H*.12+17)}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tap()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.n<10&&G.ball&&!G.ball.swung){G.ball.t0=performance.now()+1500}});
new ResizeObserver(size).observe($('#bt-box'));Save.touch({game:'batting'});hud();size();raf=requestAnimationFrame(t=>draw(t));title();
});
</script>
<script>regSW('../sw.js')</script>
</body>
</html>
