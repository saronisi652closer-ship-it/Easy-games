<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EBF0F6">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../common/base.css">
<title>エビワラージャンケン｜すきま脳トレ箱</title>
<style>.bar .back{flex:none}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: 携帯ゲーム機の対戦画面 — 上に相手の情報と立ち位置、手前に自分の後ろ姿、下にメッセージ窓と技のパネル。周りは すきま脳トレ箱 の方眼ノート */
:root{
  --paper:#EBF0F6; --grid:#D9E1EC; --card:#FFFFFF; --ink:#18264A; --ink2:#5B6886; --line:#C2CDDD;
  --mark:#F7C843; --markInk:#18264A; --red:#D2433A; --ok:#2B8A57;
  --dot:"DotGothic16","Hiragino Sans","Noto Sans JP",monospace;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  /* 対戦画面の中は昼の草原で固定 */
  --sky1:#F8F0D8; --sky2:#E3F0D2; --grass:#B9DB8E; --plat:#8FC46A; --platEdge:#6FA650;
  --box:#FBFBF4; --boxEdge:#3A3A3A; --boxShade:#B8B8AA; --hpBg:#4A4A4A; --hpG:#3FD16A; --hpY:#F2C431; --hpR:#E8483A;
  --win:#FFFFFF; --winEdge:#3A4E7A; --winIn:#6C84B8; --txt:#2B2B33;
  --fight:#C2582E; --fightLo:#8E3A1C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827; --grid:#1A2335; --card:#1B2438; --ink:#E4E9F3; --ink2:#97A3BD; --line:#33405A;
  --mark:#F2C23A; --markInk:#18264A; --red:#FF6B5F; --ok:#4FC283;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --grid:#1A2335; --card:#1B2438; --ink:#E4E9F3; --ink2:#97A3BD; --line:#33405A;
  --mark:#F2C23A; --markInk:#18264A; --red:#FF6B5F; --ok:#4FC283;
  color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
button{font-family:var(--body);color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px 12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:8px}
.bar h1{font:400 18px var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{font:700 13px var(--body);font-variant-numeric:tabular-nums;background:var(--mark);color:var(--markInk);padding:4px 10px;border-radius:6px;white-space:nowrap}

/* ===== 対戦画面 ===== */
.screen{border:3px solid #2B2B33;border-radius:12px;overflow:hidden;background:#2B2B33;display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.field{position:relative;aspect-ratio:16/12;max-height:50vh;max-height:50dvh;width:100%;overflow:hidden;
  background:linear-gradient(var(--sky1) 0%,var(--sky2) 55%,var(--grass) 55%,var(--grass) 100%)}
.field::before{content:"";position:absolute;left:0;right:0;top:55%;height:2px;background:rgba(0,0,0,.06)}
.plat{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,var(--plat) 55%,var(--platEdge) 100%)}
.plat.cpu{right:4%;top:34%;width:44%;height:14%}
.plat.me{left:-6%;bottom:-4%;width:58%;height:18%}
.mon{position:absolute;z-index:2;transition:transform .5s ease,opacity .5s}
.mon svg{width:100%;height:100%;display:block}
#fCpu{right:10%;top:3%;width:32%;aspect-ratio:1}
#fMe{left:0;bottom:-8%;width:42%;aspect-ratio:1}
.mon.enter-l{transform:translateX(-140%)} .mon.enter-r{transform:translateX(140%)}
.mon.atk-me{animation:atkMe .32s ease} .mon.atk-cpu{animation:atkCpu .32s ease}
@keyframes atkMe{45%{transform:translate(18%,-12%)}} @keyframes atkCpu{45%{transform:translate(-18%,10%)}}
.mon.blink{animation:blink .6s steps(1) 1}
@keyframes blink{0%,33%,66%{opacity:0}16%,50%,83%{opacity:1}}
.mon.focus svg{filter:drop-shadow(0 0 6px #FF8A3D) drop-shadow(0 0 12px #FFB13D)}
.mon.faint{transform:translateY(70%);opacity:0}
.burst{position:absolute;z-index:3;width:26%;aspect-ratio:1;pointer-events:none;animation:burst .38s ease-out forwards}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.2);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.on{animation:flash .25s ease-out}
@keyframes flash{30%{opacity:.75}}

/* 情報ボックス */
.ibox{position:absolute;z-index:5;background:var(--box);border:2.5px solid var(--boxEdge);color:var(--txt);font-family:var(--dot);
  box-shadow:inset 0 -3px 0 var(--boxShade);padding:5px 9px 6px;display:flex;flex-direction:column;gap:3px;min-width:50%}
.ibox.cpu{left:3%;top:6%;border-radius:4px 14px 4px 4px}
.ibox.me{right:3%;bottom:6%;border-radius:14px 4px 4px 4px}
.ibox .nm{display:flex;align-items:baseline;gap:6px;font-size:14px;line-height:1.1}
.ibox .nm b{font-weight:400;flex:1;white-space:nowrap}
.ibox .nm span{font-size:12px}
.ibox .tag{font-size:10px;color:#666;line-height:1}
.hprow{display:flex;align-items:center;gap:4px}
.hprow em{font:700 9px var(--body);font-style:normal;background:var(--hpBg);color:#F2C431;padding:0 4px;border-radius:3px;line-height:13px;letter-spacing:.05em}
.hpbar{flex:1;height:7px;background:var(--hpBg);border-radius:4px;padding:1.5px;display:flex}
.hpbar i{display:block;height:100%;width:100%;background:var(--hpG);border-radius:3px}
.hpbar i.mid{background:var(--hpY)} .hpbar i.low{background:var(--hpR)}
.hpnum{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.verdict{position:absolute;left:50%;top:44%;transform:translateX(-50%);z-index:6;background:rgba(43,43,51,.82);color:#fff;font:400 12px var(--dot);padding:3px 10px;border-radius:999px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}

/* メッセージ窓 */
.win{position:relative;background:var(--win);margin:0 3px;border:3px solid var(--winEdge);border-radius:8px;box-shadow:inset 0 0 0 2px var(--winIn);
  min-height:4.4em;padding:9px 14px;font:400 16px/1.55 var(--dot);color:var(--txt)}
.win .more{position:absolute;right:10px;bottom:6px;color:#E8483A;font-size:12px;animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(2px)}}

/* 技パネル */
.cmd{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:3px 3px 4px;background:#2B2B33}
.mv{position:relative;border:2px solid #fff;outline:2px solid var(--fightLo);background:linear-gradient(var(--fight),#A84522);color:#fff;border-radius:10px;
  padding:8px 10px 7px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-family:var(--dot);text-align:left;min-height:56px}
.mv:active:not(:disabled){filter:brightness(1.12);transform:translateY(1px)}
.mv:disabled{filter:grayscale(.7) brightness(.8)}
.mv .n{font-size:16px;line-height:1.1;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.mv .s{font-size:11px;opacity:.95;display:flex;gap:8px;width:100%}
.mv .s b{font-weight:400;background:rgba(0,0,0,.25);padding:0 5px;border-radius:3px}
.mv .s span:last-child{margin-left:auto}
.mv.empty{background:#4A4A55;outline-color:#2B2B33;border-color:#6A6A75;color:#9A9AA5;cursor:default;align-items:center;justify-content:center}
.mv .pri{position:absolute;right:8px;top:7px;font-size:10px;background:#fff;color:var(--fightLo);border-radius:3px;padding:0 4px}

/* 流れ・下のボタン */
.hist{display:flex;gap:4px;overflow-x:auto;min-height:26px;align-items:center;scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hist .t{flex:none;display:flex;flex-direction:column;align-items:center;font:400 9.5px/1.2 var(--dot);border:1px solid var(--line);border-radius:5px;padding:2px 4px;background:var(--card)}
.hist .t span:first-child{color:var(--red)}
.hist .empty{font-size:11.5px;color:var(--ink2)}
.foot{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.icon-btn{border:1.5px solid var(--ink);background:var(--card);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px;white-space:nowrap}

/* シート */
.scrim{position:fixed;inset:0;background:rgba(10,16,32,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:520px;max-height:86%;overflow:auto;background:var(--paper);border-radius:16px 16px 0 0;border:2px solid var(--ink);border-bottom:0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font:400 19px var(--display);margin:0}
.sheet h3{font-size:13px;margin:4px 0 0;color:var(--ink2)}
.sheet p{margin:0;font-size:13.5px;line-height:1.65}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;background:var(--card)}
th,td{border:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{background:var(--grid);font-weight:900;white-space:nowrap}
td.w{color:var(--ok);font-weight:700} td.l{color:var(--red);font-weight:700} td.e{color:var(--ink2)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt label{font-size:13px;font-weight:700}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:8px 6px;font-weight:700;font-size:12.5px;color:var(--ink2);min-width:0}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.note{font-size:12px;color:var(--ink2);line-height:1.6}
.big-btn{border:2px solid var(--ink);background:var(--mark);color:var(--markInk);border-radius:12px;padding:12px;font-weight:900;font-size:15px}
.ghost-btn{border:1.5px solid var(--ink);background:var(--card);border-radius:12px;padding:10px;font-weight:700;font-size:14px}
.result{font:400 30px var(--display);text-align:center;margin:4px 0 0}
.result.win2{color:var(--ok)} .result.lose{color:var(--red)}
.rev{text-align:center;font-size:14px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:11px;color:var(--ink2)}
.stats b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.loglist{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.55}
.loglist .turn{font-weight:900;margin-top:6px;color:var(--ink2);font-size:12px}
@media (max-height:680px){.field{max-height:38vh;max-height:38dvh}.win{min-height:3.6em;font-size:15px;padding:7px 12px}.mv{min-height:48px;padding:6px 9px 5px}.mv .n{font-size:15px}}
@media (prefers-reduced-motion: reduce){.mon,.burst,.flash,.win .more{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header class="bar">
    <a class="back" href="../index.html">‹ 戻る</a>
    <h1>エビワラージャンケン</h1>
    <span class="streak" id="streak">0連勝</span>
  </header>

  <div class="screen">
    <div class="field" id="ring">
      <div class="plat cpu"></div><div class="plat me"></div>
      <div class="mon" id="fCpu"></div>
      <div class="mon" id="fMe"></div>
      <div class="ibox cpu">
        <div class="nm"><b>エビワラー</b><span>Lv50</span></div>
        <div class="tag" id="cpuWho">せいかく：？？？</div>
        <div class="hprow"><em>HP</em><div class="hpbar"><i id="hpCpu"></i></div></div>
      </div>
      <div class="ibox me">
        <div class="nm"><b>エビワラー</b><span>Lv50</span></div>
        <div class="tag" id="meAb"></div>
        <div class="hprow"><em>HP</em><div class="hpbar"><i id="hpMe"></i></div></div>
        <div class="hpnum" id="meHp">157/ 157</div>
      </div>
      <div class="flash" id="flash"></div>
    </div>
    <div class="win" id="msg" aria-live="polite"></div>
    <div class="cmd" id="moves"></div>
  </div>

  <div class="hist" id="hist"></div>
  <div class="foot">
    <button class="icon-btn" id="bHelp" type="button">相性とダメージ</button>
    <button class="icon-btn" id="bLog" type="button">ログ</button>
    <button class="icon-btn" id="bSet" type="button">設定</button>
    <button class="icon-btn" id="bNew" type="button">やり直す</button>
  </div>
</div>
<div id="layer"></div>

<script src="../common/save.js"></script>
<script src="../common/ui.js"></script>
<script src="../common/sfx.js"></script>
<script>
Save.ready.then(()=>{
/* ================= data ================= */
const MOVES={
  focus:{key:'focus',name:'きあいパンチ',pow:150,pri:-3,pp:20,punch:true},
  mach:{key:'mach',name:'マッハパンチ',pow:40,pri:1,pp:30,punch:true},
  upper:{key:'upper',name:'はやてがえし',pow:65,pri:3,pp:15,punch:false},
};
const ORDER=['focus','mach','upper'];
const BEATS={mach:'focus',upper:'mach',focus:'upper'}; // key beats value
const COUNTER={focus:'mach',mach:'upper',upper:'focus'}; // to beat X, play COUNTER[X]
// Hitmonchan base stats
const BASE={hp:50,atk:105,def:79,spe:76};
const ABIL={iron:'てつのこぶし',inner:'せいしんりょく',keen:'するどいめ'};
const PERS={
  random:{name:'きまぐれ',hint:'3つの技をほぼ均等に出す'},
  focus:{name:'一撃狙い',hint:'きあいパンチが大好き'},
  reader:{name:'読みの名人',hint:'あなたのよく出す技を読んで、それに勝つ技を出す'},
  deep:{name:'裏の裏',hint:'あなたが自分の前の手に勝ちに来ると読んで、さらにその裏を取る'},
};

/* ================= storage ================= */
const store=makeStore('pj_');
const S=Object.assign({ability:'iron',speed:'tie',crit:true,roll:true,cpu:'auto',fast:false},store.get('settings',{}));
const REC=Object.assign({streak:0,best:0,win:0,lose:0},store.get('rec',{}));

/* ================= stats & damage ================= */
const L=50;
function stat(base,ev,nat,isHp){const v=Math.floor((2*base+31+Math.floor(ev/4))*L/100);return isHp?v+L+10:Math.floor((v+5)*nat)}
// いじっぱり H252 A252 S4 を基本に、素早さの関係だけ設定で変える
function makeMon(side){
  const spe=stat(BASE.spe,4,1);
  let s=spe;
  if(S.speed==='faster')s=side===0?spe+1:spe;
  if(S.speed==='slower')s=side===0?spe:spe+1;
  return {side,hp:stat(BASE.hp,252,1,true),max:stat(BASE.hp,252,1,true),atk:stat(BASE.atk,252,1.1),def:stat(BASE.def,0,1),spe:s,
    ability:S.ability,pp:{focus:20,mach:30,upper:15}};
}
const pokeRound=x=>{const f=Math.floor(x);return x-f>0.5?f+1:f};
function power(mon,mv){return mv.punch&&mon.ability==='iron'?pokeRound(mv.pow*4915/4096):mv.pow}
function baseDmg(a,d,mv){return Math.floor(Math.floor(Math.floor(2*L/5+2)*power(a,mv)*a.atk/d.def)/50)+2}
function finalDmg(a,d,mv,crit,r){let x=baseDmg(a,d,mv);if(crit)x=Math.floor(x*1.5);x=Math.floor(x*r/100);x=pokeRound(x*1.5);return Math.max(1,x)}
function range(a,d,mv){return [finalDmg(a,d,mv,false,85),finalDmg(a,d,mv,false,100)]}

/* ================= battle state ================= */
let B=null,busy=false;
function newMatch(){
  const pers=S.cpu==='auto'?['random','focus','reader','deep'][Math.random()*4|0]:S.cpu;
  B={me:makeMon(0),cpu:makeMon(1),pers,hidden:S.cpu==='auto',turn:0,hist:[],log:[],over:false};
  renderAll();intro();
}

/* ================= CPU ================= */
function weighted(w){const t=w.focus+w.mach+w.upper;let r=Math.random()*t;for(const k of ORDER){if((r-=w[k])<0)return k}return 'mach'}
function cpuChoose(){
  const h=B.hist,cpu=B.cpu,me=B.me;
  let w={focus:1,mach:1,upper:1};
  if(B.pers==='focus')w={focus:2.4,mach:.8,upper:.8};
  if(B.pers==='reader'&&h.length){
    const recent=h.slice(-4).map(t=>t.me),cnt={focus:0,mach:0,upper:0};
    recent.forEach((m,i)=>cnt[m]+=1+i*.5);
    const pred=ORDER.reduce((a,b)=>cnt[b]>cnt[a]?b:a);
    w={focus:.5,mach:.5,upper:.5};w[COUNTER[pred]]=3;
  }
  if(B.pers==='deep'&&h.length){
    const myLast=h[h.length-1].cpu,pred=COUNTER[myLast];
    w={focus:.5,mach:.5,upper:.5};w[COUNTER[pred]]=3;
  }
  // とどめが取れるならマッハパンチ寄り
  const machMin=range(cpu,me,MOVES.mach)[0];
  if(me.hp<=machMin&&B.pers!=='random')w.mach+=1.5;
  for(const k of ORDER)if(cpu.pp[k]<=0)w[k]=0;
  return weighted(w);
}

/* ================= turn resolution ================= */
const sleep=ms=>new Promise(r=>setTimeout(r,S.fast?ms*.45:ms));
const nm=m=>m.side===0?'エビワラー':'あいての エビワラー';
let typing=null;
function setMsg(t,instant){
  const el=$('#msg');if(typing){clearInterval(typing.iv);typing=null}
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=t;return Promise.resolve()}
  return new Promise(res=>{let i=0;el.textContent='';const step=S.fast?1:1,spd=S.fast?12:28;
    typing={t,iv:setInterval(()=>{i+=step;el.textContent=t.slice(0,i);if(i>=t.length){clearInterval(typing.iv);typing=null;res()}},spd),res};})
}
function waitMark(on){const el=$('#msg');const m=el.querySelector('.more');if(on&&!m)el.insertAdjacentHTML('beforeend','<span class="more">▼</span>');if(!on&&m)m.remove()}
async function say(t,ms=700){B.log.push(t);await setMsg(t);waitMark(true);await sleep(ms);waitMark(false)}
async function playTurn(myMove){
  if(busy||B.over)return;busy=true;renderMoves();Sfx.play('tap');
  const cpuMove=cpuChoose();
  B.turn++;B.log.push({turn:B.turn});
  const mons=[B.me,B.cpu],choice=[myMove,cpuMove];
  const st=mons.map((m,i)=>({mon:m,move:MOVES[choice[i]],moved:false,damaged:false,flinch:false}));
  st[0].foe=st[1];st[1].foe=st[0];
  const tieWinner=Math.random()<.5?0:1;
  const order=[...st].sort((a,b)=>b.move.pri-a.move.pri||b.mon.spe-a.mon.spe||(a.mon.side===tieWinner?-1:1));
  const tieMatters=st[0].move.pri===st[1].move.pri&&st[0].mon.spe===st[1].mon.spe;
  for(const s of st)if(s.move.key==='focus'){fighter(s.mon).classList.add('focus');await say(`${nm(s.mon)}は 集中力を 高めている！`,650)}
  if(tieMatters)B.log.push(`（同速勝負：${order[0].mon.side===0?'あなた':'あいて'}が先）`);
  for(const s of order){
    const me=s.mon,foe=s.foe;
    if(me.hp<=0||foe.mon.hp<=0)break;
    if(s.flinch){s.moved=true;await say(`${nm(me)}は ひるんで 技が だせない！`);continue}
    me.pp[s.move.key]--;renderMoves();
    await say(`${nm(me)}の ${s.move.name}！`,350);
    s.moved=true;
    if(s.move.key==='focus'&&s.damaged){fighter(me).classList.remove('focus');await say(`${nm(me)}は 集中が 途切れて 技が 出せない！`);continue}
    if(s.move.key==='upper'){
      const ok=!foe.moved&&foe.move.pri>=1&&foe.move.pri<=3;
      if(!ok){await say('しかし うまく 決まらなかった！');continue}
    }
    fighter(me).classList.remove('focus');
    await strike(me,foe.mon,s.move);
    foe.damaged=true;
    if(s.move.key==='upper'&&!foe.moved&&foe.mon.hp>0){
      if(foe.mon.ability==='inner')await say(`${nm(foe.mon)}は せいしんりょくで ひるまない！`,650);
      else foe.flinch=true;
    }
    if(foe.mon.hp<=0){fighter(foe.mon).classList.add('faint');Sfx.play('ng');await say(`${nm(foe.mon)}は たおれた！`,900)}
  }
  mons.forEach(m=>fighter(m).classList.remove('focus'));
  B.hist.push({me:myMove,cpu:cpuMove});renderHist();
  showVerdict(myMove,cpuMove);
  if(B.me.hp<=0||B.cpu.hp<=0){await endMatch();}
  else{
    if(ORDER.every(k=>B.me.pp[k]<=0)){B.me.hp=0;await say('つかえる 技が なくなった！');await endMatch();}
    else setMsg('エビワラーは どうする？',true);
  }
  busy=false;renderMoves();
}
async function strike(a,d,mv){
  const crit=S.crit&&Math.random()<1/24;
  const r=S.roll?85+(Math.random()*16|0):100;
  const dmg=Math.min(d.hp,finalDmg(a,d,mv,crit,r));
  const f=fighter(a),cls=a.side===0?'atk-me':'atk-cpu';f.classList.remove('atk-me','atk-cpu');void f.offsetWidth;f.classList.add(cls);
  await sleep(140);
  Sfx.play('punch');burst(d,mv);if(crit){const fl=$('#flash');fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on')}
  const g=fighter(d);g.classList.remove('blink');void g.offsetWidth;g.classList.add('blink');
  const before=d.hp;d.hp-=dmg;
  await animateHp(d,before);
  B.log.push(`→ ${nm(d)}に ${dmg}ダメージ（${Math.round(dmg/d.max*100)}%）`);
  if(crit)await say('きゅうしょに あたった！',600);
}
function burst(d,mv){const host=$('#ring'),t=fighter(d).getBoundingClientRect(),h=host.getBoundingClientRect();
  const b=document.createElement('div');b.className='burst';
  b.innerHTML=`<svg viewBox="0 0 100 100"><polygon points="${[...Array(16)].map((_,i)=>{const a=i*Math.PI/8,rr=i%2?22:48;return `${50+Math.cos(a)*rr},${50+Math.sin(a)*rr}`}).join(' ')}" fill="${mv.key==='focus'?'#FF8A3D':mv.key==='mach'?'#FFE36B':'#FFFFFF'}" stroke="#2B2B33" stroke-width="3"/></svg>`;
  b.style.left=(t.left-h.left+t.width*.37)+'px';b.style.top=(t.top-h.top+t.height*.25)+'px';host.appendChild(b);setTimeout(()=>b.remove(),420)}
function animateHp(m,from){return new Promise(res=>{const to=Math.max(0,m.hp),t0=performance.now(),dur=Math.min(900,Math.max(300,(from-to)*6));
  const tick=t=>{const k=Math.min(1,(t-t0)/dur),v=Math.round(from+(to-from)*k);drawHp(m,v);if(k<1)requestAnimationFrame(tick);else res()};requestAnimationFrame(tick)})}
function verdictText(a,b){
  if(a===b)return `どちらも ${MOVES[a].name}`;
  if(BEATS[a]===b)return `あなたの ${MOVES[a].name} の勝ち`;
  return `あいての ${MOVES[b].name} の勝ち`;
}
let vT=null;
function showVerdict(a,b){
  const old=document.querySelector('.verdict');if(old)old.remove();
  const v=document.createElement('div');v.className='verdict';v.textContent=verdictText(a,b);$('#ring').appendChild(v);
  clearTimeout(vT);vT=setTimeout(()=>v.remove(),2600);
}
async function endMatch(){
  B.over=true;const win=B.cpu.hp<=0&&B.me.hp>0;
  Sfx.play(win?'clear':'lose');
  if(win){REC.win++;REC.streak++;REC.best=Math.max(REC.best,REC.streak)}else{REC.lose++;REC.streak=0}
  store.set('rec',REC);renderAll(true);
  await say(win?'しょうぶに かった！':'めのまえが まっしろに なった…',500);
  const p=PERS[B.pers];
  sheet(`<p class="result ${win?'win2':'lose'}">${win?'勝ち！':'負け…'}</p>
    <p class="rev">あいての性格は「${p.name}」<br><span class="note">${p.hint}</span></p>
    <div class="stats"><div>連勝<b>${REC.streak}</b></div><div>最高連勝<b>${REC.best}</b></div><div>通算<b>${REC.win}勝${REC.lose}敗</b></div></div>
    <button class="big-btn" data-act="next" type="button">${win?'次の相手と戦う':'もう一度'}</button>`,false);
}

/* ================= rendering ================= */
const $=s=>document.querySelector(s);
const fighter=m=>m.side===0?$('#fMe'):$('#fCpu');
// オリジナルのモンスター「パンチの子」（正面：あいて／後ろ姿：じぶん）。グローブの色で見分ける

  <rect x="13" y="57" width="12" height="5" rx="2" fill="#fff" stroke="${INK}" stroke-width="1.4"/><rect x="75" y="57" width="12" height="5" rx="2" fill="#fff" stroke="${INK}" stroke-width="1.4"/>
  </svg>`}
function backSVG(){return `<svg viewBox="0 0 100 100" aria-hidden="true">
  <ellipse cx="50" cy="86" rx="31" ry="26" fill="${FUR}" stroke="${INK}" stroke-width="2.4"/>
  <path d="M27 40L20 12L44 28Z" fill="${FUR}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/><path d="M73 40L80 12L56 28Z" fill="${FUR}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"/>

  </svg>`}
function hpClass(p){return p>50?'':p>20?'mid':'low'}
function drawHp(m,v){const pct=Math.max(0,v/m.max*100);
  const el=$(m.side===0?'#hpMe':'#hpCpu');el.style.width=pct+'%';el.className=hpClass(pct);
  if(m.side===0)$('#meHp').textContent=`${Math.max(0,v)}/ ${m.max}`}
function renderHp(){drawHp(B.me,B.me.hp);drawHp(B.cpu,B.cpu.hp)}
function renderMoves(){
  $('#moves').innerHTML=ORDER.map(k=>{const m=MOVES[k],pp=B.me.pp[k];
    return `<button class="mv ${k}" type="button" data-mv="${k}" ${busy||B.over||pp<=0?'disabled':''}>
      <span class="pri">${m.pri>0?'+':''}${m.pri}</span><span class="n">${m.name}</span><span class="s"><b>かくとう</b><span>PP ${pp}/${m.pp}</span></span></button>`}).join('')
    +'<button class="mv empty" type="button" disabled>－</button>';
}
function renderHist(){
  const h=B.hist;
  $('#hist').innerHTML=h.length?h.map((t,i)=>`<div class="t" title="${i+1}ターン目"><span>${MOVES[t.cpu].name.slice(0,2)}</span><span>${MOVES[t.me].name.slice(0,2)}</span></div>`).join('')
    :'<span class="empty">上が あいて、下が あなたの出した技。流れを読もう</span>';
  $('#hist').scrollLeft=1e6;
}
function renderAll(keep){
  if(!keep){$('#fMe').innerHTML=backSVG();$('#fCpu').innerHTML=frontSVG()}
  $('#fMe').className='mon'+(B.me.hp<=0?' faint':'');$('#fCpu').className='mon'+(B.cpu.hp<=0?' faint':'');
  $('#cpuWho').textContent='せいかく：'+(B.hidden&&!B.over?'？？？':PERS[B.pers].name);
  $('#meAb').textContent='とくせい：'+ABIL[B.me.ability];
  $('#streak').textContent=`${REC.streak}連勝`;
  renderHp();renderMoves();renderHist();
}
async function intro(){
  busy=true;renderMoves();
  const c=$('#fCpu'),m=$('#fMe');c.classList.add('enter-r');m.classList.add('enter-l');
  await sleep(60);c.classList.remove('enter-r');
  await say('あいての エビワラーが しょうぶを しかけてきた！',600);
  m.classList.remove('enter-l');
  await say('ゆけっ！ エビワラー！',450);
  busy=false;renderMoves();setMsg('エビワラーは どうする？',true);
}

/* ================= sheets ================= */
function sheet(html,closable=true){
  $('#layer').innerHTML=`<div class="scrim" id="scrim"><div class="sheet">${html}${closable?'<button class="ghost-btn" data-act="close" type="button">閉じる</button>':''}</div></div>`;
  $('#scrim').onclick=e=>{
    if(e.target.id==='scrim'&&closable)return closeSheet();
    const b=e.target.closest('[data-act]');if(!b)return;
    const a=b.dataset.act;
    if(a==='close')closeSheet();
    if(a==='next'){closeSheet();newMatch();}
    if(a==='apply'){closeSheet();newMatch();}
  };
}
function closeSheet(){$('#layer').innerHTML=''}
function helpSheet(){
  const a=B.me,d=B.cpu;
  const row=k=>{const[r1,r2]=range(a,d,MOVES[k]);return `<tr><th>${MOVES[k].name}</th><td>${r1}〜${r2}</td><td>${Math.round(r1/d.max*100)}〜${Math.round(r2/d.max*100)}%</td></tr>`};
  sheet(`<h2>相性とダメージ</h2>
  <p>3つの技は優先度のおかげで三すくみになっています。</p>
  <div class="tbl"><table>
    <tr><th>あなた＼あいて</th><th>きあいパンチ</th><th>マッハパンチ</th><th>はやてがえし</th></tr>
    <tr><th>きあいパンチ</th><td class="e">速い方だけ当たる</td><td class="l">先に殴られて失敗</td><td class="w">相手は失敗、こちらが当たる</td></tr>
    <tr><th>マッハパンチ</th><td class="w">先に当てて集中を切る</td><td class="e">お互い当たる</td><td class="l">先に殴られてひるむ</td></tr>
    <tr><th>はやてがえし</th><td class="l">失敗して殴られる</td><td class="w">先に当ててひるませる</td><td class="e">速い方が成功、遅い方はひるむ</td></tr>
  </table></div>
  <h3>ダメージの目安（乱数85〜100%、急所なし）</h3>
  <div class="tbl"><table><tr><th>技</th><th>ダメージ</th><th>割合</th></tr>${ORDER.map(row).join('')}</table></div>
  <p class="note">絵はオリジナルのモンスターです。お互い いじっぱり H252 A252 S4（HP${a.max}・攻撃${a.atk}・防御${a.def}・素早さ${a.spe}）のレベル50。はやてがえしは、相手が優先度+1〜+3の技を選んでいて、まだ動いていないときだけ成功します。</p>`);
}
function logSheet(){
  const h=B.log.map(l=>typeof l==='object'?`<div class="turn">ターン${l.turn}</div>`:`<div>${l}</div>`).join('');
  sheet(`<h2>ログ</h2><div class="loglist">${h||'<div class="note">まだ何も起きていません</div>'}</div>`);
}
function setSheet(){
  const seg=(key,opts)=>`<div class="seg" data-key="${key}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(S[key])===String(v)}">${l}</button>`).join('')}</div>`;
  sheet(`<h2>設定</h2>
  <div class="opt"><label>特性（お互い同じ）</label>${seg('ability',[['iron','てつのこぶし'],['inner','せいしんりょく'],['keen','するどいめ']])}
    <p class="note">てつのこぶし：きあいパンチ・マッハパンチの威力1.2倍（はやてがえしはパンチ技でない扱い）。せいしんりょく：はやてがえしでひるまない。</p></div>
  <div class="opt"><label>素早さ</label>${seg('speed',[['tie','同速'],['faster','自分が速い'],['slower','自分が遅い']])}</div>
  <div class="opt"><label>あいての性格</label>${seg('cpu',[['auto','おまかせ'],['random','きまぐれ'],['focus','一撃狙い'],['reader','読み'],['deep','裏の裏']])}
    <p class="note">おまかせだと、試合が終わるまで性格は隠れています。</p></div>
  <div class="opt"><label>急所</label>${seg('crit',[['true','あり'],['false','なし']])}</div>
  <div class="opt"><label>ダメージ乱数</label>${seg('roll',[['true','あり'],['false','なし（最大値）']])}</div>
  <div class="opt"><label>メッセージの速さ</label>${seg('fast',[['false','ふつう'],['true','はやい']])}</div>
  <button class="big-btn" data-act="apply" type="button">この設定で新しく始める</button>`);
  $('.sheet').addEventListener('click',e=>{const b=e.target.closest('.seg button');if(!b)return;
    const key=b.parentElement.dataset.key;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;S[key]=v;store.set('settings',S);
    for(const x of b.parentElement.children)x.setAttribute('aria-pressed',String(x===b));});
}

/* ================= events ================= */
$('#moves').addEventListener('click',e=>{const b=e.target.closest('[data-mv]');if(b&&!b.disabled)playTurn(b.dataset.mv)});
$('#msg').addEventListener('click',()=>{if(typing){const el=$('#msg');clearInterval(typing.iv);el.textContent=typing.t;const r=typing.res;typing=null;r()}});
$('#bHelp').onclick=helpSheet;$('#bLog').onclick=logSheet;$('#bSet').onclick=setSheet;
$('#bNew').onclick=()=>{if(busy)return;if(!B.over&&B.turn>0){REC.streak=0;store.set('rec',REC)}newMatch()};
document.addEventListener('keydown',e=>{if($('#layer').innerHTML)return;const k={'1':'focus','2':'mach','3':'upper'}[e.key];if(k)playTurn(k)});
if(typeof Sfx==='undefined')window.Sfx={play(){}};
newMatch();
Save.touch({game:'punch'});
});
</script>
<script>regSW('../sw.js')</script>
