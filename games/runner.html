<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>坂道チャリ｜すきま脳トレ箱</title>
<meta name="theme-color" content="#EBF0F6">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../common/base.css">
<style>
/* runner */
.rn-wrap{width:100%;aspect-ratio:5/6;max-height:100%;position:relative;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--skyBot)}
.rn-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.rn-over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:rgba(10,16,32,.35);color:#fff;pointer-events:none}
.rn-over h3{margin:0;font:400 26px var(--display);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.rn-over p{margin:0;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.rn-over .big{font:400 40px var(--display);font-variant-numeric:tabular-nums}
.it-wrap{width:100%;height:100%;position:relative;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
.it-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.rn-help{font-size:12px;color:var(--ink2);text-align:center;margin:0}
</style>
</head>
<body>
<div id="app">
  <section class="view" id="v-runner">
    <header class="bar"><a class="back" href="../index.html">‹ 戻る</a><h2>坂道チャリ</h2><button class="btn" id="pauseBtn" type="button">⏸</button><span class="timer" id="rn-best">ベスト 0m</span></header>
    <div class="stage" style="padding-bottom:10px">
      <div class="rn-wrap" id="rn-wrap"><canvas id="rn-cv"></canvas>
        <div class="rn-over" id="rn-over"><h3>坂道チャリ</h3><p>タップでジャンプ・空中でもう1回</p><p>穴と岩に気をつけて</p><p class="big" id="rn-big" hidden></p><p id="rn-sub">タップでスタート</p></div>
      </div>
    </div>
    <p class="rn-help">スペースキー・↑キーでもジャンプできます</p>
    <div style="height:14px"></div>
  </section>
</div>
<div id="layer"></div>
<script src="../common/save.js"></script>
<script src="../common/ui.js"></script>
<script src="../common/sfx.js"></script>
<script>
Save.ready.then(()=>{
const store=makeStore('');const current='runner';
/* ---------- Runner ---------- */
const RN={cv:$('#rn-cv'),R:null,state:'ready',raf:0,last:0,colors:null,best:store.get('rnBest',0)};
const SP=24,GRAV=1900,JV=660,VW=560;
function rnReset(){const LH=RN.cv.clientHeight/(RN.cv.clientWidth/VW)||560;
  const base=LH*.72;
  RN.R={cam:0,y:base,vy:0,on:true,jumps:0,speed:250,t:0,pts:[],rocks:[],lastY:base,since:0,ang:0,wheel:0,LH,minY:LH*.48,maxY:LH-36};
  for(let i=0;i<34;i++)RN.R.pts.push(base)}
function rnExtend(R,until){
  while(R.pts.length*SP<until){
    const lvl=clamp((R.speed-250)/300,0,1);
    if(R.since>12&&Math.random()<.3+.2*lvl){
      const w=ri(2,3+Math.round(lvl*4));for(let i=0;i<w;i++)R.pts.push(null);
      R.lastY=clamp(R.lastY+rnd(-36,50),R.minY,R.maxY);R.since=0;R.pts.push(R.lastY);
    }else{
      const len=ri(8,16),from=R.lastY,to=clamp(from+rnd(-85,85),R.minY,R.maxY);
      const rockAt=R.pts.length>50&&Math.random()<.3+.3*lvl?ri(4,len-3):-1;
      for(let i=1;i<=len;i++){const t=i/len;R.pts.push(from+(to-from)*(1-Math.cos(Math.PI*t))/2);
        if(i===rockAt)R.rocks.push({x:(R.pts.length-1)*SP,s:rnd(16,24)})}
      R.lastY=to;R.since+=len}
  }
}
function rnGround(R,x){const i=Math.floor(x/SP),a=R.pts[i],b=R.pts[i+1];if(a==null||b==null)return null;return a+(b-a)*(x/SP-i)}
function rnColors(){if(!RN.colors)RN.colors={skyTop:css('--skyTop'),skyBot:css('--skyBot'),far:css('--far'),ground:css('--ground'),top:css('--groundTop'),rock:css('--rock'),ink:css('--ink'),mark:css('--mark')};return RN.colors}
function rnJump(){
  if(RN.state==='ready'||RN.state==='over'){if(RN.state==='over'&&performance.now()-RN.overAt<450)return;rnReset();RN.state='play';rnOverlay();rnLoopStart();return}
  if(RN.state==='paused'){RN.state='play';rnOverlay();rnLoopStart();return}
  const R=RN.R;if(R.on){R.vy=-JV;R.on=false;R.jumps=1;Sfx.play('jump')}else if(R.jumps<2){R.vy=-JV*.84;R.jumps=2;Sfx.play('jump')}}
function rnDie(why){Sfx.play('hit');RN.state='over';RN.overAt=performance.now();const d=Math.floor(RN.R.cam/40);
  const nb=d>RN.best;if(nb){RN.best=d;store.set('rnBest',d)}RN.why=why;RN.newBest=nb;rnOverlay();rnBest()}
function rnBest(){$('#rn-best').textContent=`ベスト ${RN.best}m`}
function rnOverlay(){const o=$('#rn-over'),big=$('#rn-big'),h=o.querySelector('h3'),ps=o.querySelectorAll('p:not(.big):not(#rn-sub)');
  o.hidden=RN.state==='play';
  if(RN.state==='ready'){h.textContent='坂道チャリ';ps.forEach(p=>p.hidden=false);big.hidden=true;$('#rn-sub').textContent=(RN.best?`ベスト ${RN.best}m　`:'')+'タップでスタート'}
  else if(RN.state==='paused'){h.textContent='一時停止中';ps.forEach(p=>p.hidden=true);big.hidden=true;$('#rn-sub').textContent='タップで再開'}
  else if(RN.state==='over'){h.textContent=RN.why==='rock'?'岩にぶつかった！':RN.why==='wall'?'崖にぶつかった！':'穴に落ちた！';ps.forEach(p=>p.hidden=true);
    big.hidden=false;big.textContent=Math.floor(RN.R.cam/40)+'m';$('#rn-sub').textContent=(RN.newBest?'ベスト更新！　':`ベスト ${RN.best}m　`)+'タップでもう一回'}}
function rnUpdate(dt){const R=RN.R;R.t+=dt;R.speed=Math.min(560,250+R.t*5);R.cam+=R.speed*dt;R.wheel+=R.speed*dt/9;
  const W=RN.cv.clientWidth/(RN.cv.clientWidth/VW),bx=R.cam+VW*.28;rnExtend(R,R.cam+W+300);
  if(R.on){const g=rnGround(R,bx);if(g===null){R.on=false;R.vy=0;R.jumps=1}else{R.y=g;const g2=rnGround(R,bx+8);const a=g2!=null?Math.atan2(g2-g,8):R.ang;R.ang+=(a-R.ang)*.3}}
  if(!R.on){const py=R.y;R.vy+=GRAV*dt;R.y+=R.vy*dt;const g=rnGround(R,bx);
    if(g!==null&&R.y>=g){if(py<=g+16){R.y=g;R.on=true;R.jumps=0;R.vy=0}else{rnDie('wall');return}}
    R.ang+=(clamp(R.vy*.0007,-.5,.6)-R.ang)*.12;
    if(R.y>R.LH+80){rnDie('fall');return}}
  for(const k of R.rocks){if(k.x<bx-40||k.x>bx+40)continue;const gy=rnGround(R,k.x);if(gy==null)continue;
    if(Math.abs(k.x-bx)<k.s*.5+11&&R.y>gy-k.s*.75){rnDie('rock');return}}
  if(R.rocks.length&&R.rocks[0].x<R.cam-100)R.rocks.shift()}
function rnDraw(){const cv=RN.cv,R=RN.R,w=cv.clientWidth,h=cv.clientHeight;if(!w||!R)return;const dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const sc=w/VW,x=cv.getContext('2d'),C=rnColors();x.setTransform(dpr*sc,0,0,dpr*sc,0,0);const LH=h/sc;
  const sky=x.createLinearGradient(0,0,0,LH);sky.addColorStop(0,C.skyTop);sky.addColorStop(1,C.skyBot);x.fillStyle=sky;x.fillRect(0,0,VW,LH);
  x.fillStyle=C.far;x.beginPath();x.moveTo(0,LH);for(let sx=0;sx<=VW;sx+=10){const wx=sx+R.cam*.25;x.lineTo(sx,LH*.5+Math.sin(wx*.006)*28+Math.sin(wx*.017)*12)}x.lineTo(VW,LH);x.fill();
  const i0=Math.max(0,Math.floor(R.cam/SP)-1),i1=Math.ceil((R.cam+VW)/SP)+1;
  let run=null;const flush=()=>{if(!run||run.length<2){run=null;return}
    x.beginPath();x.moveTo(run[0][0],LH+10);for(const p of run)x.lineTo(p[0],p[1]);x.lineTo(run[run.length-1][0],LH+10);x.closePath();x.fillStyle=C.ground;x.fill();
    x.beginPath();x.moveTo(run[0][0],run[0][1]);for(const p of run)x.lineTo(p[0],p[1]);x.strokeStyle=C.top;x.lineWidth=5;x.lineJoin='round';x.stroke();run=null};
  for(let i=i0;i<=i1;i++){const y=R.pts[i];if(y==null){flush();continue}(run=run||[]).push([i*SP-R.cam,y])}flush();
  x.fillStyle=C.rock;for(const k of R.rocks){const gy=rnGround(R,k.x);if(gy==null)continue;const sx=k.x-R.cam,s=k.s;
    x.beginPath();x.moveTo(sx-s*.6,gy+2);x.lineTo(sx-s*.45,gy-s*.6);x.lineTo(sx,gy-s);x.lineTo(sx+s*.5,gy-s*.55);x.lineTo(sx+s*.6,gy+2);x.closePath();x.fill()}
  // best flag
  if(RN.best>0){const fx=RN.best*40+VW*.28,sx=fx-R.cam;if(sx>-20&&sx<VW+20){let gy=rnGround(R,fx);if(gy==null){const i=Math.floor(fx/SP);for(let k=1;k<12&&gy==null;k++)gy=R.pts[i-k]??null}
    if(gy!=null){x.strokeStyle=C.ink;x.lineWidth=2;x.beginPath();x.moveTo(sx,gy);x.lineTo(sx,gy-64);x.stroke();x.fillStyle=C.mark;x.beginPath();x.moveTo(sx,gy-64);x.lineTo(sx+48,gy-54);x.lineTo(sx,gy-44);x.closePath();x.fill();
      x.fillStyle=C.ink;x.font='900 12px "Zen Kaku Gothic New",sans-serif';x.textAlign='left';x.textBaseline='middle';x.fillText('ベスト',sx+3,gy-54)}}}
  // bike
  x.save();x.translate(VW*.28,R.y);x.rotate(R.ang);x.strokeStyle=C.ink;x.lineCap='round';x.lineJoin='round';
  const wheel=cx=>{x.lineWidth=2.6;x.beginPath();x.arc(cx,-9,9,0,7);x.stroke();x.lineWidth=1.2;for(let k=0;k<3;k++){const a=R.wheel+k*Math.PI/3;x.beginPath();x.moveTo(cx+Math.cos(a)*8,-9+Math.sin(a)*8);x.lineTo(cx-Math.cos(a)*8,-9-Math.sin(a)*8);x.stroke()}};
  wheel(-14);wheel(14);
  x.lineWidth=2.6;x.beginPath();x.moveTo(-14,-9);x.lineTo(-2,-11);x.lineTo(-5,-23);x.lineTo(-14,-9);x.moveTo(-2,-11);x.lineTo(10,-22);x.lineTo(14,-9);x.moveTo(-5,-23);x.lineTo(10,-22);x.moveTo(10,-22);x.lineTo(9,-27);x.lineTo(13,-27);x.stroke();
  const pa=R.wheel*.6,fx=-2+Math.cos(pa)*5,fy=-11+Math.sin(pa)*5,kx=fx+5,ky=fy-9;
  x.lineWidth=3;x.beginPath();x.moveTo(-5,-25);x.lineTo(kx,ky);x.lineTo(fx,fy);x.moveTo(-5,-25);x.lineTo(5,-38);x.lineTo(12,-27);x.stroke();
  x.fillStyle=C.mark;x.beginPath();x.arc(7,-44,6,0,7);x.fill();x.lineWidth=1.8;x.stroke();x.restore();
  x.fillStyle=C.ink;x.font='400 26px "Dela Gothic One",sans-serif';x.textAlign='left';x.textBaseline='top';x.fillText(Math.floor(R.cam/40)+'m',16,14)}
function rnFrame(t){if(RN.state!=='play'||current!=='runner'){RN.raf=0;return}
  const dt=Math.min(.033,(t-RN.last)/1000||0);RN.last=t;rnUpdate(dt);rnDraw();RN.raf=requestAnimationFrame(rnFrame)}
function rnLoopStart(){if(!RN.raf){RN.last=performance.now();RN.raf=requestAnimationFrame(rnFrame)}}
(function(){RN.cv.addEventListener('pointerdown',e=>{e.preventDefault();rnJump()});
  $('#rn-over').style.pointerEvents='none';
  document.addEventListener('keydown',e=>{if(current!=='runner')return;if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();rnJump()}});
  new ResizeObserver(()=>{if(current==='runner'&&RN.state!=='play'){if(RN.state==='ready')rnReset();rnDraw()}}).observe($('#rn-wrap'))})();
function rnEnter(){rnBest();if(!RN.R)rnReset();rnOverlay();requestAnimationFrame(rnDraw)}
function rnLeave(){if(RN.state==='play'){RN.state='paused';rnOverlay()}}

matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{RN.colors=null;rnDraw()});document.getElementById('pauseBtn').onclick=()=>{rnLeave()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)rnLeave()});
window.addEventListener('pagehide',()=>rnLeave());
rnEnter();
});
</script>
<script>regSW('../sw.js')</script>
</body>
</html>
