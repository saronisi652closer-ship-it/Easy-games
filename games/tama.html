<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>色玉連鎖｜すきま脳トレ箱</title>
<meta name="theme-color" content="#EBF0F6">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../common/base.css">
<style>
.tm-hud{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;padding:0 2px 8px}
.tm-hud b{font:400 22px var(--display)}
.tm-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-bottom:12px}
.tm-box{position:relative;height:100%;max-height:100%;aspect-ratio:8/10;max-width:100%;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#1E2A44}
.tm-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tm-over{position:absolute;inset:0;background:rgba(10,16,32,.62);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}
.tm-over h3{font:400 26px var(--display);margin:0}.tm-over p{margin:0;font-weight:700;line-height:1.6}.tm-over .big{font:400 42px var(--display)}
</style>
</head>
<body>
<div id="app">
<section class="view">
  <header class="bar"><a class="back" href="../index.html">‹ 戻る</a><h2>色玉連鎖</h2><button class="btn" id="tm-undo" type="button" disabled>1手戻す</button><span class="timer" id="tm-best">ベスト 0</span></header>
  <div class="opts"><div class="seg" id="tm-lv" role="group" aria-label="色の数"><button type="button" data-v="easy">4色</button><button type="button" data-v="normal">5色</button><button type="button" data-v="hard">6色</button></div><button class="btn" id="tm-new" type="button">やり直す</button></div>
  <div class="tm-hud"><span>点数 <b id="tm-score">0</b></span><span id="tm-msg"></span><span>のこり <b id="tm-left">80</b></span></div>
  <div class="tm-wrap"><div class="tm-box" id="tm-box"><canvas id="tm-cv"></canvas></div></div>
</section>
</div>
<div id="layer"></div>
<script src="../common/save.js"></script>
<script src="../common/ui.js"></script>
<script src="../common/sfx.js"></script>
<script>
Save.ready.then(()=>{
const store=makeStore('tm_');
const C=8,R=10,NC={easy:4,normal:5,hard:6};
const COL=[['#F0605A','#B8302B'],['#4E9BEA','#2462B0'],['#5BC46A','#2E8A3C'],['#F5C542','#C08F10'],['#B07AE6','#7A43B5'],['#F08CC0','#C04F8A']];
const cv=$('#tm-cv'),x=cv.getContext('2d');
let OX=0,OY=0;let lv=store.get('lv','normal'),best=store.get('best',{}),B=null,score=0,busy=false,undo=null,fx=[],raf=0,cell=40,uid=1,chain=0,over=false;
segInit($('#tm-lv'),lv,v=>{lv=v;store.set('lv',v);newGame()});
function size(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cell=Math.min(r.width/C,r.height/R);OX=(r.width-C*cell)/2;OY=(r.height-R*cell)/2;x.setTransform(d,0,0,d,d*OX,d*OY);draw()}
function newGame(){const n=NC[lv];B=[...Array(C)].map(()=>[...Array(R)].map(()=>({c:Math.random()*n|0,id:uid++,dy:0,dx:0})));
  score=0;chain=0;undo=null;over=false;fx=[];busy=false;overlay(null);hud();loopStart();Save.touch({game:'tama'})}
function at(c,r){return B[c]&&B[c][r]}
function group(c,r){const b=at(c,r);if(!b)return[];const seen=new Set([c+','+r]),st=[[c,r]],out=[];
  while(st.length){const [a,bb]=st.pop();out.push([a,bb]);for(const [dx,dy] of[[1,0],[-1,0],[0,1],[0,-1]]){const k=(a+dx)+','+(bb+dy),n=at(a+dx,bb+dy);if(n&&n.c===b.c&&!seen.has(k)){seen.add(k);st.push([a+dx,bb+dy])}}}return out}
function anyMove(){for(let c=0;c<B.length;c++)for(let r=0;r<B[c].length;r++){const b=B[c][r];if(at(c+1,r)&&at(c+1,r).c===b.c)return true;if(at(c,r+1)&&at(c,r+1).c===b.c)return true}return false}
function left(){return B.reduce((a,col)=>a+col.length,0)}
function hud(){$('#tm-score').textContent=score;$('#tm-left').textContent=B?left():0;$('#tm-best').textContent=`ベスト ${best[lv]||0}`;$('#tm-undo').disabled=!undo||busy||over}
function pts(n,k){return n*n*5*k}
function pop(cells,k){const n=cells.length,p=pts(n,k);score+=p;
  let sx=0,sy=0;for(const [c,r] of cells){const b=B[c][r];sx+=c;sy+=r;for(let i=0;i<6;i++)fx.push({t:'p',x:(c+.5)*cell,y:(R-r-.5)*cell,vx:rnd(-120,120),vy:rnd(-200,40),life:.5,col:COL[b.c][0]});B[c][r]=null}
  fx.push({t:'txt',x:(sx/n+.5)*cell,y:(R-sy/n-.5)*cell,s:(k>1?`${k}連鎖！ `:'')+'+'+p,life:1.1,vy:-40});
  Sfx.play(k>1?'coin':n>=6?'ok':'place');
  for(let c=0;c<C;c++)if(B[c]){const col=B[c].filter(Boolean);col.forEach((b,i)=>{const old=B[c].indexOf(b);b.dy+=old-i;b.moved=old!==i});B[c]=col}
  const keep=[];B.forEach((col,c)=>{if(col.length){const nc=keep.length;col.forEach(b=>{b.dx+=c-nc;if(c!==nc)b.moved=true});keep.push(col)}});B=keep;hud()}
function tap(px,py){if(busy||over||!B)return;const c=Math.floor(px/cell),r=R-1-Math.floor(py/cell);if(!at(c,r))return;const g=group(c,r);
  if(g.length<2){Sfx.play('ng');const b=at(c,r);b.shake=.25;return}
  undo={B:JSON.stringify(B),score};B.flat().forEach(b=>b.moved=false);chain=1;pop(g,1);busy=true;hud();setTimeout(settle,330)}
function settle(){// 落ちて動いた玉を含む4個以上のかたまりは自動で消える（連鎖）
  const done=new Set();let found=null;
  for(let c=0;c<B.length&&!found;c++)for(let r=0;r<B[c].length;r++){const k=c+','+r;if(done.has(k))continue;const g=group(c,r);g.forEach(([a,b])=>done.add(a+','+b));
    if(g.length>=4&&g.some(([a,b])=>B[a][b].moved)){found=g;break}}
  if(found){chain++;B.flat().forEach(b=>b.moved=false);pop(found,chain);$('#tm-msg').textContent=`${chain}連鎖`;setTimeout(settle,380);return}
  busy=false;B.flat().forEach(b=>b.moved=false);setTimeout(()=>{if(!busy)$('#tm-msg').textContent=''},900);hud();
  if(!left()){score+=2000;fx.push({t:'txt',x:C*cell/2,y:R*cell/2,s:'全部消した！ +2000',life:1.6,vy:-20});return finish(true)}
  if(!anyMove())finish(false)}
function finish(all){over=true;undo=null;const nb=score>(best[lv]||0);if(nb){best[lv]=score;store.set('best',best)}store.set('plays',(store.get('plays',0)||0)+1);hud();
  Sfx.play(all||nb?'clear':'ok');setTimeout(()=>overlay(`<h3>${all?'全部消した！':'もう消せない'}</h3><div class="big">${score}点</div><p>${nb?'ベスト更新！<br>':''}のこり ${left()}個</p><p style="color:#FFE58A">タップでもう一回</p>`,newGame),700)}
function overlay(html,cb){$('#tm-box').querySelectorAll('.tm-over').forEach(o=>o.remove());if(!html)return;const o=document.createElement('div');o.className='tm-over';o.innerHTML=html;$('#tm-box').appendChild(o);if(cb)setTimeout(()=>o.onclick=cb,400)}
function title(){overlay(`<h3>色玉連鎖</h3><p>同じ色が2個以上つながった玉をタップで消す</p><p>落ちてきた玉が4個以上そろうと<br>自動で消えて連鎖！点数が倍々に</p><p>たくさんまとめて消すほど高得点<br>全部消すとボーナス2000点</p><p style="color:#FFE58A">タップでスタート</p>`,newGame)}
let last=0;function loopStart(){cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}
function loop(now){const dt=clamp((now-last)/1000,0,.05);last=now;
  if(B)for(const col of B)for(const b of col){if(b.dy>0)b.dy=Math.max(0,b.dy-dt*14);if(b.dx>0)b.dx=Math.max(0,b.dx-dt*12);if(b.shake)b.shake=Math.max(0,b.shake-dt)}
  for(const f of fx){f.life-=dt;if(f.t==='p'){f.vy+=600*dt;f.x+=f.vx*dt;f.y+=f.vy*dt}else f.y+=f.vy*dt}fx=fx.filter(f=>f.life>0);
  draw();raf=requestAnimationFrame(loop)}
const MARK=['●','▲','■','◆','★','♥'];
function ball(px,py,r,ci){const g=x.createRadialGradient(px-r*.35,py-r*.4,r*.1,px,py,r);g.addColorStop(0,'#fff');g.addColorStop(.25,COL[ci][0]);g.addColorStop(1,COL[ci][1]);
  x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.fillStyle='rgba(255,255,255,.55)';x.font=`900 ${r*.8}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(MARK[ci],px,py+r*.06)}
function draw(){const w=cv.clientWidth,h=cv.clientHeight;if(!w)return;x.fillStyle='#1E2A44';x.fillRect(-OX,-OY,w,h);
  x.strokeStyle='rgba(255,255,255,.05)';x.lineWidth=1;for(let c=1;c<C;c++){x.beginPath();x.moveTo(c*cell,0);x.lineTo(c*cell,R*cell);x.stroke()}
  if(B)B.forEach((col,c)=>col.forEach((b,r)=>{const sh=b.shake?Math.sin(b.shake*60)*3:0;ball((c+b.dx+.5)*cell+sh,(R-1-r-b.dy+.5)*cell,cell*.42,b.c)}));
  for(const f of fx){if(f.t==='p'){x.globalAlpha=Math.max(0,f.life*2);x.fillStyle=f.col;x.beginPath();x.arc(f.x,f.y,3.5,0,7);x.fill();x.globalAlpha=1}
    else{x.globalAlpha=Math.min(1,f.life*2);x.font='900 20px "Zen Kaku Gothic New",sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=4;x.strokeStyle='#18264A';x.strokeText(f.s,f.x,f.y);x.fillStyle='#FFE58A';x.fillText(f.s,f.x,f.y);x.globalAlpha=1}}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();tap(e.clientX-r.left-OX,e.clientY-r.top-OY)});
$('#tm-new').onclick=()=>{if(B&&!over&&score>0&&!confirm('いまの盤面をやめて、新しく始めますか？'))return;newGame()};
$('#tm-undo').onclick=()=>{if(!undo||busy)return;B=JSON.parse(undo.B);B.flat().forEach(b=>{b.dx=0;b.dy=0});score=undo.score;undo=null;fx=[];Sfx.play('tap');hud()};
new ResizeObserver(size).observe($('#tm-box'));hud();size();
B=[...Array(C)].map(()=>[...Array(R)].map(()=>({c:Math.random()*NC[lv]|0,id:uid++,dy:0,dx:0})));over=true;loopStart();title();
if(/debug=1/.test(location.search))window.__tm={get B(){return B},get busy(){return busy},get over(){return over},get score(){return score},tap:(c,r)=>tap((c+.5)*cell,(R-1-r+.5)*cell),group,newGame};
});
</script>
<script>regSW('../sw.js')</script>
</body>
</html>
