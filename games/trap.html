<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棒人間トラップ｜すきま脳トレ箱</title>
<meta name="theme-color" content="#EBF0F6">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../common/base.css">
<style>
.tr-hud{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;padding:0 2px 8px}
.tr-hud b{font:400 22px var(--display)}
.tr-box{position:relative;flex:1;min-height:0;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#CFE8F8}
.tr-box canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tr-over{position:absolute;inset:0;background:rgba(10,16,32,.62);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;overflow:auto}
.tr-over h3{font:400 26px var(--display);margin:0}.tr-over p{margin:0;font-weight:700;line-height:1.6}.tr-over .big{font:400 40px var(--display)}
.tr-stg{display:grid;grid-template-columns:repeat(3,72px);gap:8px;margin:6px 0}
.tr-stg button{border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:6px 0;font-weight:900;font-size:16px;line-height:1.2}
.tr-stg button small{display:block;font-size:10px;font-weight:700;opacity:.85}.tr-stg button:disabled{opacity:.3}
.tr-pad{display:flex;justify-content:space-between;gap:10px;padding:12px 0 14px;user-select:none;-webkit-user-select:none}
.tr-pad button{border:2px solid var(--ink);background:var(--card);border-radius:14px;font-size:22px;font-weight:900;height:62px;box-shadow:0 3px 0 var(--ink);touch-action:none;-webkit-touch-callout:none}
.tr-pad button.on{transform:translateY(3px);box-shadow:none;background:var(--mark)}
.tr-pad .mv{width:76px}.tr-pad .jp{flex:1;max-width:150px;font-size:17px}
</style>
</head>
<body>
<div id="app">
<section class="view">
  <header class="bar"><a class="back" href="../index.html">‹ 戻る</a><h2>棒人間トラップ</h2><button class="btn" id="tr-menu" type="button">ステージ</button></header>
  <div class="tr-hud"><span>ステージ <b id="tr-st">1</b></span><span id="tr-msg"></span><span>ミス <b id="tr-miss">0</b></span></div>
  <div class="tr-box" id="tr-box"><canvas id="tr-cv"></canvas></div>
  <div class="tr-pad"><div style="display:flex;gap:10px"><button class="mv" type="button" data-k="L" aria-label="左">◀</button><button class="mv" type="button" data-k="R" aria-label="右">▶</button></div><button class="jp" type="button" data-k="J">ジャンプ</button></div>
</section>
</div>
<div id="layer"></div>
<script src="../common/save.js"></script>
<script src="../common/ui.js"></script>
<script src="../common/sfx.js"></script>
<script>
Save.ready.then(()=>{
const store=makeStore('tr_');
const T=24,ROWS=14,GR=12;   // 地面の上面は12段目
// 地形: g=[開始,終了] の地面、p=[開始,終了,段] の足場、s=[列,段] の見えるトゲ
// わな: pop=トゲが飛び出す / fall=乗ると落ちる床 / drop=天井からブロック / arrow=横から矢 / run=ゴールが逃げる / fake=にせゴール
const LV=[
 {w:36,g:[[0,11],[14,35]],goal:33,hint:'旗まで行けばクリア。かんたん…？',
  tr:[{t:'pop',x:30,y:11,a:28}]},
 {w:42,g:[[0,19],[22,41]],f:[[20,21]],goal:39,hint:'天井と床に気をつけて',
  tr:[{t:'drop',x:12,a:9},{t:'fall',x1:20,x2:21}]},
 {w:48,g:[[0,47]],s:[[10,11],[11,11]],goal:36,hint:'ゴールはすぐそこ',
  tr:[{t:'arrow',a:16,y:11},{t:'pop',x:25,y:11,a:23},{t:'run',a:33,to:45},{t:'drop',x:42,a:40}]},
 {w:50,g:[[0,9],[21,49]],p:[[12,14,10],[17,19,9]],goal:46,hint:'足場をつたって向こうへ',
  tr:[{t:'fall',x1:17,x2:19,y:9,d:.35},{t:'pop',x:25,y:11,a:23},{t:'drop',x:33,a:30},{t:'arrow',a:38,y:11}]},
 {w:52,g:[[0,51]],s:[[29,11],[30,11]],goal:48,hint:'あせらず、よく見て',
  tr:[{t:'drop',x:10,a:8},{t:'drop',x:14,a:12},{t:'arrow',a:20,y:11},{t:'arrow',a:25,y:10},{t:'pop',x:35,y:11,a:33},{t:'pop',x:44,y:11,a:42}]},
 {w:46,g:[[0,27],[30,45]],f:[[28,29]],goal:42,fake:20,hint:'最後のステージ。ゴールは本物？',
  tr:[{t:'fake',x:20},{t:'fall',x1:28,x2:29},{t:'pop',x:24,y:11,a:22},{t:'arrow',a:33,y:11},{t:'drop',x:39,a:37}]},
];
const cv=$('#tr-cv'),x=cv.getContext('2d');
let W=360,H=400,sc=1,VY=0,G=null,raf=0,last=0,keys={L:0,R:0,J:0},unlocked=store.get('stage',1),bests=store.get('best',{}),total=store.get('total',0);
function size(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;sc=Math.min(H/(ROWS*T),W/(10*T));VY=H/sc-ROWS*T;x.setTransform(d,0,0,d,0,0);draw()}
function load(n,keepMiss){const L=LV[n-1];const solid=new Set(),fallT=new Map();
  for(const [a,b] of L.g)for(let c=a;c<=b;c++)for(let r=GR;r<ROWS;r++)solid.add(c+','+r);
  for(const [a,b] of (L.f||[]))for(let c=a;c<=b;c++)solid.add(c+','+GR);
  for(const [a,b,r] of (L.p||[]))for(let c=a;c<=b;c++)solid.add(c+','+r);
  const traps=L.tr.map(t=>({...t,on:false,k:0}));
  for(const t of traps)if(t.t==='fall'){const y=t.y??GR;for(let c=t.x1;c<=t.x2;c++)fallT.set(c+','+y,t)}
  const miss=keepMiss&&G&&G.n===n?G.miss:0;
  G={n,L,solid,fallT,traps,goal:L.goal,goalX:L.goal,miss,p:{x:2*T,y:GR*T-22,w:12,h:22,vx:0,vy:0,ground:true,face:1,run:0},cam:0,state:'play',dead:0,falling:[],projs:[]};
  $('#tr-st').textContent=n;$('#tr-msg').textContent=L.hint;hud();overlay(null);last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);Save.touch({game:'trap'})}
function hud(){$('#tr-miss').textContent=G?G.miss:0;}
function isSolid(c,r){return G.solid.has(c+','+r)}
function rectHitsSolid(px,py,w,h){const c0=Math.floor(px/T),c1=Math.floor((px+w-.01)/T),r0=Math.floor(py/T),r1=Math.floor((py+h-.01)/T);
  for(let c=c0;c<=c1;c++)for(let r=r0;r<=r1;r++)if(isSolid(c,r))return {c,r};return null}
function die(why){if(G.state!=='play')return;G.state='dead';G.dead=performance.now();G.miss++;total++;store.set('total',total);hud();Sfx.play('ng');if(navigator.vibrate)navigator.vibrate(80);
  $('#tr-msg').textContent=why;setTimeout(()=>{if(G&&G.state==='dead')load(G.n,true)},900)}
function win(){G.state='clear';const n=G.n,prev=bests[n];const nb=prev===undefined||G.miss<prev;if(nb){bests[n]=G.miss;store.set('best',bests)}
  if(n>=unlocked&&n<LV.length){unlocked=n+1;store.set('stage',unlocked)}store.set('plays',(store.get('plays',0)||0)+1);Sfx.play('clear');
  const lastSt=n===LV.length;overlay(`<h3>ステージ${n} クリア！</h3><div class="big">ミス ${G.miss}回</div><p>${nb?'自己ベスト！':`ベスト ミス${prev}回`}</p><p style="color:#FFE58A">${lastSt?'全ステージ制覇！タップでステージ選択':'タップで次のステージ'}</p>`,()=>lastSt?menu():load(n+1))}
function step(dt,now){const p=G.p,L=G.L;
  const mv=(keys.R?1:0)-(keys.L?1:0);p.vx=mv*140;if(mv)p.face=mv;p.run+=Math.abs(p.vx)*dt;
  if(!keys.J)G.jl=0;
  if(keys.J&&!G.jl&&p.ground){p.vy=-560;p.ground=false;G.jl=1;Sfx.play('jump')}
  if(!keys.J&&p.vy<-140)p.vy=-140;      // ボタンを早く離すと小ジャンプ
  p.vy=Math.min(900,p.vy+1800*dt);
  // 横
  p.x+=p.vx*dt;p.x=Math.max(0,p.x);let h=rectHitsSolid(p.x,p.y,p.w,p.h);if(h){p.x=p.vx>0?h.c*T-p.w:(h.c+1)*T}
  // 縦
  p.y+=p.vy*dt;p.ground=false;h=rectHitsSolid(p.x,p.y,p.w,p.h);
  if(h){if(p.vy>0){p.y=h.r*T-p.h;p.ground=true}else p.y=(h.r+1)*T;p.vy=0}
  if(p.y>ROWS*T+40)return die('落ちた…');
  const pc=(p.x+p.w/2)/T,pcx=Math.floor(pc);
  // 乗った床
  if(p.ground){const r=Math.floor((p.y+p.h+1)/T);for(const c of [Math.floor(p.x/T),Math.floor((p.x+p.w-.01)/T)]){const t=G.fallT.get(c+','+r);if(t&&!t.on){t.on=true;t.at=now+(t.d||.12)*1000}}}
  for(const t of G.traps){
    if(t.t==='fall'&&t.on&&!t.gone&&now>=t.at){t.gone=true;const y=t.y??GR;for(let c=t.x1;c<=t.x2;c++){G.solid.delete(c+','+y);G.falling.push({x:c*T,y:y*T,vy:0,deadly:false})}Sfx.play('hit')}
    if(t.t==='pop'&&!t.on&&pcx>=t.a&&pcx<t.x+1){t.on=true;t.k=0;Sfx.play('hit')}
    if(t.t==='pop'&&t.on){t.k=Math.min(1,t.k+dt*14);if(t.k>.6&&overlap(p,t.x*T+6,t.y*T+10,T-12,T-10))return die('トゲが出た！')}
    if(t.t==='drop'&&!t.on&&pc>=t.a){t.on=true;G.falling.push({x:t.x*T,y:-VY-T,vy:VY>0?Math.sqrt(2*1800*VY):0,deadly:true,land:true});Sfx.play('hit')}
    if(t.t==='arrow'&&!t.on&&pc>=t.a){t.on=true;G.projs.push({x:G.cam+W/sc+10,y:t.y*T+T/2,vx:-300});Sfx.play('tap')}
    if(t.t==='run'&&!t.on&&pc>=t.a){t.on=true;t.k=0;$('#tr-msg').textContent='ゴールが逃げた！'}
    if(t.t==='run'&&t.on&&t.k<1){t.k=Math.min(1,t.k+dt*1.2);G.goalX=t.a+3+(t.to-t.a-3)*t.k;if(t.k>=1)G.goalX=t.to}
    if(t.t==='fake'&&overlap(p,t.x*T+8,(GR-3)*T,8,3*T)){t.on=true;return die('にせもののゴール！')}}
  for(const f of G.falling){if(f.landed)continue;f.vy=Math.min(900,f.vy+1800*dt);f.y+=f.vy*dt;
    if(f.deadly&&overlap(p,f.x+2,f.y+2,T-4,T-4))return die('上からドーン！');
    if(f.land){const c=Math.round(f.x/T),r=Math.floor((f.y+T)/T);if(isSolid(c,r)){f.y=(r-1)*T;f.landed=true;G.solid.add(c+','+(r-1));Sfx.play('hit')}}}
  G.falling=G.falling.filter(f=>f.y<ROWS*T+60);
  for(const a of G.projs){a.x+=a.vx*dt;if(overlap(p,a.x-12,a.y-3,24,6))return die('矢が飛んできた！')}G.projs=G.projs.filter(a=>a.x>G.cam-40);
  for(const [c,r] of (L.s||[]))if(overlap(p,c*T+6,r*T+10,T-12,T-10))return die('トゲにささった');
  if(overlap(p,G.goalX*T+8,(GR-3)*T,8,3*T))return win();
  G.cam=clamp(p.x-W/sc*.38,0,Math.max(0,L.w*T-W/sc))}
function overlap(p,ax,ay,aw,ah){return p.x<ax+aw&&p.x+p.w>ax&&p.y<ay+ah&&p.y+p.h>ay}
function loop(now){if(!G)return;const dt=clamp((now-last)/1000,0,.033);last=now;if(G.state==='play'){step(dt/2,now);if(G.state==='play')step(dt/2,now)}draw(now);if(G.state!=='clear')raf=requestAnimationFrame(loop)}
function spike(px,py,k){x.fillStyle='#8A93A6';x.strokeStyle='#4A5266';x.lineWidth=1.2;const top=py+T-T*k;for(let i=0;i<2;i++){x.beginPath();x.moveTo(px+i*T/2+1,py+T);x.lineTo(px+i*T/2+T/4,top+2);x.lineTo(px+(i+1)*T/2-1,py+T);x.closePath();x.fill();x.stroke()}}
function flag(gx,fake){const px=gx*T+12,top=(GR-3)*T;x.fillStyle='#5B6886';x.fillRect(px-1.5,top,3,3*T);x.fillStyle=fake?'#3AA55B':'#3AA55B';x.beginPath();x.moveTo(px+1.5,top+2);x.lineTo(px+26,top+11);x.lineTo(px+1.5,top+20);x.fill();x.fillStyle='#F5C542';x.beginPath();x.arc(px,top,4,0,7);x.fill()}
function stick(p,now){const dead=G.state==='dead',cx=p.x+p.w/2,top=p.y;x.strokeStyle='#18264A';x.lineWidth=2.4;x.lineCap='round';
  if(dead){const k=Math.min(1,(now-G.dead)/300);x.save();x.translate(cx,top+p.h/2);x.rotate(k*1.6*p.face);x.translate(-cx,-(top+p.h/2))}
  x.fillStyle='#fff';x.beginPath();x.arc(cx,top+5,5,0,7);x.fill();x.stroke();
  x.beginPath();x.moveTo(cx,top+10);x.lineTo(cx,top+16);x.stroke();
  const s=p.ground&&p.vx?Math.sin(p.run*.12):0,air=!p.ground;
  x.beginPath();x.moveTo(cx,top+12);x.lineTo(cx-5,top+(air?8:14)+s*2);x.moveTo(cx,top+12);x.lineTo(cx+5,top+(air?8:14)-s*2);x.stroke();
  x.beginPath();x.moveTo(cx,top+16);x.lineTo(cx-4*s-(air?4:2),top+22);x.moveTo(cx,top+16);x.lineTo(cx+4*s+(air?4:2),top+22);x.stroke();
  x.fillStyle='#18264A';x.beginPath();x.arc(cx+p.face*2,top+4.5,1,0,7);x.fill();if(dead){x.restore()}}
function draw(now=performance.now()){x.fillStyle='#CFE8F8';x.fillRect(0,0,W,H);if(!G)return;x.save();x.scale(sc,sc);x.translate(-G.cam,VY);
  const vw=W/sc,c0=Math.max(0,Math.floor(G.cam/T)-1),c1=Math.ceil((G.cam+vw)/T)+1;
  x.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<8;i++){const cx=i*260+60-G.cam*.4+G.cam,cy=40+(i%3)*30;x.beginPath();x.ellipse(cx,cy,34,12,0,0,7);x.ellipse(cx+20,cy-8,20,12,0,0,7);x.fill()}
  for(let c=c0;c<=c1;c++)for(let r=0;r<ROWS;r++)if(isSolid(c,r)){const top=!isSolid(c,r-1);x.fillStyle='#A8794E';x.fillRect(c*T,r*T,T,T);if(top){x.fillStyle='#5BB65A';x.fillRect(c*T,r*T,T,6)}x.strokeStyle='rgba(0,0,0,.12)';x.lineWidth=1;x.strokeRect(c*T+.5,r*T+.5,T-1,T-1)}
  for(const [c,r] of (G.L.s||[]))spike(c*T,r*T,1);
  for(const t of G.traps)if(t.t==='pop'&&t.on)spike(t.x*T,t.y*T,t.k);
  for(const f of G.falling){x.fillStyle=f.deadly?'#7A6A5C':'#A8794E';x.fillRect(f.x,f.y,T,T);if(f.deadly){x.strokeStyle='#3D332B';x.lineWidth=2;x.strokeRect(f.x+1,f.y+1,T-2,T-2);x.fillStyle='#3D332B';x.fillRect(f.x+6,f.y+8,3,3);x.fillRect(f.x+15,f.y+8,3,3);x.fillRect(f.x+7,f.y+16,10,2)}}
  for(const a of G.projs){x.strokeStyle='#5B4636';x.lineWidth=2;x.beginPath();x.moveTo(a.x-10,a.y);x.lineTo(a.x+12,a.y);x.stroke();x.fillStyle='#8A93A6';x.beginPath();x.moveTo(a.x-14,a.y);x.lineTo(a.x-7,a.y-4);x.lineTo(a.x-7,a.y+4);x.fill()}
  for(const t of G.traps)if(t.t==='fake'&&!t.on)flag(t.x,true);
  flag(G.goalX);stick(G.p,now);x.restore()}
function overlay(html,cb){$('#tr-box').querySelectorAll('.tr-over').forEach(o=>o.remove());if(!html)return;const o=document.createElement('div');o.className='tr-over';o.innerHTML=html;$('#tr-box').appendChild(o);if(cb)setTimeout(()=>o.onclick=cb,400);return o}
function menu(){if(G&&G.state==='play')G.state='menu';let b='';for(let i=1;i<=LV.length;i++){const r=bests[i];b+=`<button type="button" data-s="${i}" ${i>unlocked?'disabled':''}>${i}<small>${r!==undefined?'ミス'+r:i>unlocked?'🔒':'—'}</small></button>`}
  const o=overlay(`<h3>棒人間トラップ</h3><p>◀ ▶ で移動、ジャンプで跳ぶ<br>（短く押すと小ジャンプ）</p><p>旗まで行けばクリア…だけど<br>いじわるな罠がいっぱい。覚えて進もう</p><div class="tr-stg">${b}</div><p style="font-size:12px;opacity:.8">ミス合計 ${total}回</p>`);
  o.querySelectorAll('[data-s]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();load(+e.dataset.s)})}
document.querySelectorAll('.tr-pad [data-k]').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};const off=()=>{keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault())});
const KM={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'J',Space:'J',KeyZ:'J'};
document.addEventListener('keydown',e=>{const k=KM[e.code];if(k){e.preventDefault();keys[k]=1}});document.addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden)keys={L:0,R:0,J:0}});
$('#tr-menu').onclick=menu;
new ResizeObserver(size).observe($('#tr-box'));hud();
load(Math.min(unlocked,LV.length));G.state='menu';size();menu();
if(/debug=1/.test(location.search))window.__tr={get G(){return G},keys,load};
});
</script>
<script>regSW('../sw.js')</script>
</body>
</html>
