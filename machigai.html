<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>間違い探し｜すきま脳トレ箱</title>
<meta name="theme-color" content="#EBF0F6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#EBF0F6; --grid:#D9E1EC; --card:#FFFFFF; --ink:#18264A; --ink2:#5B6886; --line:#C2CDDD;
  --mark:#F7C843; --markInk:#18264A; --pen:#D2433A; --penBg:#FBE3E0; --pencil:#2F63D3; --ok:#2B8A57; --okBg:#DDF1E4;
  --peer:#E3E9F3; --cellX:#9AA6B8;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827; --grid:#1A2335; --card:#1B2438; --ink:#E4E9F3; --ink2:#97A3BD; --line:#33405A;
  --mark:#F2C23A; --markInk:#18264A; --pen:#FF6B5F; --penBg:#3F2023; --pencil:#7FA6FF; --ok:#4FC283; --okBg:#173326;
  --peer:#232E46; --cellX:#6E7A92;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --grid:#1A2335; --card:#1B2438; --ink:#E4E9F3; --ink2:#97A3BD; --line:#33405A;
  --mark:#F2C23A; --markInk:#18264A; --pen:#FF6B5F; --penBg:#3F2023; --pencil:#7FA6FF; --ok:#4FC283; --okBg:#173326;
  --peer:#232E46; --cellX:#6E7A92;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font-family:var(--body);color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:10px;padding-block:12px 8px}
.back{font:700 13px var(--body);color:var(--ink);text-decoration:none;padding:7px 12px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);white-space:nowrap}
.bar h2{font:400 19px var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font:700 14px var(--body);font-variant-numeric:tabular-nums;background:var(--mark);color:var(--markInk);padding:4px 10px;border-radius:6px;white-space:nowrap}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:8px 10px;font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.btn.primary{background:var(--mark);color:var(--markInk)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4}
.msg{text-align:center;min-height:1.5em;margin:8px 0;font-weight:700;font-size:14px}
.msg.win{color:var(--ok)} .msg.warn{color:var(--pen)}
.scrim{position:fixed;inset:0;background:rgba(10,16,32,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--paper);border-radius:16px 16px 0 0;border:2px solid var(--ink);border-bottom:0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font:400 22px var(--display);margin:0;text-align:center}
.sheet p{margin:0;font-size:13.5px;line-height:1.65}
.sheet .row{display:flex;gap:8px}
.sheet .row .btn{flex:1;padding:12px;font-size:14px}
.note{font-size:12px;color:var(--ink2);line-height:1.6}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:8px}
.found{display:flex;gap:4px;margin-left:auto}
.found i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block}
.found i.on{background:var(--ok);border-color:var(--ok)}
.pics{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}
.pw{position:relative;width:100%;max-width:100%;aspect-ratio:36/25;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.pw canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;display:block}
.pw .lab{position:absolute;left:6px;top:6px;font-size:10.5px;font-weight:900;background:var(--card);color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 5px;pointer-events:none}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:16px}
.tools .btn{padding:11px 4px;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header class="bar"><a class="back" href="./">‹ 戻る</a><h2>間違い探し</h2><span class="timer" id="time">00:00</span></header>
  <div class="opts">
    <div class="seg" id="diff" role="group" aria-label="難しさ"><button type="button" data-v="easy">かんたん</button><button type="button" data-v="normal">ふつう</button><button type="button" data-v="hard">むずかしい</button></div>
    <div class="found" id="found"></div>
  </div>
  <div class="pics" id="pics">
    <div class="pw" id="wA"><canvas id="cA"></canvas><span class="lab">もと</span></div>
    <div class="pw" id="wB"><canvas id="cB"></canvas><span class="lab">ちがう所がある</span></div>
  </div>
  <p class="msg" id="msg">下の絵の、上と違う所をタップ</p>
  <div class="tools">
    <button class="btn" id="hint" type="button">ヒント</button>
    <button class="btn primary" id="new" type="button">新しい問題</button>
  </div>
</div>
<div id="layer"></div>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('sukima_mg_'+k);return v!=null?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('sukima_mg_'+k,JSON.stringify(v))}catch(e){}}};
const fmt=s=>{s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.random()*a.length|0];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const VW=360,VH=250;
const PAL=['#D2433A','#E07B39','#F2C23A','#4FA35A','#4F86C6','#8A5FB5','#EE8FB3','#FFFFFF','#3A3A44'];
const otherColor=c=>pick(PAL.filter(x=>x!==c&&!(c==='#FFFFFF'&&x==='#F2C23A')));

/* ================= drawers ================= */
const D={
  sun(x,o){x.fillStyle=o.c;x.beginPath();x.arc(o.x,o.y,18*o.s,0,7);x.fill();
    if(o.v){x.strokeStyle=o.c;x.lineWidth=3;for(let i=0;i<8;i++){const a=i*Math.PI/4;x.beginPath();x.moveTo(o.x+Math.cos(a)*24*o.s,o.y+Math.sin(a)*24*o.s);x.lineTo(o.x+Math.cos(a)*31*o.s,o.y+Math.sin(a)*31*o.s);x.stroke()}}},
  cloud(x,o){x.fillStyle='#FFFFFF';const n=3+o.v;for(let i=0;i<n;i++){x.beginPath();x.arc(o.x+(i-(n-1)/2)*13*o.s,o.y-(i%2?6:0)*o.s,12*o.s,0,7);x.fill()}},
  bird(x,o){x.strokeStyle='#2B2B33';x.lineWidth=2.2;x.lineCap='round';const f=o.flip?-1:1;x.beginPath();x.moveTo(o.x-9*f,o.y-4);x.quadraticCurveTo(o.x-4*f,o.y-8,o.x,o.y);x.quadraticCurveTo(o.x+5*f,o.y-9,o.x+11*f,o.y-3);x.stroke()},
  house(x,o){const w=62*o.s,h=48*o.s,l=o.x-w/2,t=o.y-h;
    x.fillStyle=o.c;x.fillRect(l,t,w,h);x.fillStyle=o.c2;x.beginPath();x.moveTo(l-6,t);x.lineTo(o.x,t-30*o.s);x.lineTo(l+w+6,t);x.closePath();x.fill();
    x.fillStyle='#8A5A36';x.fillRect(o.x-7*o.s,o.y-22*o.s,14*o.s,22*o.s);
    x.fillStyle=o.c3;const wins=o.v?2:1;for(let i=0;i<wins;i++){const wx=wins===1?l+8*o.s:(i?l+w-20*o.s:l+6*o.s);x.fillRect(wx,t+10*o.s,13*o.s,12*o.s)}
    if(o.v2){x.fillStyle='#5A4A44';x.fillRect(l+w-16*o.s,t-24*o.s,8*o.s,16*o.s)}},
  tree(x,o){x.fillStyle='#8A5A36';x.fillRect(o.x-4*o.s,o.y-28*o.s,8*o.s,28*o.s);x.fillStyle=o.c;x.beginPath();x.arc(o.x,o.y-40*o.s,20*o.s,0,7);x.fill();
    if(o.v){x.fillStyle='#D2433A';for(const[dx,dy]of[[-8,-44],[7,-38],[-2,-30]]){x.beginPath();x.arc(o.x+dx*o.s,o.y+dy*o.s,3.2*o.s,0,7);x.fill()}}},
  car(x,o){const f=o.flip?-1:1,s=o.s;x.save();x.translate(o.x,o.y);x.scale(f,1);
    x.fillStyle=o.c;x.beginPath();x.roundRect(-26*s,-16*s,52*s,14*s,4);x.fill();x.beginPath();x.roundRect(-14*s,-27*s,26*s,13*s,5);x.fill();
    x.fillStyle='#CFE3F5';x.fillRect(-10*s,-24*s,9*s,8*s);x.fillRect(1*s,-24*s,8*s,8*s);
    x.fillStyle='#2B2B33';x.beginPath();x.arc(-15*s,-2*s,6*s,0,7);x.arc(15*s,-2*s,6*s,0,7);x.fill();
    x.fillStyle='#F2C23A';x.fillRect(22*s,-13*s,4*s,4*s);x.restore()},
  flower(x,o){x.strokeStyle='#3F7A3A';x.lineWidth=2;x.beginPath();x.moveTo(o.x,o.y);x.lineTo(o.x,o.y-14*o.s);x.stroke();x.fillStyle=o.c;
    for(let i=0;i<5;i++){const a=i*Math.PI*2/5;x.beginPath();x.arc(o.x+Math.cos(a)*5*o.s,o.y-14*o.s+Math.sin(a)*5*o.s,3.6*o.s,0,7);x.fill()}
    x.fillStyle='#F2C23A';x.beginPath();x.arc(o.x,o.y-14*o.s,2.6*o.s,0,7);x.fill()},
  kite(x,o){x.fillStyle=o.c;x.beginPath();x.moveTo(o.x,o.y-14);x.lineTo(o.x+10,o.y);x.lineTo(o.x,o.y+14);x.lineTo(o.x-10,o.y);x.closePath();x.fill();
    x.strokeStyle='#2B2B33';x.lineWidth=1;x.beginPath();x.moveTo(o.x,o.y+14);x.quadraticCurveTo(o.x-8,o.y+28,o.x+2,o.y+40);x.stroke()},
  fish(x,o){const f=o.flip?-1:1,s=o.s;x.save();x.translate(o.x,o.y);x.scale(f,1);
    x.fillStyle=o.c;x.beginPath();x.ellipse(0,0,20*s,12*s,0,0,7);x.fill();x.beginPath();x.moveTo(-16*s,0);x.lineTo(-30*s,-10*s);x.lineTo(-30*s,10*s);x.closePath();x.fill();
    x.fillStyle=o.c2;for(let i=0;i<o.v;i++){x.fillRect((-6+i*8)*s,-11*s,3.5*s,22*s)}
    x.fillStyle='#FFFFFF';x.beginPath();x.arc(10*s,-3*s,4*s,0,7);x.fill();x.fillStyle='#2B2B33';x.beginPath();x.arc(11*s,-3*s,2*s,0,7);x.fill();x.restore()},
  bubbles(x,o){x.strokeStyle='#FFFFFF';x.lineWidth=1.6;const n=2+o.v;for(let i=0;i<n;i++){x.beginPath();x.arc(o.x+(i%2?5:-3),o.y-i*11,4+(i%3),0,7);x.stroke()}},
  weed(x,o){x.strokeStyle=o.c;x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(o.x,o.y);const h=50*o.s;
    for(let i=1;i<=6;i++)x.quadraticCurveTo(o.x+(i%2?9:-9),o.y-h*(i-.5)/6,o.x,o.y-h*i/6);x.stroke()},
  rock(x,o){x.fillStyle=o.c;x.beginPath();x.ellipse(o.x,o.y-10*o.s,24*o.s,13*o.s,0,Math.PI,0);x.lineTo(o.x+24*o.s,o.y);x.lineTo(o.x-24*o.s,o.y);x.fill()},
  starfish(x,o){x.fillStyle=o.c;x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=(i%2?5:13)*o.s;x.lineTo(o.x+Math.cos(a)*r,o.y+Math.sin(a)*r)}x.closePath();x.fill()},
  jelly(x,o){x.fillStyle=o.c;x.beginPath();x.arc(o.x,o.y,15*o.s,Math.PI,0);x.closePath();x.fill();x.strokeStyle=o.c;x.lineWidth=2;
    const n=3+o.v;for(let i=0;i<n;i++){const tx=o.x-11*o.s+i*(22*o.s/(n-1));x.beginPath();x.moveTo(tx,o.y);x.quadraticCurveTo(tx+4,o.y+10,tx,o.y+20);x.stroke()}},
  shell(x,o){const f=o.flip?-1:1;x.fillStyle=o.c;x.beginPath();x.moveTo(o.x-12,o.y);x.quadraticCurveTo(o.x-12,o.y-18,o.x+2*f,o.y-16);x.quadraticCurveTo(o.x+14,o.y-10,o.x+12,o.y);x.closePath();x.fill();
    x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=1;for(let i=-1;i<=1;i++){x.beginPath();x.moveTo(o.x+i*6,o.y);x.lineTo(o.x+i*2,o.y-14);x.stroke()}},
  win(x,o){x.fillStyle='#BFE0F7';x.fillRect(o.x-34,o.y-30,68,60);if(o.v2){x.fillStyle='#F2C23A';x.beginPath();x.arc(o.x+14,o.y-12,8,0,7);x.fill()}
    x.strokeStyle='#FFFFFF';x.lineWidth=4;x.strokeRect(o.x-34,o.y-30,68,60);x.beginPath();x.moveTo(o.x,o.y-30);x.lineTo(o.x,o.y+30);if(o.v){x.moveTo(o.x-34,o.y);x.lineTo(o.x+34,o.y)}x.stroke();
    x.fillStyle=o.c2;x.fillRect(o.x-46,o.y-36,16,74);x.fillRect(o.x+30,o.y-36,16,74)},
  frame(x,o){x.fillStyle=o.c;x.fillRect(o.x-24,o.y-18,48,36);x.fillStyle='#FFFFFF';x.fillRect(o.x-18,o.y-12,36,24);
    if(o.v){x.fillStyle='#4FA35A';x.beginPath();x.moveTo(o.x-18,o.y+12);x.lineTo(o.x-4,o.y-6);x.lineTo(o.x+6,o.y+4);x.lineTo(o.x+12,o.y-2);x.lineTo(o.x+18,o.y+12);x.fill()}
    else{x.fillStyle='#E07B39';x.beginPath();x.arc(o.x,o.y,7,0,7);x.fill()}},
  shelf(x,o){x.fillStyle='#8A5A36';x.fillRect(o.x-40,o.y,80,6);const cols=['#D2433A','#4F86C6','#F2C23A','#4FA35A','#8A5FB5','#E07B39'];
    for(let i=0;i<4+o.v;i++){x.fillStyle=cols[(i+o.c|0)%6];const h=22+(i*7%9);x.fillRect(o.x-36+i*12,o.y-h,10,h)}},
  lamp(x,o){const f=o.flip?-1:1;x.strokeStyle='#3A3A44';x.lineWidth=3;x.beginPath();x.moveTo(o.x,o.y);x.lineTo(o.x,o.y-40);x.lineTo(o.x+14*f,o.y-52);x.stroke();
    x.fillStyle='#3A3A44';x.fillRect(o.x-12,o.y-3,24,5);x.fillStyle=o.c;x.beginPath();x.moveTo(o.x+6*f,o.y-56);x.lineTo(o.x+24*f,o.y-62);x.lineTo(o.x+28*f,o.y-44);x.lineTo(o.x+12*f,o.y-40);x.closePath();x.fill()},
  table(x,o){x.fillStyle='#8A5A36';x.fillRect(o.x-44,o.y-34,88,7);x.fillRect(o.x-38,o.y-27,6,27);x.fillRect(o.x+32,o.y-27,6,27)},
  cup(x,o){x.fillStyle=o.c;x.fillRect(o.x-8,o.y-16,16,16);x.strokeStyle=o.c;x.lineWidth=3;x.beginPath();x.arc(o.x+9,o.y-9,4.5,-Math.PI/2,Math.PI/2);x.stroke();
    if(o.v){x.strokeStyle='#9AA6B8';x.lineWidth=1.6;for(const dx of[-3,3]){x.beginPath();x.moveTo(o.x+dx,o.y-19);x.quadraticCurveTo(o.x+dx+4,o.y-24,o.x+dx,o.y-30);x.stroke()}}},
  plant(x,o){x.fillStyle='#3F7A3A';const n=3+o.v;for(let i=0;i<n;i++){const a=-Math.PI/2+(i-(n-1)/2)*.45;x.beginPath();x.ellipse(o.x+Math.cos(a)*14,o.y-22+Math.sin(a)*14,5,11,a+Math.PI/2,0,7);x.fill()}
    x.fillStyle=o.c;x.beginPath();x.moveTo(o.x-12,o.y-20);x.lineTo(o.x+12,o.y-20);x.lineTo(o.x+9,o.y);x.lineTo(o.x-9,o.y);x.closePath();x.fill()},
  clock(x,o){x.fillStyle='#FFFFFF';x.beginPath();x.arc(o.x,o.y,15,0,7);x.fill();x.strokeStyle=o.c;x.lineWidth=3;x.stroke();
    x.strokeStyle='#2B2B33';x.lineWidth=2;const a=o.v?Math.PI:0;x.beginPath();x.moveTo(o.x,o.y);x.lineTo(o.x,o.y-11);x.moveTo(o.x,o.y);x.lineTo(o.x+Math.cos(a)*8,o.y);x.stroke()},
  rug(x,o){x.fillStyle=o.c;x.beginPath();x.ellipse(o.x,o.y,60,10,0,0,7);x.fill();if(o.v){x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.beginPath();x.ellipse(o.x,o.y,44,6,0,0,7);x.stroke()}},
  ball(x,o){x.fillStyle=o.c;x.beginPath();x.arc(o.x,o.y-8,8,0,7);x.fill();x.strokeStyle='#FFFFFF';x.lineWidth=1.5;x.beginPath();x.arc(o.x,o.y-8,8,-.6,.6);x.stroke()},
};
// mutation kinds allowed per type, hit radius
const META={
  sun:{m:['c','v'],r:24},cloud:{m:['remove','v'],r:26},bird:{m:['remove','flip'],r:14},house:{m:['c','c2','c3','v','v2'],r:34},
  tree:{m:['c','v','remove','scale'],r:24},car:{m:['c','flip','remove'],r:26},flower:{m:['c','remove'],r:14},kite:{m:['c','remove'],r:18},
  fish:{m:['c','c2','v','flip','remove'],r:24},bubbles:{m:['v','remove'],r:16},weed:{m:['scale','remove'],r:22},rock:{m:['c','scale'],r:24},
  starfish:{m:['c','remove'],r:16},jelly:{m:['c','v','remove'],r:20},shell:{m:['c','remove','flip'],r:15},
  win:{m:['c2','v','v2'],r:40},frame:{m:['c','v'],r:26},shelf:{m:['v','c'],r:36},lamp:{m:['c','flip'],r:28},cup:{m:['c','v','remove'],r:16},
  plant:{m:['c','v'],r:22},clock:{m:['c','v'],r:18},rug:{m:['c','v'],r:40},ball:{m:['c','remove'],r:12},table:{m:[],r:0},
};
const SUBTLE=['scale','flip','v2','c3'];

/* ================= scenes ================= */
function town(){
  const o=[],P=()=>pick(PAL.slice(0,7));
  o.push({t:'sun',x:rnd(30,60),y:rnd(30,45),s:1,c:'#F2C23A',v:ri(0,1)});
  for(let i=0;i<2;i++)o.push({t:'cloud',x:120+i*120+rnd(-20,20),y:rnd(28,55),s:rnd(.9,1.2),v:ri(0,1)});
  for(let i=0;i<2;i++)o.push({t:'bird',x:rnd(90,300),y:rnd(70,95),flip:ri(0,1)});
  const hx=shuffle([60,175,290]);
  hx.forEach((x,i)=>o.push({t:'house',x:x+rnd(-8,8),y:180,s:rnd(.9,1.1),c:pick(['#F4E1C1','#DCE7F2','#F6D2C9','#E7E0F4']),c2:P(),c3:pick(['#F2C23A','#BFE0F7']),v:ri(0,1),v2:ri(0,1)}));
  for(const x of [118,232])o.push({t:'tree',x:x+rnd(-6,6),y:182,s:rnd(.85,1.05),c:pick(['#4FA35A','#3F7A3A','#6CBF5E']),v:ri(0,1)});
  o.push({t:'car',x:rnd(60,140),y:236,s:1,c:P(),flip:ri(0,1)});o.push({t:'car',x:rnd(220,310),y:236,s:.9,c:P(),flip:ri(0,1)});
  for(let i=0;i<4;i++)o.push({t:'flower',x:20+i*90+rnd(0,40),y:206,s:1,c:pick(['#D2433A','#EE8FB3','#F2C23A','#8A5FB5','#FFFFFF'])});
  return {bg:'town',objs:o,adds:[()=>({t:'bird',x:rnd(40,330),y:rnd(60,100),flip:ri(0,1)}),()=>({t:'kite',x:rnd(60,300),y:rnd(40,80),c:P()}),()=>({t:'flower',x:rnd(15,345),y:206,s:1,c:'#D2433A'}),()=>({t:'ball',x:rnd(20,340),y:212,c:P()})]};
}
function sea(){
  const o=[],P=()=>pick(['#E07B39','#F2C23A','#D2433A','#8A5FB5','#EE8FB3','#4FA35A']);
  for(let i=0;i<3;i++)o.push({t:'weed',x:30+i*130+rnd(-15,15),y:240,s:rnd(.9,1.4),c:'#3F9A55'});
  o.push({t:'rock',x:rnd(70,120),y:242,s:rnd(.9,1.2),c:'#7D7F86'});o.push({t:'rock',x:rnd(240,300),y:242,s:rnd(.8,1.1),c:'#6A6E78'});
  const fy=shuffle([45,85,125,165]);
  const fx=shuffle([60,150,240,300]);
  for(let i=0;i<4;i++)o.push({t:'fish',x:fx[i]+rnd(-12,12),y:fy[i]+rnd(-6,6),s:rnd(.85,1.15),c:P(),c2:'#FFFFFF',v:ri(0,2),flip:ri(0,1)});
  o.push({t:'jelly',x:rnd(190,330),y:rnd(30,60),s:1,c:'#EE8FB3',v:ri(0,2)});
  for(let i=0;i<2;i++)o.push({t:'bubbles',x:rnd(30,330),y:rnd(110,200),v:ri(0,2)});
  o.push({t:'starfish',x:rnd(150,210),y:236,s:1,c:pick(['#E07B39','#D2433A','#F2C23A'])});
  o.push({t:'shell',x:rnd(20,60),y:240,c:'#F6D2C9',flip:ri(0,1)});o.push({t:'shell',x:rnd(320,345),y:240,c:'#F4E1C1',flip:ri(0,1)});
  return {bg:'sea',objs:o,adds:[()=>({t:'bubbles',x:rnd(30,330),y:rnd(90,200),v:0}),()=>({t:'starfish',x:rnd(30,330),y:238,s:.8,c:'#F2C23A'}),()=>({t:'fish',x:rnd(40,320),y:rnd(40,200),s:.6,c:P(),c2:'#FFFFFF',v:0,flip:ri(0,1)})]};
}
function room(){
  const o=[],P=()=>pick(PAL.slice(0,7));
  o.push({t:'win',x:rnd(85,110),y:80,c2:P(),v:ri(0,1),v2:ri(0,1)});
  o.push({t:'frame',x:rnd(200,230),y:62,c:pick(['#8A5A36','#3A3A44','#F2C23A']),v:ri(0,1)});
  o.push({t:'clock',x:rnd(300,325),y:48,c:P(),v:ri(0,1)});
  o.push({t:'shelf',x:rnd(280,305),y:120,c:ri(0,5),v:ri(0,1)});
  o.push({t:'rug',x:180,y:228,c:P(),v:ri(0,1)});
  o.push({t:'table',x:200,y:210});
  o.push({t:'cup',x:rnd(180,220),y:176,c:P(),v:ri(0,1)});
  o.push({t:'lamp',x:rnd(40,60),y:210,c:P(),flip:0});
  o.push({t:'plant',x:rnd(300,335),y:212,c:P(),v:ri(0,2)});
  return {bg:'room',objs:o,adds:[()=>({t:'ball',x:rnd(110,280),y:236,c:P()}),()=>({t:'cup',x:rnd(176,226),y:176,c:P(),v:0})]};
}
function drawBg(x,bg){
  if(bg==='town'){const g=x.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#9FD0F2');g.addColorStop(.7,'#DDF0FB');x.fillStyle=g;x.fillRect(0,0,VW,VH);
    x.fillStyle='#7CC46C';x.fillRect(0,180,VW,VH-180);x.fillStyle='#8B8F99';x.fillRect(0,214,VW,30);x.fillStyle='#FFFFFF';for(let i=0;i<VW;i+=40)x.fillRect(i+10,228,20,3)}
  if(bg==='sea'){const g=x.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#5DB8E0');g.addColorStop(1,'#1F6FA8');x.fillStyle=g;x.fillRect(0,0,VW,VH);
    x.fillStyle='#E9D6A6';x.beginPath();x.moveTo(0,VH);x.lineTo(0,226);x.quadraticCurveTo(180,212,VW,228);x.lineTo(VW,VH);x.fill()}
  if(bg==='room'){x.fillStyle='#F4ECDD';x.fillRect(0,0,VW,VH);x.fillStyle='#E6D8BF';for(let i=0;i<VW;i+=30)x.fillRect(i,0,2,190);
    x.fillStyle='#C8A57A';x.fillRect(0,190,VW,VH-190);x.fillStyle='#B48E62';for(let i=0;i<VW;i+=45)x.fillRect(i,190,2,VH-190)}
}
function drawScene(x,sc,objs){drawBg(x,sc.bg);for(const o of objs)if(!o.gone)D[o.t](x,o)}

/* ================= puzzle ================= */
function hitOf(o){const m=META[o.t],s=o.s||1;let cy=o.y;
  if(['house'].includes(o.t))cy=o.y-38*s;if(o.t==='tree')cy=o.y-34*s;if(o.t==='car')cy=o.y-14;if(o.t==='flower')cy=o.y-12;if(o.t==='weed')cy=o.y-25*s;if(o.t==='rock')cy=o.y-8;
  if(o.t==='bubbles')cy=o.y-10;if(o.t==='shelf')cy=o.y-14;if(o.t==='lamp')cy=o.y-34;if(o.t==='cup')cy=o.y-12;if(o.t==='plant')cy=o.y-20;if(o.t==='shell'||o.t==='starfish')cy=o.y-7;if(o.t==='jelly')cy=o.y+4;if(o.t==='ball')cy=o.y-8;
  return {x:o.x,y:cy,r:Math.max(m.r*(o.s||1),12)}}
function makePuzzle(diff){
  for(let tries=0;tries<50;tries++){
    const sc=pick([town,sea,room])();
    const A=sc.objs,B=A.map(o=>({...o}));
    const n=diff==='hard'?7:5;
    const diffs=[];
    const cand=shuffle(B.map((o,i)=>i).filter(i=>META[B[i].t].m.length));
    const far=h=>diffs.every(d=>Math.hypot(d.x-h.x,d.y-h.y)>Math.max(34,d.r+h.r-14));
    let adds=diff==='easy'?1:ri(0,1);
    for(let k=0;k<adds&&sc.adds.length;k++){
      for(let t=0;t<10;t++){const o=pick(sc.adds)();const h=hitOf(o);if(far(h)&&A.every(a=>{const ha=hitOf(a);return Math.hypot(ha.x-h.x,ha.y-h.y)>ha.r*.8+h.r})){B.push(o);diffs.push({...h,kind:'add'});break}}
    }
    for(const i of cand){
      if(diffs.length>=n)break;
      const o=B[i],h=hitOf(o);if(!far(h))continue;
      let kinds=META[o.t].m.slice();if(diff==='easy')kinds=kinds.filter(k=>!SUBTLE.includes(k));if(!kinds.length)continue;
      const k=pick(kinds);
      if(k==='c'){if(o.t==='shelf')o.c=(o.c+3)%6;else o.c=otherColor(o.c)}
      else if(k==='c2')o.c2=o.t==='fish'?pick(['#2B2B33','#F2C23A']):otherColor(o.c2);
      else if(k==='c3')o.c3=o.c3==='#F2C23A'?'#BFE0F7':'#F2C23A';
      else if(k==='v'){const max=['fish','jelly','bubbles','plant'].includes(o.t)?2:1;let nv=o.v;while(nv===o.v)nv=ri(0,max);o.v=nv}
      else if(k==='v2')o.v2=o.v2?0:1;
      else if(k==='flip')o.flip=o.flip?0:1;
      else if(k==='remove')o.gone=true;
      else if(k==='scale')o.s=(o.s||1)*(Math.random()<.5?.72:1.32);
      diffs.push({...h,kind:k});
    }
    if(diffs.length===n)return {sc,A,B,diffs:diffs.map(d=>({...d,found:false}))};
  }
}

/* ================= game ================= */
let G=null,diff=store.get('diff','normal'),tAcc=0,tStart=null,tIv=null;
const now=()=>tAcc+(tStart?(performance.now()-tStart)/1000:0);
function clockRun(){if(tStart)return;tStart=performance.now();tIv=setInterval(()=>$('#time').textContent=fmt(now()),500)}
function clockStop(){if(!tStart)return;tAcc=now();tStart=null;clearInterval(tIv);$('#time').textContent=fmt(tAcc)}
function newGame(){G=makePuzzle(diff);G.miss=0;G.hints=0;G.marks=[];G.done=false;tAcc=0;tStart=null;clockStop();$('#time').textContent='00:00';clockRun();draw();status()}
function setup(c){const d=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=Math.round(w*d);c.height=Math.round(h*d);const x=c.getContext('2d');x.setTransform(c.width/VW,0,0,c.height/VH,0,0);return x}
function circle(x,d,col,lw){x.strokeStyle=col;x.lineWidth=lw;x.beginPath();x.arc(d.x,d.y,Math.max(16,d.r*.9),0,7);x.stroke()}
function draw(){if(!G)return;
  for(const [id,objs] of [['#cA',G.A],['#cB',G.B]]){const x=setup($(id));drawScene(x,G.sc,objs);
    for(const d of G.diffs)if(d.found){circle(x,d,'#FFFFFF',6);circle(x,d,'#2B8A57',3.5)}
    if(G.flash){circle(x,G.flash,'#F2C23A',4)}
    for(const m of G.marks){x.strokeStyle='#D2433A';x.lineWidth=3.5;x.beginPath();x.moveTo(m.x-8,m.y-8);x.lineTo(m.x+8,m.y+8);x.moveTo(m.x+8,m.y-8);x.lineTo(m.x-8,m.y+8);x.stroke()}}
}
function status(){
  const n=G.diffs.length,f=G.diffs.filter(d=>d.found).length;
  $('#found').innerHTML=G.diffs.map(d=>`<i class="${d.found?'on':''}"></i>`).join('');
  const m=$('#msg');
  if(G.done){m.className='msg win';m.textContent=`全部見つけた！ ${fmt(tAcc)}`}
  else{m.className='msg'+(G.miss?' warn':'');m.textContent=`あと ${n-f}か所`+(G.miss?`・おてつき ${G.miss}`:'')+(G.hints?`・ヒント ${G.hints}`:'')}
}
function tap(e){
  if(!G||G.done)return;const c=e.currentTarget,r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH;
  let best=null,bd=1e9;
  for(const d of G.diffs){if(d.found)continue;const dist=Math.hypot(d.x-x,d.y-y);if(dist<Math.max(24,d.r)+6&&dist<bd){bd=dist;best=d}}
  if(best){best.found=true;G.flash=null;navigator.vibrate?.(15);
    if(G.diffs.every(d=>d.found))finish()}
  else if(!G.diffs.some(d=>d.found&&Math.hypot(d.x-x,d.y-y)<Math.max(24,d.r)+6)){
    G.miss++;const m={x,y};G.marks.push(m);setTimeout(()=>{G.marks=G.marks.filter(k=>k!==m);draw()},700)}
  draw();status();
}
function finish(){
  G.done=true;clockStop();
  const best=store.get('best',{});const t=Math.floor(tAcc);let nb=false;
  if(!G.hints&&(best[diff]==null||t<best[diff])){best[diff]=t;store.set('best',best);nb=true}
  store.set('count',store.get('count',0)+1);
  status();
  setTimeout(()=>{$('#layer').innerHTML=`<div class="scrim"><div class="sheet"><h3>全部見つけた！</h3>
    <p style="text-align:center">タイム ${fmt(t)}${nb?'　ベスト更新！':''}<br><span class="note">おてつき ${G.miss}・ヒント ${G.hints}${G.hints?'（ヒントを使うとベストに残りません）':''}</span></p>
    <div class="row"><button class="btn" type="button" data-a="stay">絵を見る</button><button class="btn primary" type="button" data-a="next">次の問題</button></div></div></div>`;
    $('#layer').querySelector('.sheet').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;$('#layer').innerHTML='';if(b.dataset.a==='next')newGame()}},500);
}
$('#cA').addEventListener('pointerdown',tap);$('#cB').addEventListener('pointerdown',tap);
$('#hint').onclick=()=>{if(!G||G.done)return;const d=G.diffs.find(d=>!d.found);if(!d)return;G.hints++;G.flash=d;draw();status();setTimeout(()=>{if(G.flash===d){G.flash=null;draw()}},1300)};
$('#new').onclick=newGame;
for(const b of $('#diff').children)b.setAttribute('aria-pressed',String(b.dataset.v===diff));
$('#diff').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;diff=b.dataset.v;store.set('diff',diff);for(const x of $('#diff').children)x.setAttribute('aria-pressed',String(x===b));newGame()});
function fit(){const p=$('#pics').getBoundingClientRect();const h=(p.height-8)/2,w=Math.min(p.width,h*36/25);for(const id of ['#wA','#wB'])$(id).style.width=w+'px';draw()}
new ResizeObserver(fit).observe($('#pics'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)clockStop();else if(G&&!G.done)clockRun()});
newGame();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
