<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>すきま脳トレ箱</title>
<script>
/* 旧URL（#sudoku など）から来たら新しいページへ */
(function(){var m={sudoku:1,othello:1,slither:1,runner:1,ito:1};var h=location.hash.slice(1);if(m[h])location.replace('games/'+h+'.html')})();
</script>
<meta name="theme-color" content="#EBF0F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="すきま脳トレ箱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common/base.css">
<style>
#home{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:20px 32px}
.brand{display:flex;align-items:flex-start;gap:10px}
.brand .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tbtns{flex:none}
.brand h1{font:400 30px/1.15 var(--display);margin:0;letter-spacing:.02em}
.brand h1 span{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 2px}
.brand p{margin:0;color:var(--ink2);font-size:13px}
.tbtns{display:flex;gap:6px}
.tbtns .btn{padding:6px 10px}
h2.sec{font:400 16px var(--display);margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
h2.sec small{font:500 12px var(--body);color:var(--ink2)}
.cont{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-decoration:none;color:var(--markInk);background:var(--mark);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:3px 3px 0 var(--ink)}
.cont svg{width:48px;height:48px}
.cont b{font:400 17px var(--display);display:block}
.cont span{font-size:12px;font-weight:700}
.cont .go{font:400 22px var(--display)}
.saved{display:flex;flex-direction:column;gap:6px}
.sv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:8px 12px}
.sv b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv span{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sv .pbar{grid-column:1/-1}
.more{align-self:flex-start}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.recent a{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink);font-size:11px;font-weight:700;width:64px}
.recent svg{width:44px;height:44px;border-radius:10px;background:var(--card);border:1.5px solid var(--ink);padding:2px}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.card{position:relative;display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-decoration:none;color:var(--ink);
  background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:12px 44px 12px 12px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.card svg{width:52px;height:52px}
.card h3{margin:0 0 2px;font:400 17px var(--display)}
.card .d{margin:0;font-size:12px;color:var(--ink2)}
.card .s{margin:5px 0 0;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.fav{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;font-size:20px;color:var(--line);display:grid;place-items:center}
.fav[aria-pressed="true"]{color:var(--mark);text-shadow:0 0 0 var(--ink)}
.badge{display:inline-block;font-size:10.5px;font-weight:900;background:var(--mark);color:var(--markInk);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-family:var(--body)}
.foot{font-size:11.5px;color:var(--ink2);margin:0}
@media (min-width:700px){#app{max-width:860px}.cards{grid-template-columns:1fr 1fr}}
@media (orientation:landscape) and (max-height:520px){#app{max-width:860px}.cards{grid-template-columns:1fr 1fr}}
.data textarea{width:100%;height:80px;font:12px monospace;border:1.5px solid var(--ink);border-radius:8px;padding:8px;background:var(--card);color:var(--ink);word-break:break-all}
.data .info{font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.7}
</style>
</head>
<body>
<div id="app">
<section id="home">
  <div class="brand"><div class="ttl"><h1><span>すきま</span>脳トレ箱</h1><p>ちょっとした空き時間に。記録はこの端末に保存されます。</p></div>
    <div class="tbtns"><button class="btn" id="bSound" type="button" aria-pressed="true">音 オン</button><button class="btn" id="bData" type="button">データ</button></div></div>
  <a class="cont" id="cont" href="#" hidden></a>
  <div id="savedWrap" hidden><h2 class="sec">途中の問題 <small id="savedN"></small></h2><div class="saved" id="saved"></div></div>
  <div id="recentWrap" hidden><h2 class="sec">最近遊んだ</h2><div class="recent" id="recent"></div></div>
  <div id="favWrap" hidden><h2 class="sec">お気に入り</h2><div class="cards" id="favs"></div></div>
  <div><h2 class="sec">頭脳 <small>じっくり考える・途中から再開できる</small></h2><div class="cards" id="cat-brain"></div></div>
  <div><h2 class="sec">アクション <small>短い時間でサッと</small></h2><div class="cards" id="cat-action"></div></div>
  <div><h2 class="sec">そのほか <small>育てる・対戦する</small></h2><div class="cards" id="cat-other"></div></div>
  <p class="foot">ホーム画面に追加すると、アプリのように開けます。一度開けば電波がなくても遊べます。</p>
</section>
</div>
<div id="layer"></div>
<script src="common/save.js"></script>
<script src="common/ui.js"></script>
<script src="common/sfx.js"></script>
<script>
const GAMES=[
  {id:'sudoku',cat:'brain',name:'ナンプレ',d:'9×9に1〜9。メモ・ヒント付き',url:'games/sudoku.html',save:true},
  {id:'picross',cat:'brain',name:'ピクロス',d:'数字をヒントにマスを塗って絵を出す',url:'games/picross.html',save:true},
  {id:'slither',cat:'brain',name:'スリザーリンク',d:'数字の数だけ線を引いて1本の輪に',url:'games/slither.html',save:true},
  {id:'othello',cat:'brain',name:'オセロ',d:'CPUと対局。よわい・ふつう・つよい',url:'games/othello.html',save:true},
  {id:'machigai',cat:'brain',name:'間違い探し',d:'上と下の絵の違うところをタップ',url:'games/machigai.html'},
  {id:'runner',cat:'action',name:'坂道チャリ',d:'タップでジャンプ、空中でもう1回',url:'games/runner.html'},
  {id:'ito',cat:'action',name:'糸通し',d:'押して上がる操作で針の穴を通す',url:'games/ito.html'},
  {id:'ikusei',cat:'other',name:'ドット育成',d:'タマゴから育てて進化させる',url:'games/ikusei.html'},
  {id:'punch',cat:'other',name:'エビワラージャンケン',d:'3つのパンチで読み合うCPU対戦',url:'games/punch.html'},
  {id:'cardbattle',cat:'other',name:'カードバトル',d:'マナで召喚してCPUと1対1で対戦',url:'games/cardbattle.html',badge:'試作版'},
];
const ICON={"sudoku": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"50\" height=\"50\" rx=\"5\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/><path d=\"M19.7 3v50M36.3 3v50M3 19.7h50M3 36.3h50\" stroke=\"var(--line)\" stroke-width=\"1.5\"/><text x=\"11.3\" y=\"16\" font-size=\"11\" font-weight=\"900\" text-anchor=\"middle\" fill=\"var(--ink)\">5</text><text x=\"28\" y=\"32.6\" font-size=\"11\" font-weight=\"900\" text-anchor=\"middle\" fill=\"var(--pencil)\">3</text><text x=\"44.6\" y=\"49.2\" font-size=\"11\" font-weight=\"900\" text-anchor=\"middle\" fill=\"var(--ink)\">9</text><rect x=\"20.5\" y=\"37\" width=\"15\" height=\"15.5\" fill=\"var(--mark)\"/></svg>", "othello": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"50\" height=\"50\" rx=\"5\" fill=\"var(--board)\"/><path d=\"M28 3v50M3 28h50\" stroke=\"var(--boardLine)\" stroke-width=\"2\"/><circle cx=\"15.5\" cy=\"15.5\" r=\"9\" fill=\"var(--discW)\"/><circle cx=\"40.5\" cy=\"15.5\" r=\"9\" fill=\"var(--discB)\"/><circle cx=\"15.5\" cy=\"40.5\" r=\"9\" fill=\"var(--discB)\"/><circle cx=\"40.5\" cy=\"40.5\" r=\"9\" fill=\"var(--discW)\"/></svg>", "slither": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"50\" height=\"50\" rx=\"5\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/><path d=\"M14 14H42V28H28V42H14Z\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"3\" stroke-linejoin=\"round\"/><g fill=\"var(--ink2)\"><circle cx=\"14\" cy=\"14\" r=\"1.8\"/><circle cx=\"28\" cy=\"14\" r=\"1.8\"/><circle cx=\"42\" cy=\"14\" r=\"1.8\"/><circle cx=\"14\" cy=\"28\" r=\"1.8\"/><circle cx=\"28\" cy=\"28\" r=\"1.8\"/><circle cx=\"42\" cy=\"28\" r=\"1.8\"/><circle cx=\"14\" cy=\"42\" r=\"1.8\"/><circle cx=\"28\" cy=\"42\" r=\"1.8\"/><circle cx=\"42\" cy=\"42\" r=\"1.8\"/></g><text x=\"21\" y=\"25\" font-size=\"9\" font-weight=\"900\" text-anchor=\"middle\" fill=\"var(--ink)\">2</text><text x=\"21\" y=\"39\" font-size=\"9\" font-weight=\"900\" text-anchor=\"middle\" fill=\"var(--ink)\">3</text></svg>", "runner": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"50\" height=\"50\" rx=\"5\" fill=\"var(--skyTop)\"/><path d=\"M3 44Q18 30 30 40T53 34V53H3Z\" fill=\"var(--ground)\"/><circle cx=\"20\" cy=\"33\" r=\"6\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\"/><circle cx=\"35\" cy=\"31\" r=\"6\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\"/><path d=\"M20 33L26 24L35 31M26 24L32 22\" stroke=\"var(--ink)\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"29\" cy=\"15\" r=\"3.5\" fill=\"var(--mark)\"/></svg>", "ito": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"50\" height=\"50\" rx=\"5\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/><path d=\"M33 5V44L35 51L37 44V5Z\" fill=\"var(--steel)\"/><rect x=\"34\" y=\"13\" width=\"2\" height=\"10\" rx=\"1\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\".8\"/><path d=\"M6 40C14 40 16 18 24 18S30 18 44 18\" fill=\"none\" stroke=\"var(--pen)\" stroke-width=\"2.6\" stroke-linecap=\"round\"/></svg>", "picross": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"50\" height=\"50\" rx=\"5\" fill=\"var(--card)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/><g fill=\"var(--ink)\"><rect x=\"19\" y=\"19\" width=\"8\" height=\"8\"/><rect x=\"35\" y=\"19\" width=\"8\" height=\"8\"/><rect x=\"19\" y=\"27\" width=\"24\" height=\"8\"/><rect x=\"27\" y=\"35\" width=\"8\" height=\"8\"/></g><path d=\"M19 11v8M27 11v8M35 11v8M43 11v8M11 19h8M11 27h8M11 35h8M11 43h8\" stroke=\"var(--line)\" stroke-width=\"1\"/><text x=\"13\" y=\"17\" font-size=\"7\" font-weight=\"900\" fill=\"var(--ink2)\">1</text></svg>", "machigai": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"50\" height=\"23\" rx=\"4\" fill=\"#9FD0F2\"/><rect x=\"3\" y=\"30\" width=\"50\" height=\"23\" rx=\"4\" fill=\"#9FD0F2\"/><circle cx=\"18\" cy=\"14\" r=\"5\" fill=\"#F2C23A\"/><circle cx=\"18\" cy=\"41\" r=\"5\" fill=\"#D2433A\"/><rect x=\"32\" y=\"12\" width=\"12\" height=\"10\" fill=\"#4FA35A\"/><rect x=\"32\" y=\"39\" width=\"12\" height=\"10\" fill=\"#4FA35A\"/><circle cx=\"18\" cy=\"41\" r=\"9\" fill=\"none\" stroke=\"var(--ok)\" stroke-width=\"2.5\"/></svg>", "ikusei": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"5\" y=\"3\" width=\"46\" height=\"50\" rx=\"20\" fill=\"var(--mark)\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/><rect x=\"13\" y=\"15\" width=\"30\" height=\"20\" rx=\"3\" fill=\"#C5D19B\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/><g fill=\"#2E3A1C\"><rect x=\"23\" y=\"20\" width=\"10\" height=\"2\"/><rect x=\"21\" y=\"22\" width=\"2\" height=\"8\"/><rect x=\"33\" y=\"22\" width=\"2\" height=\"8\"/><rect x=\"23\" y=\"30\" width=\"10\" height=\"2\"/><rect x=\"25\" y=\"24\" width=\"2\" height=\"2\"/><rect x=\"29\" y=\"24\" width=\"2\" height=\"2\"/></g><circle cx=\"20\" cy=\"43\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"28\" cy=\"45\" r=\"3\" fill=\"var(--ink)\"/><circle cx=\"36\" cy=\"43\" r=\"3\" fill=\"var(--ink)\"/></svg>", "cardbattle": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#1c2c35\"/><rect x=\"10\" y=\"12\" width=\"20\" height=\"30\" rx=\"3\" fill=\"#efe6d2\" stroke=\"#b8894f\" stroke-width=\"2\" transform=\"rotate(-10 20 27)\"/><rect x=\"26\" y=\"14\" width=\"20\" height=\"30\" rx=\"3\" fill=\"#e7dff1\" stroke=\"#8f6bbd\" stroke-width=\"2\" transform=\"rotate(8 36 29)\"/><circle cx=\"13\" cy=\"13\" r=\"5\" fill=\"#e4a93c\" stroke=\"#10191f\" stroke-width=\"1.5\"/></svg>", "punch": "<svg viewBox=\"0 0 56 56\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#F4E7CF\" stroke=\"var(--ink)\" stroke-width=\"2.5\"/><circle cx=\"24\" cy=\"30\" r=\"13\" fill=\"#D2433A\" stroke=\"#18264A\" stroke-width=\"2\"/><rect x=\"30\" y=\"22\" width=\"16\" height=\"16\" rx=\"5\" fill=\"#D2433A\" stroke=\"#18264A\" stroke-width=\"2\"/><path d=\"M20 22q4-4 8 0\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\".6\"/><path d=\"M8 14l6 4M10 8l5 6M15 6l3 6\" stroke=\"var(--ink)\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>"};
const IKN={egg:'タマゴ',puni:'プニ',puniru:'プニル',koron:'コロン',moyan:'モヤン',garudon:'ガルドン',fuwarin:'フワリン',buden:'ブーデン',keketto:'ケケット',garudrago:'ガルドラゴ',sorafuwa:'ソラフワ',gorodon:'ゴロドン',yamikeke:'ヤミケケ'};
function stat(id){const g=k=>Save.get(k);
  try{
  if(id==='sudoku'){const b=g('sdBest')||{};const SH={easy:'易',normal:'普',hard:'難',oni:'鬼'};return 'ベスト '+['easy','normal','hard','oni'].map(k=>`${SH[k]} ${b[k]!=null?fmt(b[k]):'--:--'}`).join(' ')}
  if(id==='othello'){const r=g('otRec')||{};let w=0,l=0;for(const k in r){w+=r[k].w;l+=r[k].l}return `通算 ${w}勝${l}敗`+(r.hard?`（つよい ${r.hard.w}勝）`:'')}
  if(id==='slither'){const b=g('slBest')||{};return 'ベスト '+[5,6,7].map(n=>`${n}×${n} ${b[n]!=null?fmt(b[n]):'--:--'}`).join('　')}
  if(id==='picross')return `絵 ${(g('px_solved')||[]).length}/8・クリア ${g('px_count')||0}問`;
  if(id==='machigai'){const b=g('mg_best')||{};return `ベスト ふつう ${b.normal!=null?fmt(b.normal):'--:--'}・クリア ${g('mg_count')||0}問`}
  if(id==='runner')return `ベスト ${g('rnBest')||0}m`;
  if(id==='ito')return `ベスト ${g('itBest')||0}本`;
  if(id==='ikusei'){const s=g('ik_state');return s?`育成中：${IKN[s.form]||'？'}`:'まだタマゴをもらっていない'}
  if(id==='punch'){const r=g('pj_rec')||{};return `最高 ${r.best||0}連勝・通算 ${r.win||0}勝${r.lose||0}敗`}
  if(id==='cardbattle'){const r=g('cbRec')||{w:0,l:0};return `通算 ${r.w}勝${r.l}敗`}
  }catch(e){}
  return '';
}
const GM=Object.fromEntries(GAMES.map(g=>[g.id,g]));
let playing={};
function card(g){const fav=(Save.get('favs',[])||[]).includes(g.id);
  return `<a class="card" href="${g.url}">${ICON[g.id]||''}<div><h3>${esc(g.name)}${g.badge?`<span class="badge">${g.badge}</span>`:''}${playing[g.id]?`<span class="badge">途中${playing[g.id]}</span>`:''}</h3><p class="d">${esc(g.d)}</p><p class="s">${esc(stat(g.id))}</p></div>
    <button class="fav" type="button" data-fav="${g.id}" aria-pressed="${fav}" aria-label="お気に入り">${fav?'★':'☆'}</button></a>`}
async function render(){
  const all=(await Save.listPuzzles())||[];
  const inprog=all.filter(r=>r.status!=='clear');
  playing={};for(const r of inprog)playing[r.game]=(playing[r.game]||0)+1;
  // つづきから
  const last=Save.get('last',null),cont=$('#cont');
  let lastG=last&&GM[last.game]?last:null,recX=lastG&&lastG.id?all.find(r=>r.id===lastG.id):null;
  if(lastG&&lastG.id&&!recX){const alt=inprog[0];lastG=alt?{game:alt.game,id:alt.id,at:alt.updated}:null;recX=alt||null}
  if(lastG){const g=GM[lastG.game],rec=recX,last=lastG;
    {cont.hidden=false;cont.href=g.url+(rec&&rec.status!=='clear'?'?id='+encodeURIComponent(rec.id):'');
      cont.innerHTML=`${ICON[g.id]||''}<div><span>つづきから</span><b>${esc(rec?rec.title:g.name)}</b><span>${rec?(rec.status==='clear'?'クリア済み':'進み具合 '+Math.round((rec.progress||0)*100)+'%')+'・':''}${ago(last.at)}</span></div><span class="go">›</span>`}}
  else cont.hidden=true;
  // 途中の問題
  $('#savedWrap').hidden=!inprog.length;$('#savedN').textContent=inprog.length?`${inprog.length}件`:'';
  const show=inprog.slice(0,4);
  $('#saved').innerHTML=show.map(r=>{const g=GM[r.game];if(!g)return '';const p=Math.round((r.progress||0)*100);
    return `<a class="sv" href="${g.url}?id=${encodeURIComponent(r.id)}"><b>${esc(r.title)}</b><span>${p}%・${ago(r.updated)}</span><div class="pbar"><i style="width:${p}%"></i></div></a>`}).join('')
    +(inprog.length>show.length?`<button class="btn more" type="button" id="moreSaved">すべて見る（${inprog.length}件）</button>`:'');
  // 最近
  const rec=(Save.get('recent',[])||[]).filter(id=>GM[id]);
  $('#recentWrap').hidden=rec.length<2;
  $('#recent').innerHTML=rec.map(id=>`<a href="${GM[id].url}">${ICON[id]||''}<span>${esc(GM[id].name.length>6?GM[id].name.slice(0,6)+'…':GM[id].name)}</span></a>`).join('');
  // お気に入り・カテゴリ
  const favs=(Save.get('favs',[])||[]).filter(id=>GM[id]);
  $('#favWrap').hidden=!favs.length;$('#favs').innerHTML=favs.map(id=>card(GM[id])).join('');
  for(const c of ['brain','action','other'])$('#cat-'+c).innerHTML=GAMES.filter(g=>g.cat===c).map(card).join('');
  $('#bSound').textContent=Sfx.on?'音 オン':'音 オフ';$('#bSound').setAttribute('aria-pressed',String(Sfx.on));
}
document.addEventListener('click',async e=>{
  const f=e.target.closest('[data-fav]');
  if(f){e.preventDefault();e.stopPropagation();const id=f.dataset.fav;let a=Save.get('favs',[])||[];a=a.includes(id)?a.filter(x=>x!==id):[...a,id];Save.set('favs',a);render();return}
  if(e.target.id==='moreSaved'){showAllSaved();return}
});
async function showAllSaved(){
  const all=((await Save.listPuzzles())||[]).filter(r=>r.status!=='clear');
  $('#layer').innerHTML=`<div class="scrim" id="scr"><div class="sheet"><h3>途中の問題（${all.length}件）</h3><div class="slist">${all.map(r=>{const g=GM[r.game];if(!g)return '';const p=Math.round((r.progress||0)*100);
    return `<div class="sitem"><div class="t"><b>${esc(r.title)}</b><span>${ago(r.updated)}</span></div><div class="pbar"><i style="width:${p}%"></i></div>
    <div class="m">進み具合 ${p}%・プレイ時間 ${fmt(r.time||0)}</div><div class="a"><a class="btn primary" href="${g.url}?id=${encodeURIComponent(r.id)}">続ける</a><button class="btn danger" type="button" data-del="${esc(r.id)}">削除</button></div></div>`}).join('')}</div>
    <button class="btn" type="button" data-close style="padding:12px">閉じる</button></div></div>`;
  $('#scr').onclick=async ev=>{if(ev.target.id==='scr'||ev.target.closest('[data-close]')){closeLayer();render();return}
    const d=ev.target.closest('[data-del]');if(!d)return;if(!d.dataset.sure){d.dataset.sure='1';d.textContent='本当に削除する';return}
    await Save.delPuzzle(d.dataset.del);toast('削除しました');showAllSaved()};
}
$('#bSound').onclick=()=>{Sfx.set(!Sfx.on);if(Sfx.on)Sfx.play('ok');render()};
$('#bData').onclick=async()=>{
  const data=await Save.exportAll();const json=JSON.stringify(data);
  const code=btoa(unescape(encodeURIComponent(json)));
  const mig=Save.get('_migrated_v1',null),per=Save.get('_persist',null);
  const nP=(data.puzzles||[]).length;
  $('#layer').innerHTML=`<div class="scrim" id="scr"><div class="sheet data"><h3>データの保存と引き継ぎ</h3>
    <div class="info">保存先：${Save.backend==='idb'?'この端末のブラウザ（IndexedDB）':'この端末のブラウザ（簡易保存）'}<br>保存している問題：${nP}件<br>
    ${mig&&(mig.keys||mig.puzzles)?'以前の版のデータ：引き継ぎ済み（元のデータも残してあります）':'以前の版のデータ：なし'}<br>自動で消されにくい設定：${per&&per.ok?'有効':'ブラウザが許可していません'}</div>
    <p>別の端末へ移すときや、もしもの時のために、全部のゲームのデータを書き出せます。</p>
    <div class="row"><button class="btn primary" type="button" id="dlFile">ファイルに書き出す</button><button class="btn" type="button" id="cpCode">コードをコピー</button></div>
    <p class="note">読み込み：書き出したファイルを選ぶか、コードを貼り付けてください。「足し合わせる」は今のデータを残したまま、ない物と新しい物だけ取り込みます。</p>
    <input type="file" id="fIn" accept=".json,application/json" style="font-size:13px">
    <textarea id="codeIn" placeholder="コードを貼り付け"></textarea>
    <div class="row"><button class="btn primary" type="button" data-imp="merge">足し合わせる</button><button class="btn danger" type="button" data-imp="replace">すべて置き換える</button></div>
    <p class="msg" id="dmsg"></p><button class="btn" type="button" data-close style="padding:12px">閉じる</button></div></div>`;
  $('#dlFile').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const d=new Date();a.download=`sukima-box-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;document.body.appendChild(a);a.click();a.remove();$('#dmsg').textContent='書き出しました'};
  $('#cpCode').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('#dmsg').textContent='コピーしました'}catch(e){$('#codeIn').value=code;$('#codeIn').select();$('#dmsg').textContent='下の欄に表示しました。長押しでコピーしてください'}};
  $('#scr').onclick=async ev=>{
    if(ev.target.id==='scr'||ev.target.closest('[data-close]')){closeLayer();render();return}
    const b=ev.target.closest('[data-imp]');if(!b)return;
    if(b.dataset.imp==='replace'&&!b.dataset.sure){b.dataset.sure='1';b.textContent='今のデータを置き換える（もう一度押す）';return}
    let text=$('#codeIn').value.trim();const f=$('#fIn').files[0];
    try{let obj;
      if(f)obj=JSON.parse(await f.text());else if(text){try{obj=JSON.parse(text)}catch(_){obj=JSON.parse(decodeURIComponent(escape(atob(text))))}}
      else{$('#dmsg').className='msg warn';$('#dmsg').textContent='ファイルを選ぶか、コードを貼り付けてください';return}
      const r=await Save.importAll(obj,b.dataset.imp);$('#dmsg').className='msg win';$('#dmsg').textContent=`読み込みました（追加 ${r.added}件・更新 ${r.updated}件）`;render()}
    catch(err){$('#dmsg').className='msg warn';$('#dmsg').textContent='読み込めませんでした：'+(err.message||'形式が違います')}};
};
Save.ready.then(render);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
window.addEventListener('pageshow',e=>{if(e.persisted)render()});
regSW('sw.js');
</script>
</body>
</html>
