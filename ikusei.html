<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ドット育成｜すきま脳トレ箱</title>
<meta name="theme-color" content="#EBF0F6">

<style>
:root{
  --paper:#EBF0F6; --grid:#D9E1EC; --card:#FFFFFF; --ink:#18264A; --ink2:#5B6886; --line:#C2CDDD;
  --mark:#F7C843; --markInk:#18264A; --pen:#D2433A; --penBg:#FBE3E0; --pencil:#2F63D3; --ok:#2B8A57; --okBg:#DDF1E4;
  --peer:#E3E9F3; --cellX:#9AA6B8;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111827; --grid:#1A2335; --card:#1B2438; --ink:#E4E9F3; --ink2:#97A3BD; --line:#33405A;
  --mark:#F2C23A; --markInk:#18264A; --pen:#FF6B5F; --penBg:#3F2023; --pencil:#7FA6FF; --ok:#4FC283; --okBg:#173326;
  --peer:#232E46; --cellX:#6E7A92;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111827; --grid:#1A2335; --card:#1B2438; --ink:#E4E9F3; --ink2:#97A3BD; --line:#33405A;
  --mark:#F2C23A; --markInk:#18264A; --pen:#FF6B5F; --penBg:#3F2023; --pencil:#7FA6FF; --ok:#4FC283; --okBg:#173326;
  --peer:#232E46; --cellX:#6E7A92;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font-family:var(--body);color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:10px;padding-block:12px 8px}
.back{font:700 13px var(--body);color:var(--ink);text-decoration:none;padding:7px 12px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);white-space:nowrap}
.bar h2{font:400 19px var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font:700 14px var(--body);font-variant-numeric:tabular-nums;background:var(--mark);color:var(--markInk);padding:4px 10px;border-radius:6px;white-space:nowrap}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:8px 10px;font-weight:700;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
.btn.primary{background:var(--mark);color:var(--markInk)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.4}
.msg{text-align:center;min-height:1.5em;margin:8px 0;font-weight:700;font-size:14px}
.msg.win{color:var(--ok)} .msg.warn{color:var(--pen)}
.scrim{position:fixed;inset:0;background:rgba(10,16,32,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--paper);border-radius:16px 16px 0 0;border:2px solid var(--ink);border-bottom:0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font:400 22px var(--display);margin:0;text-align:center}
.sheet p{margin:0;font-size:13.5px;line-height:1.65}
.sheet .row{display:flex;gap:8px}
.sheet .row .btn{flex:1;padding:12px;font-size:14px}
.note{font-size:12px;color:var(--ink2);line-height:1.6}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

:root{--lcd:#C5D19B;--lcdDot:#2E3A1C;--lcdGhost:rgba(46,58,28,.07);--shell:#F7C843;--shellInk:#18264A}
#main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:18px}
.device{background:var(--shell);border:2.5px solid var(--shellInk);border-radius:44px 44px 36px 36px;padding:18px 18px 16px;box-shadow:4px 4px 0 var(--shellInk);display:flex;flex-direction:column;gap:10px}
.icons{display:flex;justify-content:space-between;gap:6px;padding:0 6px}
.icons span{font-size:11px;font-weight:900;color:var(--shellInk);opacity:.18;display:flex;align-items:center;gap:3px}
.icons span.on{opacity:1}
.icons span.on.alert{color:#B3261E;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.lcd{background:var(--lcd);border:3px solid var(--shellInk);border-radius:10px;position:relative;aspect-ratio:2/1;overflow:hidden}
.lcd canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lcd.dark{background:#6E7A55}
.namebar{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 6px;color:var(--shellInk)}
.namebar b{font:400 20px var(--display)}
.namebar span{font-size:12px;font-weight:700}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.act{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:13.5px;box-shadow:0 3px 0 var(--ink)}
.act small{font-size:10px;font-weight:500;color:var(--ink2)}
.act:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.act:disabled{opacity:.4}
.sub{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.say{min-height:1.5em;text-align:center;font-weight:700;font-size:14px;margin:0}
.st{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:12px}
.st dt{color:var(--ink2);font-weight:700}
.st dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.hearts{letter-spacing:2px;color:var(--pen)}
.meter{position:relative;height:42px;border:2px solid var(--ink);border-radius:10px;background:var(--card);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--okBg);border-left:2px solid var(--ok);border-right:2px solid var(--ok)}
.meter .needle{position:absolute;top:0;bottom:0;width:4px;background:var(--pen);border-radius:2px}
.hits{display:flex;gap:8px;justify-content:center;font:400 22px var(--display)}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dex div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700}
.dex canvas{width:40px;height:40px;image-rendering:pixelated;background:var(--lcd);border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <header class="bar"><a class="back" href="./">‹ 戻る</a><h2>ドット育成</h2><span class="timer" id="age">0日目</span></header>
  <section id="main">
    <div class="device">
      <div class="icons"><span id="iCall">！ よんでる</span><span id="iSick">＋ びょうき</span><span id="iWeak">… ぐったり</span><span id="iSleep">ｚ ねてる</span></div>
      <div class="lcd" id="lcd"><canvas id="cv"></canvas></div>
      <div class="namebar"><b id="name">タマゴ</b><span id="stage"></span></div>
    </div>
    <p class="say" id="say"></p>
    <div class="actions">
      <button class="act" id="aFood" type="button">ごはん<small>おなか＋1</small></button>
      <button class="act" id="aPro" type="button">プロテイン<small>ちから＋1</small></button>
      <button class="act" id="aTrain" type="button">トレーニング<small>きたえる</small></button>
      <button class="act" id="aClean" type="button">そうじ<small>うんちを流す</small></button>
      <button class="act" id="aMed" type="button">くすり<small>びょうきを治す</small></button>
      <button class="act" id="aLight" type="button">でんき<small>夜は消す</small></button>
    </div>
    <div class="sub">
      <button class="btn" id="bStat" type="button">ようす</button>
      <button class="btn" id="bDex" type="button">ずかん</button>
      <button class="btn" id="bHelp" type="button">あそびかた</button>
      <button class="btn" id="bTest" type="button">テスト用</button>
    </div>
  </section>
</div>
<div id="layer"></div>
<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('sukima_ik_'+k);return v!=null?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('sukima_ik_'+k,JSON.stringify(v))}catch(e){}}};
const MIN=60000,HOUR=60*MIN,DAY=24*HOUR;
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ================= sprites (16x16, monochrome LCD) ================= */
const SPR={
egg:['................','......####......','....##....##....','...#........#...','..#..##......#..','..#.####.....#..','.#...##.......#.','.#............#.','.#......##....#.','.#.....####...#.','.#......##....#.','..#..........#..','..#..........#..','...##......##...','.....######.....','................'],
puni:['................','................','................','................','................','......####......','....##....##....','...#........#...','..#..#....#..#..','..#..#....#..#..','..#..........#..','..#....##....#..','...#........#...','....########....','................','................'],
puniru:['................','................','...##......##...','...#.#....#.#...','...#..####..#...','..#..........#..','..#..##..##..#..','..#..##..##..#..','..#..........#..','..#...####...#..','..#....##....#..','...#........#...','...#.##..##.#...','....#..##..#....','................','................'],
koron:['................','....#......#....','....##....##....','...#..####..#...','..#..........#..','..#..##..##..#..','.#...##..##...#.','.#............#.','.#....####....#.','.#.....##.....#.','..#..........#..','..##........##..','..#.##....##.#..','..#...####...#..','..##........##..','................'],
moyan:['................','.....######.....','....#......#....','...#..#..#..#...','...#..#..#..#...','...#........#...','..#...####...#..','..#..........#..','.#............#.','.#............#.','.#.#........#.#.','..#.#......#.#..','...#.#.##.#.#...','....#.#..#.#....','.....#....#.....','................'],
garudon:['................','.......####.....','......#....#....','.....#..##..#...','.....#..##..#.#.','.....#......##..','....###....#....','...#...####.....','..#.##......#...','.#.#..#.....#...','.#....#.....#...','..##..#......#..','....#..#.....#..','....#..#..##.#..','...##..##.##.##.','................'],
fuwarin:['................','......####......','....##....##....','...#..#..#..#...','..#..........#..','..#....##....#..','.##...#..#...##.','#..#........#..#','#...#......#...#','.#...######...#.','..#..........#..','...#........#...','....##....##....','....#.#..#.#....','...##......##...','................'],
buden:['................','................','.....######.....','...##......##...','..#..#....#..#..','.#...#....#...#.','.#............#.','#......##......#','#.....#..#.....#','#......##......#','#..............#','.#............#.','.#..##....##..#.','..##..####..##..','................','................'],
keketto:['................','..#..........#..','..##........##..','..#.#.####.#.#..','...#........#...','..#..#....#..#..','..#..##..##..#..','..#..........#..','...#..####..#...','....#......#....','...#.#....#.#...','..#..######..#..','.....#....#.....','....##....##....','................','................'],
garudrago:['#..............#','##....####....##','#.#..#....#..#.#','#..##.#..#.##..#','#....#....#....#','.#...#.##.#...#.','..#...#..#...#..','...#..####..#...','....##....##....','....#.#..#.#....','...#..#..#..#...','..#...#..#...#..','..#..##..##..#..','...##......##...','................','................'],
sorafuwa:['................','.##....##....##.','#..#..#..#..#..#','#...##....##...#','.#....####....#.','..#..#....#..#..','...#.#.##.#.#...','....##....##....','.....#.##.#.....','....#......#....','...#..#..#..#...','...#..#..#..#...','....##....##....','................','................','................'],
gorodon:['...#..#..#..#...','...##########...','....########....','..##........##..','.#..#......#..#.','#...##....##...#','#..............#','#.....####.....#','#......##......#','#..............#','#..#........#..#','.#..##....##..#.','..##..####..##..','..#..#....#..#..','..###......###..','................'],
yamikeke:['.#............#.','.##..........##.','.#.#..####..#.#.','..#.#......#.#..','...#..#..#..#...','..#...#..#...#..','.#............#.','#....######....#','.#............#.','..##........##..','#...########...#','.#.#........#.#.','..#..#....#..#..','....##....##....','................','................'],
};
for(const k in SPR)SPR[k]=SPR[k].map(r=>r.padEnd(16,'.').slice(0,16));
const POOP=['..##..','.#..#.','.####.','#....#','######'];
const FORMS={
  egg:{name:'タマゴ',stage:'タマゴ',lv:0},
  puni:{name:'プニ',stage:'幼年期Ⅰ',lv:1},puniru:{name:'プニル',stage:'幼年期Ⅱ',lv:2},
  koron:{name:'コロン',stage:'成長期',lv:3},moyan:{name:'モヤン',stage:'成長期',lv:3},
  garudon:{name:'ガルドン',stage:'成熟期',lv:4},fuwarin:{name:'フワリン',stage:'成熟期',lv:4},buden:{name:'ブーデン',stage:'成熟期',lv:4},keketto:{name:'ケケット',stage:'成熟期',lv:4},
  garudrago:{name:'ガルドラゴ',stage:'完全体',lv:5},sorafuwa:{name:'ソラフワ',stage:'完全体',lv:5},gorodon:{name:'ゴロドン',stage:'完全体',lv:5},yamikeke:{name:'ヤミケケ',stage:'完全体',lv:5},
};
const DEX_ORDER=['egg','puni','puniru','koron','moyan','garudon','fuwarin','buden','keketto','garudrago','sorafuwa','gorodon','yamikeke'];
// per level: stage length, hunger/strength decay, poop interval (minutes), sleep window, base weight
const LV=[
  {dur:10*MIN,hun:0,poo:0,sleep:null,base:0},
  {dur:1*HOUR,hun:3,poo:4,sleep:null,base:5},
  {dur:1*DAY,hun:30,poo:60,sleep:[20,8],base:10},
  {dur:3*DAY,hun:60,poo:120,sleep:[21,8],base:20},
  {dur:5*DAY,hun:75,poo:180,sleep:[22,8],base:30},
  {dur:Infinity,hun:90,poo:200,sleep:[22,8],base:40},
];

/* ================= state ================= */
let S=store.get('state',null);
const clock=()=>Date.now()+(store.get('offset',0));
function fresh(){const t=clock();return {born:t,last:t,form:'egg',stageStart:t,hunger:4,str:4,weight:5,mist:0,train:0,totalMist:0,poop:0,sick:false,sickSince:0,weak:false,
  nextH:t,nextS:t,nextP:t,call:0,callCounted:false,lights:true,nightMissed:false,lightsSince:0,poopFull:0,zeroSince:0,seen:['egg'],gen:(S&&S.gen||0)+1}}
if(!S)S=fresh();
function save(){store.set('state',S);store.set('seen',[...new Set([...(store.get('seen',[])),...S.seen])])}
const lv=()=>FORMS[S.form].lv;
function isSleepTime(t){const w=LV[lv()].sleep;if(!w)return false;const h=new Date(t).getHours();return h>=w[0]||h<w[1]}
let events=[];
function evolve(t){
  const f=S.form;let n=null;
  if(f==='egg')n='puni';else if(f==='puni')n='puniru';
  else if(f==='puniru')n=S.mist<=2?'koron':'moyan';
  else if(f==='koron')n=S.train>=12&&S.mist<=2?'garudon':'fuwarin';
  else if(f==='moyan')n=S.weight>=34?'buden':'keketto';
  else if(f==='garudon')n='garudrago';else if(f==='fuwarin')n='sorafuwa';else if(f==='buden')n='gorodon';else if(f==='keketto')n='yamikeke';
  if(!n)return;
  if(lv()===4&&S.mist>5){S.stageStart=t-LV[4].dur+DAY;events.push('まだ完全体になれない…（お世話ミスが多い）');S.mist=Math.max(0,S.mist-2);return}
  S.form=n;S.stageStart=t;S.mist=0;S.train=0;S.weight=Math.max(S.weight,LV[lv()].base);
  if(lv()===1){S.hunger=2;S.str=2}
  S.nextH=t+LV[lv()].hun*MIN;S.nextS=t+LV[lv()].hun*1.2*MIN;S.nextP=t+LV[lv()].poo*MIN;
  if(!S.seen.includes(n))S.seen.push(n);
  events.push(f==='egg'?{text:`タマゴがかえった！ ${FORMS[n].name}が生まれた`,evo:{from:'egg',to:n}}:{text:`${FORMS[f].name}は ${FORMS[n].name}に 進化した！`,evo:{from:f,to:n}});
}
function step(t){
  const L=lv(),cfg=LV[L];
  const sleeping=isSleepTime(t);
  if(sleeping&&!S.sleeping){S.sleeping=true;S.lightsSince=t;S.nightMissed=false}
  if(!sleeping&&S.sleeping){S.sleeping=false;S.lights=true;events.push(`${FORMS[S.form].name}が 起きた`)}
  if(S.sleeping){
    if(S.lights&&!S.nightMissed&&t-S.lightsSince>=30*MIN){S.mist++;S.totalMist++;S.nightMissed=true;events.push('でんきを消し忘れた…（お世話ミス）')}
    S.nextH+=MIN;S.nextS+=MIN;S.nextP+=MIN;S.call=0;
  }else if(L>0){
    if(t>=S.nextH){S.hunger=Math.max(0,S.hunger-1);S.nextH+=cfg.hun*MIN}
    if(t>=S.nextS){S.str=Math.max(0,S.str-1);S.nextS+=cfg.hun*1.2*MIN}
    if(t>=S.nextP){S.poop=Math.min(4,S.poop+1);S.nextP+=cfg.poo*MIN*rnd(.8,1.2)}
    if(S.hunger===0||S.str===0){if(!S.call)S.call=t;if(t-S.call>=15*MIN&&!S.callCounted){S.mist++;S.totalMist++;S.callCounted=true;events.push('呼ばれていたのに ほうっておいた…（お世話ミス）')}}
    else{S.call=0;S.callCounted=false}
  }
  if(L>0){
    if(S.poop>=4){if(!S.poopFull)S.poopFull=t;if(!S.sick&&t-S.poopFull>=30*MIN){S.sick=true;S.sickSince=t;events.push('うんちだらけで びょうきになった')}}else S.poopFull=0;
    if(S.hunger===0&&S.str===0){if(!S.zeroSince)S.zeroSince=t}else S.zeroSince=0;
    const weakNow=(S.zeroSince&&t-S.zeroSince>=6*HOUR)||(S.sick&&t-S.sickSince>=12*HOUR);
    if(weakNow&&!S.weak){S.weak=true;events.push('ぐったりしている…')}
    if(S.weak&&S.hunger>=2&&S.str>=2&&!S.sick){S.weak=false;events.push('元気が戻った！')}
  }
  if(t-S.stageStart>=cfg.dur&&!(S.sleeping&&L>0))evolve(t);
}
function simulate(){
  const to=clock();let t=S.last;
  if(to-t>21*DAY)t=to-21*DAY;
  while(t+MIN<=to){t+=MIN;step(t)}
  S.last=t;
}

/* ================= LCD ================= */
const cv=$('#cv'),ctx=cv.getContext('2d');
const GW=32,GH=16;
let petX=8,petDir=1,flip=false,bounce=0,anim=null;
function sizeCanvas(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
function drawLCD(){
  const W=cv.width,H=cv.height,cell=Math.min(W/GW,H/GH),ox=(W-cell*GW)/2,oy=(H-cell*GH)/2;
  ctx.clearRect(0,0,W,H);
  const grid=Array.from({length:GH},()=>new Array(GW).fill(0));
  const put=(spr,x0,y0,fl)=>spr.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='#'){const gx=x0+(fl?15-x:x),gy=y0+y;if(gx>=0&&gx<GW&&gy>=0&&gy<GH)grid[gy][gx]=1}}));
  if(anim&&anim.type==='evo'){const ph=Math.floor(anim.t/150)%2;put(SPR[ph?anim.to:anim.from],8,0,false)}
  else{
    const sleeping=S.sleeping&&lv()>0;
    const px=sleeping||lv()===0?8:Math.round(petX);
    put(SPR[S.form],px,(bounce?-1:0)+(sleeping?1:0),!sleeping&&flip);
    if(sleeping){const z=Math.floor(Date.now()/600)%2;grid[1][26+z]=grid[1][27+z]=grid[2][27+z]=grid[3][26+z]=grid[3][27+z]=1}
    for(let i=0;i<Math.min(S.poop,2);i++)POOP.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='#'){const gx=26+x,gy=(i?4:10)+y;if(gy<GH)grid[gy][gx]=1}}));
    if(anim&&anim.type==='eat'){const n=anim.t<300?3:anim.t<600?2:anim.t<900?1:0;for(let i=0;i<n;i++)for(let j=0;j<2;j++)grid[11+j][2+i]=1}
    if(anim&&anim.type==='clean'){const x=Math.floor(anim.t/40);for(let y=0;y<GH;y++)if(x<GW)grid[y][GW-1-x]=1}
  }
  const dark=S.sleeping&&!S.lights;
  $('#lcd').classList.toggle('dark',dark);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){ctx.fillStyle=grid[y][x]?(dark?'rgba(20,26,12,.75)':'#2E3A1C'):'rgba(46,58,28,.07)';ctx.fillRect(ox+x*cell+cell*.06,oy+y*cell+cell*.06,cell*.88,cell*.88)}
}
setInterval(()=>{
  if(!anim&&!(S.sleeping)&&lv()>0){const max=S.poop?10:16;petX+=petDir*(Math.random()<.7?1:0);if(petX<=0||petX>=max||Math.random()<.12){petDir*=-1;flip=petDir<0}petX=Math.max(0,Math.min(max,petX));bounce=Math.random()<.3?1:0}
  else bounce=0;
  drawLCD();
},500);
function play(type,ms,extra){return new Promise(r=>{anim={type,t:0,...extra};const t0=performance.now();const iv=setInterval(()=>{anim.t=performance.now()-t0;drawLCD();if(anim.t>=ms){clearInterval(iv);anim=null;drawLCD();r()}},50)})}

/* ================= UI ================= */
let msgT=null;
function say(t){$('#say').textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>$('#say').textContent='',4000)}
async function flushEvents(){
  const list=events;events=[];
  for(const e of list){
    if(typeof e==='object'){say(e.text);await play('evo',1800,e.evo);render()}
    else{say(e);await new Promise(r=>setTimeout(r,1200))}
  }
}
function hearts(n){return '♥'.repeat(n)+'♡'.repeat(4-n)}
function ageDays(){return Math.floor((clock()-S.born)/DAY)}
function render(){
  const f=FORMS[S.form],L=lv();
  $('#name').textContent=f.name;$('#stage').textContent=f.stage+(S.gen>1?`・${S.gen}代目`:'');
  $('#age').textContent=`${ageDays()+1}日目`;
  $('#iCall').classList.toggle('on',!!S.call);$('#iCall').classList.toggle('alert',!!S.call);
  $('#iSick').classList.toggle('on',S.sick);$('#iSick').classList.toggle('alert',S.sick);
  $('#iWeak').classList.toggle('on',S.weak);
  $('#iSleep').classList.toggle('on',S.sleeping&&L>0);
  const egg=L===0,sl=S.sleeping&&L>0;
  for(const id of ['#aFood','#aPro','#aTrain'])$(id).disabled=egg||sl;
  $('#aClean').disabled=egg||!S.poop;$('#aMed').disabled=egg||!S.sick;$('#aLight').disabled=egg;
  $('#aLight').firstChild.textContent=S.lights?'でんき':'でんき';
  $('#aLight').querySelector('small').textContent=S.lights?'いまは点いている':'いまは消えている';
  drawLCD();save();
}
async function tick(){simulate();render();if(events.length)await flushEvents();render()}

async function act(fn){simulate();await flushEvents();await fn();render();save()}
$('#aFood').onclick=()=>act(async()=>{
  if(S.hunger>=4){S.over=(S.over||0)+1;if(S.over>=3){say('もう いらないって…');return}S.weight+=1;await play('eat',1000);say('おなかいっぱいなのに 食べた（体重＋1）');if(S.over>=2&&Math.random()<.25&&!S.sick){S.sick=true;S.sickSince=clock();say('食べすぎて びょうきになった')}return}
  S.over=0;S.hunger++;S.weight+=1;await play('eat',1000);say(`ごはんを食べた（おなか ${hearts(S.hunger)}）`)});
$('#aPro').onclick=()=>act(async()=>{
  if(S.str>=4){say('ちからは もう満タン');return}
  S.str++;S.weight+=2;await play('eat',1000);say(`プロテインを飲んだ（ちから ${hearts(S.str)}）`)});
$('#aClean').onclick=()=>act(async()=>{await play('clean',1300);S.poop=0;S.poopFull=0;say('ピカピカになった')});
$('#aMed').onclick=()=>act(async()=>{S.sick=false;S.sickSince=0;say('くすりを飲んで 元気になった')});
$('#aLight').onclick=()=>act(async()=>{S.lights=!S.lights;if(!S.lights&&S.sleeping)say('おやすみ…');else if(!S.lights)say('まだ眠くないみたい');else say('でんきを点けた')});

/* training mini game */
$('#aTrain').onclick=()=>{simulate();if(S.sleeping||lv()===0)return;
  const zoneW=Math.max(16,30-lv()*2),zoneL=rnd(10,90-zoneW);let pos=0,dir=1,hits=0,tries=0,raf=0,last=performance.now();
  $('#layer').innerHTML=`<div class="scrim"><div class="sheet"><h3>トレーニング</h3><p style="text-align:center">赤い線が緑の中に来たらタップ（3回）</p>
    <div class="meter" id="meter"><div class="zone" style="left:${zoneL}%;width:${zoneW}%"></div><div class="needle" id="needle"></div></div>
    <div class="hits" id="hits">○○○</div><button class="btn primary" id="hitBtn" type="button" style="padding:16px;font-size:16px">パンチ！</button></div></div>`;
  const loop=t=>{const dt=(t-last)/1000;last=t;pos+=dir*dt*(75+lv()*12);if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}$('#needle').style.left=`calc(${pos}% - 2px)`;raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
  $('#hitBtn').onclick=async()=>{
    const ok=pos>=zoneL&&pos<=zoneL+zoneW;if(ok)hits++;tries++;
    $('#hits').textContent=[0,1,2].map(i=>i<tries?(i<hits?'●':'×'):'○').join('');
    if(tries>=3){cancelAnimationFrame(raf);await new Promise(r=>setTimeout(r,400));$('#layer').innerHTML='';
      await act(async()=>{S.train++;if(hits>=2){S.str=Math.min(4,S.str+1);S.weight=Math.max(LV[lv()].base,S.weight-2);say(`トレーニング成功！（ちから ${hearts(S.str)}・体重−2）`)}
        else{S.weight=Math.max(LV[lv()].base,S.weight-1);say('トレーニングは失敗… でも少しやせた')}})}
  };
};

/* sheets */
function sheet(html){$('#layer').innerHTML=`<div class="scrim" id="scrim"><div class="sheet">${html}<button class="btn" type="button" data-a="close" style="padding:12px">閉じる</button></div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim'||e.target.closest('[data-a=close]'))$('#layer').innerHTML=''}}
$('#bStat').onclick=()=>{simulate();const f=FORMS[S.form],L=lv();
  const next=L>=5?'これ以上は進化しない':`あと約${Math.max(0,Math.ceil((LV[L].dur-(clock()-S.stageStart))/HOUR))}時間で進化`;
  sheet(`<h3>${f.name}のようす</h3><dl class="st">
    <dt>段階</dt><dd>${f.stage}（${next}）</dd><dt>年齢</dt><dd>${ageDays()}さい</dd><dt>体重</dt><dd>${S.weight}g</dd>
    <dt>おなか</dt><dd class="hearts">${hearts(S.hunger)}</dd><dt>ちから</dt><dd class="hearts">${hearts(S.str)}</dd>
    <dt>トレーニング</dt><dd>${S.train}回（この段階）</dd><dt>お世話ミス</dt><dd>${S.mist}回（この段階）</dd>
    <dt>体調</dt><dd>${S.sick?'びょうき':S.weak?'ぐったり':'元気'}</dd></dl>
    <p class="note">お世話ミスやトレーニング回数、体重で、進化先が変わります。</p>`)};
function sprCanvas(k,known){const c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');x.fillStyle=known?'#2E3A1C':'rgba(46,58,28,.25)';SPR[k].forEach((r,y)=>[...r].forEach((ch,xx)=>{if(ch==='#')x.fillRect(xx,y,1,1)}));return c}
$('#bDex').onclick=()=>{const seen=new Set([...store.get('seen',[]),...S.seen]);
  sheet(`<h3>ずかん（${DEX_ORDER.filter(k=>seen.has(k)).length}/${DEX_ORDER.length}）</h3><div class="dex" id="dex"></div>`);
  DEX_ORDER.forEach(k=>{const d=document.createElement('div');const known=seen.has(k);d.appendChild(sprCanvas(k,known));d.insertAdjacentHTML('beforeend',`<span>${known?FORMS[k].name:'？？？'}</span>`);$('#dex').appendChild(d)})};
$('#bHelp').onclick=()=>sheet(`<h3>あそびかた</h3>
  <p>タマゴから育てて、1〜2週間かけて完全体まで進化させます。アプリを閉じていても時間は進みます。</p>
  <p>・<b>おなか</b>と<b>ちから</b>のハートが0になると呼ばれます。15分ほうっておくとお世話ミスです。<br>
  ・夜になると眠ります。30分以内に<b>でんき</b>を消さないとお世話ミスです。朝は自動で起きます。<br>
  ・うんちを4つためると、びょうきになります。<b>くすり</b>で治ります。<br>
  ・ずっとほうっておくと<b>ぐったり</b>しますが、いなくなることはありません。お世話すると元気が戻ります。<br>
  ・お世話ミスの回数、トレーニングの回数、体重で進化先が変わります。全部で13種類。</p>
  <p class="note">Webアプリなので、スマホへの通知は届きません。ときどき様子を見に来てください。</p>`);
$('#bTest').onclick=()=>{sheet(`<h3>テスト用</h3><p class="note">時間を先に進めて、進化やお世話の流れを試せます。</p>
  <div class="row"><button class="btn" type="button" data-t="${HOUR}">1時間進める</button><button class="btn" type="button" data-t="${6*HOUR}">6時間</button><button class="btn" type="button" data-t="${DAY}">1日</button></div>
  <div class="row"><button class="btn" type="button" data-t="reset">タマゴからやり直す</button></div>`);
  $('#layer').querySelector('.sheet').addEventListener('click',async e=>{const b=e.target.closest('[data-t]');if(!b)return;
    if(b.dataset.t==='reset'){const g=S.gen;store.set('offset',0);S=fresh();S.gen=g+1;$('#layer').innerHTML='';say('新しいタマゴが来た');render();return}
    store.set('offset',store.get('offset',0)+ +b.dataset.t);$('#layer').innerHTML='';say('時間を進めた');await tick()})};

new ResizeObserver(()=>{sizeCanvas();drawLCD()}).observe($('#lcd'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
setInterval(tick,30000);
sizeCanvas();tick();
if(lv()===0&&!events.length)say('タマゴが ゆれている…');
</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body>
</html>
