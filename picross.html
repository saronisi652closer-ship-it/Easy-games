/* menu */
#menu{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:24px}

.pic .q{width:44px;height:44px;display:grid;place-items:center;font:400 22px var(--display);color:var(--ink2);background:var(--peer);border-radius:4px}
.pic span{font-size:11px;font-weight:700}
.pic small{font-size:10px;color:var(--ink2)}
.autos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:8px}

.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.board{display:grid;touch-action:none;user-select:none;-webkit-user-select:none}

.cell.f{background:var(--ink)}
.cell.x::before,.cell.x::after{content:"";position:absolute;left:22%;right:22%;top:50%;height:1.5px;background:var(--cellX);transform:rotate(45deg)}
.cell.x::after{transform:rotate(-45deg)}
.cell.bad{background:var(--penBg)} .cell.bad::before,.cell.bad::after{background:var(--pen)}
.cell.t5{border-right:2px solid var(--ink)} .cell.b5{border-bottom:2px solid var(--ink)}
.cell.l0{border-left:2px solid var(--ink)} .cell.top0{border-top:2px solid var(--ink)}

<script>
/* ===== Picross logic (shared by page and tests) ===== */
const PX_PAL={r:'#D2433A',o:'#E07B39',y:'#F2C23A',g:'#4FA35A',G:'#2E6B3A',b:'#4F86C6',B:'#2F4F86',n:'#8A5A36',k:'#2B2B33',p:'#EE8FB3',e:'#E8D9B8',w:'#9AA6B8'};
const PX_PICS=[
 {id:'heart',name:'ハート',rows:[
  '.r.r.',
  'rrrrr',
  'rrrrr',
  '.rrr.',
  '..r..']},
 {id:'tree',name:'木',rows:[
  '..g..',
  '.ggg.',
  'ggggg',
  '..n..',
  '.nnn.']},
 {id:'mush',name:'きのこ',rows:[
  '.rrr.',
  'rryrr',
  'yrrry',
  '..e..',
  '.ee..']},
 {id:'cat',name:'ねこ',rows:[
  'k........k',
  'kk......kk',
  'kkk....kkk',
  'kkkkkkkkkk',
  'kk.kkkk.kk',
  'kk.kkkk.kk',
  'kkkkkkkkkk',
  'kkkkppkkkk',
  '.kkk.kkkk.',
  '..kkkkkk..']},
 {id:'fish',name:'さかな',rows:[
  '..........',
  '....bb....',
  '...bbbb..b',
  '..bbbbbbbb',
  '.bbkbbbbbb',
  '.bbbbbbbbb',
  '..bbbbbbbb',
  '...bbbb..b',
  '....bb....',
  '..........']},
 {id:'umbrella',name:'かさ',rows:[
  '....r.....',
  '..rrrrr...',
  '.rrrrrrr..',
  'rrrrrrrrr.',
  'r.r.r.r.r.',
  '....n.....',
  '....n.....',
  '....n.....',
  '..n.n.....',
  '...n......']},
 {id:'star',name:'ほし',rows:[
  '....yy....',
  '....yy....',
  '...yyyy...',
  'yyyyyyyyyy',
  '.yyyyyyyy.',
  '..yyyyyy..',
  '..yyyyyy..',
  '.yyy..yyy.',
  '.yy....yy.',
  'yy......yy']},
 {id:'cup',name:'コーヒー',rows:[
  '..e.e.....',
  '...e......',
  '..........',
  'nnnnnnnn..',
  'nnnnnnnnnn',
  'nnnnnnnn.n',
  'nnnnnnnn.n',
  'nnnnnnnnnn',
  '.nnnnnn...',
  'eeeeeeeeee']},
];
function pxClues(line){const c=[];let r=0;for(const v of line){if(v)r++;else if(r){c.push(r);r=0}}if(r)c.push(r);return c.length?c:[0]}
function pxCluesOf(sol){const h=sol.length,w=sol[0].length;
  return {rows:sol.map(pxClues),cols:Array.from({length:w},(_,x)=>pxClues(sol.map(r=>r[x])))}}
// line solve: cells: -1 unknown, 0 empty, 1 filled. returns new array or null on contradiction
function pxSolveLine(clue,cells){
  const n=cells.length,k=(clue.length===1&&clue[0]===0)?[]:clue;
  const canF=new Array(n).fill(false),canE=new Array(n).fill(false);
  // memo: can place blocks i.. starting at pos p
  const memo=new Map();
  function ok(i,p){
    const key=i*(n+2)+p;if(memo.has(key))return memo.get(key);
    let res=false;
    if(i===k.length){res=true;for(let q=p;q<n;q++)if(cells[q]===1){res=false;break}
      if(res)for(let q=p;q<n;q++)canE[q]=true;memo.set(key,res);return res}
    const len=k[i];
    for(let s=p;s+len<=n;s++){
      // cells p..s-1 empty
      if(s>p&&cells[s-1]===1)break;
      let fits=true;for(let q=s;q<s+len;q++)if(cells[q]===0){fits=false;break}
      if(!fits)continue;
      if(s+len<n&&cells[s+len]===1)continue;
      const next=s+len+(s+len<n?1:0);
      if(ok(i+1,next)){res=true;for(let q=p;q<s;q++)canE[q]=true;for(let q=s;q<s+len;q++)canF[q]=true;if(s+len<n)canE[s+len]=true}
    }
    memo.set(key,res);return res;
  }
  if(!ok(0,0))return null;
  return cells.map((v,i)=>v!==-1?v:(canF[i]&&!canE[i]?1:(!canF[i]&&canE[i]?0:-1)));
}
// returns 'unique' if line logic solves fully, 'stuck' otherwise, 'bad' on contradiction
function pxLogicSolve(clues,h,w){
  const g=Array.from({length:h},()=>new Array(w).fill(-1));
  let changed=true;
  while(changed){changed=false;
    for(let y=0;y<h;y++){const r=pxSolveLine(clues.rows[y],g[y]);if(!r)return 'bad';for(let x=0;x<w;x++)if(r[x]!==g[y][x]){g[y][x]=r[x];changed=true}}
    for(let x=0;x<w;x++){const col=g.map(r=>r[x]);const r=pxSolveLine(clues.cols[x],col);if(!r)return 'bad';for(let y=0;y<h;y++)if(r[y]!==g[y][x]){g[y][x]=r[y];changed=true}}
  }
  return g.every(r=>r.every(v=>v!==-1))?'unique':'stuck';
}
function pxPicSol(p){return p.rows.map(r=>[...r].map(c=>c==='.'?0:1))}
/* ===== 自動生成：意味のある絵をランダムな大きさ・位置・向きで描き、唯一解になるものを出す ===== */
// 5×5 用の小さな絵（色文字は PX_PAL）
const PX_SMALL=[
 {name:'いえ',rows:['..r..','.rrr.','rrrrr','.e.e.','.eee.']},
 {name:'やじるし',rows:['..k..','.kkk.','k.k.k','..k..','..k..']},
 {name:'さかな',rows:['.bb.b','b.bbb','bbbbb','.bb.b','.....']},
 {name:'コップ',rows:['y...y','y...y','yyyyy','yyyyy','.yyy.']},
 {name:'ほし',rows:['..y..','yyyyy','.yyy.','.y.y.','y...y']},
 {name:'にこにこ',rows:['.kkk.','k.k.k','kkkkk','k...k','.kkk.']},
 {name:'つき',rows:['.yyy.','yy...','y....','yy...','.yyy.']},
 {name:'ちょうちょ',rows:['p...p','pp.pp','.ppp.','pp.pp','p...p']},
 {name:'とり',rows:['.k...','kkk.k','.kkkk','..kk.','..k..']},
 {name:'ロボット',rows:['kkkkk','k.k.k','kkkkk','.k.k.','kk.kk']},
 {name:'おにぎり',rows:['..w..','.www.','wwwww','wkkkw','.kkk.']},
 {name:'きのこ',rows:['.rrr.','rrrrr','r.r.r','.ee..','.ee..']},
 {name:'ハート',rows:['rr.rr','rrrrr','rrrrr','.rrr.','..r..']},
 {name:'木',rows:['.ggg.','ggggg','.ggg.','..n..','.nnn.']},
 {name:'かさ',rows:['.rrr.','rrrrr','..n..','..n..','.nn..']},
];
// 10×10・15×15 用：単位座標(0〜1)で描く絵
const PXM=(()=>{
  const P=(x,pts)=>{x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill()};
  const C=(x,cx,cy,r)=>{x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill()};
  const E=(x,cx,cy,rx,ry,rot=0)=>{x.beginPath();x.ellipse(cx,cy,rx,ry,rot,0,Math.PI*2);x.fill()};
  const R=(x,a,b,w,h)=>{x.fillRect(a,b,w,h)};
  const RR=(x,a,b,w,h,r)=>{x.beginPath();x.roundRect(a,b,w,h,r);x.fill()};
  const L=(x,w,pts)=>{x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.stroke()};
  const hole=(x,f)=>{x.save();x.globalCompositeOperation='destination-out';x.fillStyle='#000';x.strokeStyle='#000';f();x.restore()};
  const col=(x,c)=>{x.fillStyle=c;x.strokeStyle=c};
  return [
  {name:'コーヒー',d(x){col(x,'#8A5A36');RR(x,.12,.36,.58,.48,.08);L(x,.11,[[.7,.46],[.86,.5],[.86,.66],[.7,.7]]);col(x,'#C9B48E');R(x,.04,.86,.9,.09);col(x,'#9AA6B8');L(x,.08,[[.28,.3],[.24,.2],[.3,.1]]);L(x,.08,[[.5,.3],[.46,.2],[.52,.08]])}},
  {name:'りんご',d(x){col(x,'#D2433A');C(x,.36,.6,.3);C(x,.64,.6,.3);col(x,'#8A5A36');R(x,.46,.1,.08,.22);col(x,'#4FA35A');E(x,.66,.2,.15,.07,-.5)}},
  {name:'さかな',d(x){col(x,'#4F86C6');E(x,.42,.5,.34,.24);P(x,[[.66,.5],[.96,.24],[.96,.76]]);hole(x,()=>{C(x,.26,.44,.06);L(x,.05,[[.5,.32],[.5,.68]])})}},
  {name:'いえ',d(x){col(x,'#D2433A');P(x,[[.04,.48],[.5,.08],[.96,.48]]);col(x,'#8A5A36');R(x,.68,.12,.1,.22);col(x,'#E8D9B8');R(x,.14,.48,.72,.46);hole(x,()=>{R(x,.44,.64,.15,.3);R(x,.22,.56,.14,.14);R(x,.66,.56,.12,.14)})}},
  {name:'木',d(x){col(x,'#4FA35A');C(x,.5,.32,.26);C(x,.3,.48,.22);C(x,.7,.48,.22);col(x,'#8A5A36');R(x,.42,.58,.16,.38)}},
  {name:'ほし',d(x){col(x,'#F2C23A');const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?.2:.48;p.push([.5+Math.cos(a)*r,.54+Math.sin(a)*r])}P(x,p)}},
  {name:'ハート',d(x){col(x,'#D2433A');C(x,.31,.36,.22);C(x,.69,.36,.22);P(x,[[.1,.44],[.9,.44],[.5,.92]])}},
  {name:'つき',d(x){col(x,'#F2C23A');C(x,.48,.5,.42);hole(x,()=>C(x,.68,.38,.36))}},
  {name:'かさ',d(x){col(x,'#D2433A');x.beginPath();x.arc(.5,.48,.44,Math.PI,0);x.closePath();x.fill();col(x,'#8A5A36');L(x,.09,[[.5,.45],[.5,.84],[.46,.92],[.36,.92],[.32,.84]])}},
  {name:'おんぷ',d(x){col(x,'#2B2B33');E(x,.28,.8,.16,.12,-.3);E(x,.72,.7,.16,.12,-.3);R(x,.38,.18,.08,.62);R(x,.82,.1,.08,.58);P(x,[[.38,.18],[.9,.06],[.9,.22],[.38,.34]])}},
  {name:'かぎ',d(x){col(x,'#E0A92E');C(x,.27,.5,.22);R(x,.44,.43,.5,.13);R(x,.76,.54,.07,.17);R(x,.87,.54,.07,.13);hole(x,()=>C(x,.27,.5,.09))}},
  {name:'ベル',d(x){col(x,'#F2C23A');C(x,.5,.44,.28);R(x,.22,.44,.56,.3);R(x,.1,.7,.8,.09);C(x,.5,.86,.08);C(x,.5,.13,.06)}},
  {name:'きのこ',d(x){col(x,'#D2433A');x.beginPath();x.ellipse(.5,.52,.46,.42,0,Math.PI,0);x.closePath();x.fill();hole(x,()=>{C(x,.3,.36,.08);C(x,.62,.28,.07);C(x,.74,.46,.06)});col(x,'#E8D9B8');RR(x,.34,.52,.32,.42,.06)}},
  {name:'くるま',d(x){col(x,'#4F86C6');RR(x,.04,.44,.92,.28,.06);RR(x,.22,.22,.5,.26,.08);hole(x,()=>{R(x,.28,.28,.16,.14);R(x,.5,.28,.16,.14)});col(x,'#2B2B33');C(x,.27,.76,.13);C(x,.73,.76,.13)}},
  {name:'ロケット',d(x){col(x,'#9AA6B8');E(x,.5,.42,.18,.4);col(x,'#D2433A');P(x,[[.33,.55],[.14,.82],[.36,.76]]);P(x,[[.67,.55],[.86,.82],[.64,.76]]);col(x,'#E07B39');P(x,[[.4,.8],[.6,.8],[.5,.98]]);hole(x,()=>C(x,.5,.38,.08))}},
  {name:'ねこ',d(x){col(x,'#5B5B66');C(x,.5,.58,.36);P(x,[[.16,.42],[.2,.06],[.44,.28]]);P(x,[[.84,.42],[.8,.06],[.56,.28]]);hole(x,()=>{E(x,.35,.54,.06,.09);E(x,.65,.54,.06,.09);P(x,[[.45,.7],[.55,.7],[.5,.76]])})}},
  {name:'はな',d(x){col(x,'#EE8FB3');for(let i=0;i<5;i++){const a=-Math.PI/2+i*Math.PI*2/5;C(x,.5+Math.cos(a)*.18,.36+Math.sin(a)*.18,.14)}col(x,'#F2C23A');C(x,.5,.36,.1);col(x,'#4FA35A');L(x,.08,[[.5,.55],[.5,.96]]);E(x,.66,.8,.13,.06,-.5)}},
  {name:'あめ',d(x){col(x,'#9AA6B8');C(x,.3,.36,.18);C(x,.52,.28,.22);C(x,.74,.38,.17);R(x,.3,.36,.44,.2);col(x,'#4F86C6');for(const a of [.28,.5,.72])L(x,.07,[[a,.68],[a-.06,.86]])}},
  {name:'たいよう',min:15,d(x){col(x,'#E07B39');C(x,.5,.5,.24);for(let i=0;i<8;i++){const a=i*Math.PI/4;L(x,.09,[[.5+Math.cos(a)*.32,.5+Math.sin(a)*.32],[.5+Math.cos(a)*.46,.5+Math.sin(a)*.46]])}}},
  {name:'さくらんぼ',d(x){col(x,'#4FA35A');L(x,.06,[[.3,.66],[.52,.14]]);L(x,.06,[[.7,.6],[.52,.14]]);E(x,.66,.14,.13,.06,.3);col(x,'#D2433A');C(x,.28,.76,.17);C(x,.7,.7,.17)}},
  {name:'アイス',d(x){col(x,'#C98E5E');P(x,[[.28,.5],[.72,.5],[.5,.97]]);col(x,'#EE8FB3');C(x,.5,.38,.24);C(x,.32,.5,.1);C(x,.68,.5,.1)}},
  {name:'ヨット',d(x){col(x,'#C9B48E');P(x,[[.52,.06],[.52,.66],[.9,.66]]);P(x,[[.46,.18],[.46,.66],[.14,.66]]);col(x,'#D2433A');P(x,[[.06,.72],[.94,.72],[.78,.9],[.22,.9]])}},
  {name:'でんきゅう',d(x){col(x,'#F2C23A');C(x,.5,.38,.32);R(x,.36,.58,.28,.14);col(x,'#9AA6B8');R(x,.38,.72,.24,.16);R(x,.43,.88,.14,.06)}},
  {name:'しずく',d(x){col(x,'#4F86C6');C(x,.5,.64,.3);P(x,[[.22,.56],[.78,.56],[.5,.04]]);hole(x,()=>E(x,.38,.62,.06,.11,.3))}},
  {name:'ケーキ',d(x){col(x,'#E8D9B8');R(x,.12,.52,.76,.38);col(x,'#EE8FB3');R(x,.12,.46,.76,.1);col(x,'#D2433A');C(x,.5,.38,.1);col(x,'#4F86C6');R(x,.46,.1,.08,.2);col(x,'#E07B39');E(x,.5,.06,.04,.06)}},
  {name:'おにぎり',d(x){col(x,'#C7CFDA');x.beginPath();x.moveTo(.5,.08);x.quadraticCurveTo(.58,.08,.94,.8);x.quadraticCurveTo(.96,.9,.86,.9);x.lineTo(.14,.9);x.quadraticCurveTo(.04,.9,.06,.8);x.quadraticCurveTo(.42,.08,.5,.08);x.fill();col(x,'#2B2B33');R(x,.34,.6,.32,.3)}},
  {name:'ちょうちょ',d(x){col(x,'#8A5FB5');E(x,.3,.34,.22,.18,-.4);E(x,.7,.34,.22,.18,.4);E(x,.32,.7,.16,.13,.4);E(x,.68,.7,.16,.13,-.4);col(x,'#2B2B33');E(x,.5,.52,.06,.32);L(x,.04,[[.48,.22],[.38,.06]]);L(x,.04,[[.52,.22],[.62,.06]])}},
  {name:'とり',d(x){col(x,'#E07B39');E(x,.46,.6,.34,.26);C(x,.7,.36,.17);col(x,'#F2C23A');P(x,[[.84,.34],[.98,.4],[.84,.46]]);col(x,'#C25A2A');E(x,.38,.56,.16,.1,.3);hole(x,()=>C(x,.72,.32,.04))}},
  {name:'ペンギン',d(x){col(x,'#2B2B33');E(x,.5,.55,.3,.4);C(x,.5,.26,.2);hole(x,()=>{E(x,.5,.62,.18,.28);C(x,.42,.24,.04);C(x,.58,.24,.04)});col(x,'#E07B39');P(x,[[.44,.32],[.56,.32],[.5,.4]]);R(x,.32,.92,.14,.06);R(x,.54,.92,.14,.06)}},
  {name:'ギター',d(x){col(x,'#C98E5E');C(x,.38,.68,.24);C(x,.56,.5,.18);col(x,'#8A5A36');L(x,.08,[[.56,.5],[.9,.12]]);hole(x,()=>C(x,.44,.62,.07))}},
  ];
})();
function pxRaster(m,n,tf){
  const S=8,c=(typeof OffscreenCanvas!=='undefined')?new OffscreenCanvas(n*S,n*S):Object.assign(document.createElement('canvas'),{width:n*S,height:n*S});
  const x=c.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,n*S,n*S);
  const k=n*S*tf.s;x.setTransform(tf.flip?-k:k,0,0,k,tf.ox*n*S+(tf.flip?k:0),tf.oy*n*S);
  m.d(x);
  const d=x.getImageData(0,0,n*S,n*S).data,sol=[],colors=[];
  for(let y=0;y<n;y++){sol.push([]);colors.push([]);for(let xx=0;xx<n;xx++){let a=0,r=0,g=0,b=0;
    for(let yy=0;yy<S;yy++)for(let x2=0;x2<S;x2++){const i=((y*S+yy)*n*S+xx*S+x2)*4,al=d[i+3]/255;a+=al;r+=d[i]*al;g+=d[i+1]*al;b+=d[i+2]*al}
    const cov=a/(S*S),on=cov>=.45;sol[y].push(on?1:0);colors[y].push(on?`rgb(${Math.round(r/a)},${Math.round(g/a)},${Math.round(b/a)})`:null)}}
  return {sol,colors};
}
const pxRecent=[];
function pxGenerate(n){
  if(n<=5){
    for(const p of PX_SMALL.slice().sort(()=>Math.random()-.5)){
      if(pxRecent.includes(p.name)&&PX_SMALL.length>4)continue;
      const fl=Math.random()<.5,rows=fl?p.rows.map(r=>[...r].reverse().join('')):p.rows;
      const sol=rows.map(r=>[...r].map(c=>c==='.'?0:1));
      if(pxLogicSolve(pxCluesOf(sol),5,5)!=='unique')continue;
      pxRecent.push(p.name);if(pxRecent.length>6)pxRecent.shift();
      return {sol,colors:rows.map(r=>[...r].map(c=>c==='.'?null:PX_PAL[c])),name:p.name};
    }
    return null;
  }
  const order=PXM.slice().sort(()=>Math.random()-.5).filter(m=>!pxRecent.includes(m.name)&&!(m.min>n));
  for(const m of order){
    for(let t=0;t<8;t++){
      // 盤面いっぱい・中央寄せ。ずらすのは最大1マス
      const s=t<4?1:.94,flip=Math.random()<.5,j=()=>(Math.floor(Math.random()*3)-1)/n*(t<2?0:1);
      const tf={s,flip,ox:Math.max(0,Math.min(1-s,(1-s)/2+j())),oy:Math.max(0,Math.min(1-s,(1-s)/2+j()))};
      const r=pxRaster(m,n,tf);
      const cnt=r.sol.flat().filter(Boolean).length;if(cnt<n*n*.18)continue;
      if(pxLogicSolve(pxCluesOf(r.sol),n,n)==='unique'){pxRecent.push(m.name);if(pxRecent.length>8)pxRecent.shift();return {...r,name:m.name}}
    }
  }
  return null;
}

Save.ready.then(()=>{
const $=s=>document.querySelector(s);
const store=makeStore('px_');
const fmt=s=>{s=Math.floor(s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let P=null,tool=1,missOn=store.get('miss',false),hist=[],tAcc=0,tStart=null,tIv=null;

/* ---------- clock ---------- */
const now=()=>tAcc+(tStart?(performance.now()-tStart)/1000:0);
function clockRun(){if(tStart)return;tStart=performance.now();tIv=setInterval(()=>$('#time').textContent=fmt(now()),500);$('#time').textContent=fmt(now())}
function clockStop(){if(!tStart)return;tAcc=now();tStart=null;clearInterval(tIv);$('#time').textContent=fmt(tAcc)}

/* ---------- menu ---------- */
function thumb(sol,rows,colors){const h=sol.length,w=sol[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++)if(sol[y][xx]){x.fillStyle=rows?PX_PAL[rows[y][xx]]||'#2B2B33':(colors&&colors[y][xx])||getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();x.fillRect(xx,y,1,1)}
  return c}
function showMenu(){
  clockStop();if(P&&!P.done)save();P=null;
  $('#menu').hidden=false;$('#play').hidden=true;$('#time').hidden=true;$('#title').textContent='ピクロス';$('#back').href='../index.html';
  const solved=store.get('solved',[]);
  $('#pics').innerHTML='';
  PX_PICS.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='pic';const s=pxPicSol(p),done=solved.includes(p.id);
    if(done)b.appendChild(thumb(s,p.rows));else{const q=document.createElement('div');q.className='q';q.textContent='?';b.appendChild(q)}
    b.insertAdjacentHTML('beforeend',`<span>${done?p.name:'？？？'}</span><small>${s[0].length}×${s.length}</small>`);
    b.onclick=()=>startPic(p);$('#pics').appendChild(b)});
  const best=store.get('best',{});
  $('#autos').innerHTML=[5,10,15].map(n=>`<button class="auto" type="button" data-n="${n}"><b>${n}×${n}</b><small>ベスト ${best[n]!=null?fmt(best[n]):'--:--'}</small></button>`).join('');
  Save.listPuzzles('picross').then(list=>{const r=$('#resumes');const ip=(list||[]).filter(x=>x.status!=='clear');
    if(!ip.length){r.hidden=true;return}r.hidden=false;
    r.innerHTML=`<h3>つづきから <small style="font:500 12px var(--body);color:var(--ink2)">${ip.length}件</small></h3><div class="slist">${ip.slice(0,3).map(x=>{const p=Math.round((x.progress||0)*100);
      return `<button class="resume" type="button" data-rid="${esc(x.id)}">${esc(x.title)}<small>進み具合 ${p}%・${fmt(x.time)}・${ago(x.updated)}</small></button>`}).join('')}</div>
      <button class="btn" type="button" id="allSaved" style="margin-top:8px">保存した問題をすべて見る</button>`;
    r.onclick=e=>{const b=e.target.closest('[data-rid]');if(b){const x=ip.find(y=>y.id===b.dataset.rid);if(x)loadRec(x);return}
      if(e.target.id==='allSaved')openSaveList({game:'picross',onOpen:loadRec,onRestart:x=>{const d=x.data;loadRec({...x,data:{...d,marks:d.sol.map(rw=>rw.map(()=>0)),time:0,miss:0,done:false}})}})}})
}
$('#autos').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(b)startAuto(+b.dataset.n)});

/* ---------- start ---------- */
function startPic(p){const sol=pxPicSol(p);load({kind:'pic',id:p.id,sol,marks:sol.map(r=>r.map(()=>0)),time:0,miss:0})}
function startAuto(n){
  $('#msg').textContent='問題を作っています…';
  setTimeout(()=>{const g=pxGenerate(n);if(!g){$('#msg').textContent='問題を作れませんでした。もう一度選んでください';return}
    load({kind:'auto',sol:g.sol,colors:g.colors,name:g.name,marks:g.sol.map(r=>r.map(()=>0)),time:0,miss:0})},20);
}
function loadRec(rec){load({...rec.data,uid:rec.id,created:rec.created})}
function load(st){
  P=st;if(!P.uid){P.uid=Save.newId('picross');P.created=Date.now()}P.clues=pxCluesOf(P.sol);P.h=P.sol.length;P.w=P.sol[0].length;hist=[];
  $('#menu').hidden=true;$('#play').hidden=false;$('#time').hidden=false;$('#back').href='#';
  $('#title').textContent=P.kind==='pic'?`ピクロス ${P.w}×${P.h}`:`自動生成 ${P.w}×${P.h}`;
  tAcc=P.time||0;tStart=null;clockRun();build();render();
}
function save(){if(!P)return;P.time=now();const data={kind:P.kind,id:P.id,sol:P.sol,colors:P.colors,name:P.name,marks:P.marks,time:P.time,miss:P.miss,done:!!P.done};const m=Save.describe('picross',data);
  Save.putPuzzle({id:P.uid,game:'picross',...m,time:P.time,status:P.done?'clear':'play',created:P.created,data});Save.touch({game:'picross',id:P.uid,title:m.title})}

/* ---------- board ---------- */
let cells=[],rcs=[],ccs=[];
function build(){
  const b=$('#board'),{h,w,clues}=P;
  const maxR=Math.max(...clues.rows.map(c=>c.length)),maxC=Math.max(...clues.cols.map(c=>c.length));
  const st=$('#stage').getBoundingClientRect();
  const availW=Math.min(st.width,520),availH=st.height;
  let cs=Math.floor(Math.min(42,(availW-4)/(w+maxR*.62),(availH-4)/(h+maxC*.75)));
  cs=Math.max(cs,14);
  const fs=Math.max(9,Math.min(15,cs*.52));
  b.style.gridTemplateColumns=`${Math.ceil(maxR*fs*.95+6)}px repeat(${w},${cs}px)`;
  b.style.gridTemplateRows=`${Math.ceil(maxC*fs*1.2+4)}px repeat(${h},${cs}px)`;
  b.style.fontSize=fs+'px';
  b.innerHTML='';cells=[];rcs=[];ccs=[];
  b.appendChild(document.createElement('div'));
  for(let x=0;x<w;x++){const d=document.createElement('div');d.className='cc';d.innerHTML=clues.cols[x].map(v=>`<span>${v}</span>`).join('');b.appendChild(d);ccs.push(d)}
  for(let y=0;y<h;y++){
    const r=document.createElement('div');r.className='rc';r.innerHTML=clues.rows[y].map(v=>`<span>${v}</span>`).join('');b.appendChild(r);rcs.push(r);
    cells[y]=[];
    for(let x=0;x<w;x++){const c=document.createElement('div');c.className='cell';c.dataset.x=x;c.dataset.y=y;
      if(x===0)c.classList.add('l0');if(y===0)c.classList.add('top0');
      if((x+1)%5===0||x===w-1)c.classList.add('t5');if((y+1)%5===0||y===h-1)c.classList.add('b5');
      b.appendChild(c);cells[y][x]=c}
  }
  b.style.transform='';
  const br=b.getBoundingClientRect(),k=Math.min(1,(st.width-2)/br.width,(st.height-2)/br.height);
  if(k<1){b.style.transform=`scale(${k})`;b.style.transformOrigin='center center'}
}
function lineDone(line,clue){const c=pxClues(line);return c.length===clue.length&&c.every((v,i)=>v===clue[i])}
function render(hy=-1,hx=-1){
  const {h,w,marks,sol}=P;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const m=marks[y][x],c=cells[y][x];
    c.className=c.className.replace(/ ?\b(f|x|bad)\b/g,'');
    if(m===1)c.classList.add('f');else if(m===2)c.classList.add('x');else if(m===3)c.classList.add('x','bad')}
  for(let y=0;y<h;y++){rcs[y].classList.toggle('done',lineDone(marks[y].map(v=>v===1),P.clues.rows[y]));rcs[y].classList.toggle('hl',y===hy)}
  for(let x=0;x<w;x++){ccs[x].classList.toggle('done',lineDone(marks.map(r=>r[x]===1),P.clues.cols[x]));ccs[x].classList.toggle('hl',x===hx)}
  const m=$('#msg');m.className='msg'+(P.miss?' warn':'');
  m.textContent=missOn?`ミス ${P.miss}`:'数字の数だけ、続けて塗る';
}
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.classList.contains('cell')?[+el.dataset.y,+el.dataset.x]:null}
let drag=null;
function apply(y,x){
  const cur=P.marks[y][x];if(cur===3)return;
  const t=drag.target;
  if(t===0){if((cur===1)!==(drag.from===1)||cur===0)return;P.marks[y][x]=0;return}
  if(t===2&&cur===1)return;
  if(cur===t)return;
  if(t===1&&missOn&&P.sol[y][x]===0){P.marks[y][x]=3;P.miss++;return}
  P.marks[y][x]=t;
}
$('#board').addEventListener('pointerdown',e=>{
  if(!P||P.done)return;const c=cellAt(e);if(!c)return;e.preventDefault();
  const [y,x]=c,cur=P.marks[y][x];if(cur===3)return;
  hist.push(P.marks.map(r=>r.slice()));if(hist.length>200)hist.shift();
  drag={y,x,axis:null,from:cur,target:tool===1?(cur===1?0:1):(cur===2?0:(cur===1?-1:2))};
  if(drag.target===-1){drag=null;hist.pop();return}
  try{$('#board').setPointerCapture(e.pointerId)}catch(_){}
  apply(y,x);render(y,x);
});
$('#board').addEventListener('pointermove',e=>{
  if(!drag)return;const c=cellAt(e);if(!c)return;let [y,x]=c;
  if(!drag.axis&&(y!==drag.y||x!==drag.x))drag.axis=y!==drag.y?'v':'h';
  if(drag.axis==='v')x=drag.x;else if(drag.axis==='h')y=drag.y;
  const y0=Math.min(y,drag.y),y1=Math.max(y,drag.y),x0=Math.min(x,drag.x),x1=Math.max(x,drag.x);
  for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)apply(yy,xx);
  render(y,x);
});
function endDrag(){if(!drag)return;drag=null;render();check();save()}
$('#board').addEventListener('pointerup',endDrag);$('#board').addEventListener('pointercancel',endDrag);

function check(){
  const {h,w,marks,sol}=P;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if((marks[y][x]===1)!==(sol[y][x]===1))return;
  P.done=true;clockStop();P.time=tAcc;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(marks[y][x]!==1)marks[y][x]=2;
  render();
  store.set('count',store.get('count',0)+1);
  let newBest=false;
  if(P.kind==='pic'){const s=store.get('solved',[]);if(!s.includes(P.id)){s.push(P.id);store.set('solved',s)}}
  else{const b=store.get('best',{});if(b[w]==null||P.time<b[w]){b[w]=Math.floor(P.time);newBest=true;store.set('best',b)}}
  save();Sfx.play('clear');
  const pic=P.kind==='pic'?PX_PICS.find(p=>p.id===P.id):null;
  setTimeout(()=>{
    $('#layer').innerHTML=`<div class="scrim"><div class="sheet"><h3>${pic||P.name?`「${pic?pic.name:P.name}」でした！`:'クリア！'}</h3>
      <div class="reveal" id="rv"></div>
      <p style="text-align:center">タイム ${fmt(P.time)}${newBest?'　ベスト更新！':''}${missOn&&P.miss?`　ミス ${P.miss}`:''}</p>
      <div class="row"><button class="btn" type="button" data-a="quit">やめる</button><button class="btn primary" type="button" data-a="next">自動生成で続ける</button></div></div></div>`;
    const cv=thumb(P.sol,pic?pic.rows:null,P.colors);$('#rv').appendChild(cv);
    $('#layer').querySelector('.sheet').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const n=P.w;$('#layer').innerHTML='';
      if(b.dataset.a==='quit')showMenu();else startAuto(n)};
  },350);
}

/* ---------- controls ---------- */
$('#tool').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tool=+b.dataset.v;for(const x of $('#tool').children)x.setAttribute('aria-pressed',String(x===b))});
$('#miss').setAttribute('aria-pressed',String(missOn));
$('#miss').onclick=()=>{missOn=!missOn;store.set('miss',missOn);$('#miss').setAttribute('aria-pressed',String(missOn));if(P)render()};
$('#undo').onclick=()=>{if(!P||P.done||!hist.length)return;P.marks=hist.pop();render();save()};
$('#clear').onclick=()=>{if(!P||P.done)return;hist.push(P.marks.map(r=>r.slice()));P.marks=P.marks.map(r=>r.map(()=>0));P.miss=0;render();save()};
$('#quit').onclick=showMenu;
$('#back').addEventListener('click',e=>{if(P){e.preventDefault();showMenu()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(P&&!P.done){clockStop();save()}}else if(P&&!P.done)clockRun()});
window.addEventListener('pagehide',()=>{if(P&&!P.done)save()});
new ResizeObserver(()=>{if(P){build();render()}}).observe($('#stage'));
showMenu();
const _rid=getParam('id');if(_rid)Save.getPuzzle(_rid).then(r=>{if(r&&r.game==='picross')loadRec(r)});

});
</script>
